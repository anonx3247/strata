# `core`: what every program has without a `use`, below the standard
# library: the builtin types and functions the compiler provides, `Option`,
# `Result`, the traits and refinements every program names, and the code
# every program gets (iterators, channels' methods, a string's units).
# Built into `strata`, like std. It depends on nothing; std depends on it.
# Only `core` may declare `builtin` definitions.
name = "core"
auto_commit = false

# Modules whose every function is `noalloc` (checked: it allocates nothing,
# and calls only `noalloc` functions), as if each were marked: the runtime
# written in Strata (core.rt, the allocator, and the topic modules it uses,
# compiled together into the runtime, never with a program) and core.mem,
# the raw memory they are built on (its `builtin` functions: the compiler's
# promise).
noalloc = ["rt", "str", "int", "list", "fmt", "float", "gen", "fault", "run", "mem"]
