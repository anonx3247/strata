# cli.rs: merge_file_follows_renames_and_type_checks

# ours renames `area` (`strata rename`, in a package holding the base);
# theirs adds a caller of the old name. The three sides share the ids, so
# theirs' call reads as ours' name: nothing is guessed
[[step]]
save = "rename/o.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}
'''

[[step]]
run = ["sh", "-c", 'mkdir p && cd p && "$STRATA" init > /dev/null && cp ../o.strata main.strata && "$STRATA" rename area rect_area > /dev/null && cp main.strata ../a.strata']
dir = "rename"

[[step]]
run = ["sh", "-c", 'cp o.strata b.strata && printf "fn double_square(s: Int) -> Int {\n  area(s, s) * 2\n}\n" | "$STRATA" --file b.strata edit > /dev/null']
dir = "rename"

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "rename"
has = ["ours renamed area → rect_area"]

[[step]]
run = ["sh", "-c", "if head -c 6 a.strata | grep -q STRATA; then \"$STRATA\" view main --file a.strata; else cat a.strata; fi"]
dir = "rename"
has = ["rect_area(s, s) * 2"]
lacks = [" area(", "fn area"]

# renamed and edited on one side: still the same definition (its id)
[[step]]
save = "rename-edit/o.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}
'''

[[step]]
run = ["sh", "-c", 'mkdir p && cd p && "$STRATA" init > /dev/null && cp ../o.strata main.strata && "$STRATA" rename area rect_area > /dev/null && printf "/// width times height\nfn rect_area(w: Int, h: Int) -> Int {\n  h * w\n}\n" | "$STRATA" edit > /dev/null && cp main.strata ../a.strata']
dir = "rename-edit"

[[step]]
run = ["sh", "-c", 'cp o.strata b.strata && printf "fn double_square(s: Int) -> Int {\n  area(s, s) * 2\n}\n" | "$STRATA" --file b.strata edit > /dev/null']
dir = "rename-edit"

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "rename-edit"

[[step]]
run = ["sh", "-c", "if head -c 6 a.strata | grep -q STRATA; then \"$STRATA\" view main --file a.strata; else cat a.strata; fi"]
dir = "rename-edit"
has = ["rect_area(s, s) * 2", "h * w"]
lacks = [" area("]

# two new definitions with one name, one on each side: a name clash, said so
[[step]]
save = "clash/o.strata"
text = '''
fn square(s: Int) -> Int {
  s * s
}
'''

[[step]]
run = ["sh", "-c", 'cp o.strata a.strata && cp o.strata b.strata && printf "fn cube(s: Int) -> Int {\n  s * s * s\n}\n" | "$STRATA" --file a.strata edit > /dev/null && printf "fn cube(s: Int) -> Int {\n  square(s) * s\n}\n" | "$STRATA" --file b.strata edit > /dev/null']
dir = "clash"

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "clash"
fails = true
has = ["cube (a name clash: ours and theirs each add a different definition of this name; rename one)"]

# a new definition that merely looks like a deleted one is not a rename
[[step]]
save = "not-rename/o.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}
'''

[[step]]
save = "not-rename/a.strata"
text = '''
fn square(s: Int) -> Int {
  s * s
}

fn cube(s: Int) -> Int {
  s * s * s
}
'''

[[step]]
save = "not-rename/b.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}
'''

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "not-rename"
lacks = ["renamed"]

# each side checks on its own, but not together
[[step]]
save = "semantic/o.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}
'''

[[step]]
save = "semantic/a.strata"
text = '''
fn area(w: Int, h: Int, d: Int) -> Int {
  w * h * d
}

fn square(s: Int) -> Int {
  area(s, s, 1)
}
'''

[[step]]
save = "semantic/b.strata"
text = '''
fn area(w: Int, h: Int) -> Int {
  w * h
}

fn square(s: Int) -> Int {
  area(s, s)
}

fn double_square(s: Int) -> Int {
  area(s, s) * 2
}
'''

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "semantic"
fails = true
has = ["doesn't check", "double_square"]

# sides that aren't module files are left alone: ours stays
[[step]]
write = "text/o.strata"
text = "fn (\n"

[[step]]
write = "text/a.strata"
text = "fn (\nours\n"

[[step]]
write = "text/b.strata"
text = "fn (\n"

[[step]]
strata = ["merge-file", "o.strata", "a.strata", "b.strata", "a.strata"]
dir = "text"
fails = true
has = ["can't merge"]

[[step]]
run = ["cat", "a.strata"]
dir = "text"
stdout = "fn (\nours\n"
