# smt.rs: verify_doesnt_fuzz_what_holds_a_capability: a function taking a capability (or a value
# holding one) isn't fuzzed: only `strata run` makes one

[[step]]
save = "c.strata"
text = '''
from std.fs use Disk, Files

type Holder = { disk: Disk, n: Float }

type Outer = | Vacant | Full(Holder)

fn top(d: Disk, x: Float) -> Int
  ensures it >= 0 {
  float_bits(x)
}

fn opt(d: Option[Disk], x: Float) -> Int
  ensures it >= 0 {
  float_bits(x)
}

fn held(h: Holder) -> Int
  ensures it >= 0 {
  float_bits(h.n)
}

fn nested(o: List[Outer], x: Float) -> Int
  ensures it >= 0 {
  float_bits(x)
}

fn files(f: Files, x: Float) -> Int
  ensures it >= 0 {
  float_bits(x)
}

fn plain(x: Float) -> Int
  ensures it >= 0 {
  float_bits(x)
}
'''

[[step]]
run = ["sh", "-c", "cd \"$ROOT\" && STRATA_CACHE=\"$TMP/cache\" \"$STRATA\" verify --no-cache \"$TMP/c.strata\""]
any_code = true
has = ["- top                      skipped: it takes the capability `Disk`, which only `strata run` gives, so it isn't fuzzed", "- opt                      skipped: it takes the capability `Disk`, which only `strata run` gives, so it isn't fuzzed", "- held                     skipped: it takes the capability `Disk`, which only `strata run` gives, so it isn't fuzzed", "- nested                   skipped: it takes the capability `Disk`, which only `strata run` gives, so it isn't fuzzed", "- files                    skipped: it takes the capability `Files`, which only `strata run` gives, so it isn't fuzzed", "~ plain                    fuzzed: 200 cases"]
