# where the types don't decide, the constructor is asked for
[[step]]
write = "ask.src"
text = '''
fn both(n: Int) -> Result[Int, Int] { n }
'''

[[step]]
run = ["sh", "-c", "\"$STRATA\" --file ask.strata edit < ask.src"]
fails = true
has = ["both sides of the `Result` take it, so write `Ok(…)` or `Err(…)`"]

