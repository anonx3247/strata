# precedence: `!` loosest, `?` tightest
[[step]]
save = "prec.strata"
text = '''
type A = { a: Int }
type B = { b: Int }
fn f(x: A | B?) -> A | B ! Int | String { 0 }
fn g(x: (A | B)?) -> (A ! B) | Int { 0 }
'''

[[step]]
strata = ["--file", "prec.strata", "view", "main"]
has = ["fn f(x: A | Option[B]) -> Result[A | B, Int | String]", "fn g(x: Option[A | B]) -> Result[A, B] | Int"]
