[[step]]
save = "merged.strata"
text = '''
from std.error use Error

type TimedOut = { after: Int }
derive Error for TimedOut

fn attempt_a(k: Int) -> Int ! TimedOut {
  if k > 0 { TimedOut { after: k } } else { 1 }
}

fn attempt_b(k: Int) -> Int ! TimedOut {
  if k > 1 { TimedOut { after: k } } else { 2 }
}

fn both(k: Int) -> Int ! TimedOut {
  attempt_a(k)! + attempt_b(k)!
}

fn retried(k: Int) -> Int ! TimedOut | TimedOut {
  both(k)!
}

fn main() {
  for k in [1, 2] {
    n := both(k) except e {
      TimedOut => {
        print(f"{e.trace}")
        0
      },
    }
    print(f"{n}")
  }
  m := retried(2) except e {
    TimedOut => {
      print(f"{e.trace}")
      0
    },
  }
  print(f"{m}")
}
'''

[[step]]
strata = ["--file", "merged.strata", "run"]
stdout = '''
["attempt_a", "both"]
0
["attempt_a", "both"]
0
["attempt_a", "both", "retried"]
0
'''

