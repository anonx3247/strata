# codegen.rs: core_rt_that_doesnt_check_isnt_compiled: core.rt's code that doesn't check (it would
# allocate) is refused by `strata codegen --core-rt`, nothing defined

[[step]]
run = ["sh", "-c", "cp -R \"$ROOT/core\" core && \"$STRATA\" --file core render gen > gen.st && printf \"\\nfn too_big(x: I64) -> Bool {\\n  x < 1023 + 62\\n}\\n\" >> gen.st"]

[[step]]
strata = ["--file", "core/", "edit", "gen"]
from_tmp = "gen.st"
any_code = true

[[step]]
run = ["sh", "-c", "mkdir -p home && cp -R core home/core && cp -R \"$ROOT/std\" home/std && cd home && STRATA_HOME=\"$TMP/home\" \"$STRATA\" codegen --core-rt > ../ir.txt; grep -c \"^error: in core.gen.too_big: core.rt can.t allocate\" ../ir.txt; grep -c \"define \" ../ir.txt"]
any_code = true
stdout = '''
1
0
'''
