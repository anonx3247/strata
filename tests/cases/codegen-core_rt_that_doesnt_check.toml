# core.rt's code that doesn't check (it would allocate: core's strata.toml declares
# its runtime modules `noalloc`) is refused by `strata codegen --core-rt`, nothing defined

[[step]]
run = ["sh", "-c", "cp -R \"$ROOT/core\" core && \"$STRATA\" --file core view gen > gen.st && printf \"\\nfn too_big(x: I64) -> Bool {\\n  x < 1023 + 62\\n}\\n\" >> gen.st"]

[[step]]
strata = ["--file", "core/", "edit", "gen", "--as-given"]
from_tmp = "gen.st"
any_code = true

[[step]]
run = ["sh", "-c", "mkdir -p home && cp -R core home/core && cp -R \"$ROOT/std\" home/std && cd home && STRATA_HOME=\"$TMP/home\" \"$STRATA\" codegen --core-rt > ../ir.txt; grep -c \"^error: in core.gen.too_big: .too_big. is .noalloc. but allocates\" ../ir.txt; grep -c \"define \" ../ir.txt"]
any_code = true
stdout = '''
1
0
'''
