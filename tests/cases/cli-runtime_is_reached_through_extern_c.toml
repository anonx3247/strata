# The runtime's functions are `extern c` declarations in core.runtime, the
# values as compiled code holds them, with `assumed` contracts saying what
# the C does. A builtin whose body calls one compiles to that direct call.
# `verify --assumed` lists what proofs trust, by package; `verify` on core
# fuzzes the C against its contracts. Programs can't name core.runtime.

[[step]]
strata = ["--file", "$ROOT/core", "view", "runtime"]
has = ["extern c fn strata_str_trim(s: String) -> String\n  assumed ensures len(it) <= len(s)\n"]

[[step]]
strata = ["--file", "$ROOT/core", "verify", "--assumed"]
has = ["core: ", "core.runtime.strata_str_trim (C)", "ensures len(it) <= len(s)", "requires b != 0  (checked: panics outside it)"]

# the C, fuzzed against its contracts
[[step]]
strata = ["--file", "$ROOT/core", "verify", "core.runtime.strata_str_byte_slice"]
has = ["core.runtime.strata_str_byte_slice fuzzed"]

[[step]]
strata = ["--file", "$ROOT/core", "verify", "core.runtime.strata_int_add"]
has = ["core.runtime.strata_int_add fuzzed"]

[[step]]
save = "p.strata"
text = '''
/// One more than `x`.
fn next(x: Int) -> Int
  assumed ensures it > x
{
  x + 1
}

fn main() {
  print(next(byte_len(trim("  ab "))))
  print(byte_slice("héllo", 0, 3))
  print(sqrt(float(16)))
}
'''

[[step]]
strata = ["--file", "p.strata", "run"]
stdout = "3\nhé\n4.0\n"

# the program's own trusted contracts, then std's and core's
[[step]]
strata = ["--file", "p.strata", "verify", "--assumed"]
has = ["p.strata: 1 assumed contracts in 1 functions\n  next  ensures it > x\n", "std: ", "core: "]

[[step]]
save = "q.strata"
text = '''
from core.runtime use strata_str_trim

fn main() {
  print(strata_str_trim(" a "))
}
'''

[[step]]
strata = ["--file", "q.strata", "check"]
fails = true
has = ["there is no module `core.runtime`"]
