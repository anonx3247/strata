  "✓ area ", "✓ pick ", "✓ pick_area ", "✓ make ", "✓ describe ", "✓ is_sq ", "✓ lit ", "✓ nonzero ", "✓ variants ", "✓ opt ", "✓ self_eq ", "✓ common ",
  "✗ bad_area ", "✗ bad_make ", "✗ bad_describe ", "✗ always_sq ", "✗ bad_nonzero ", "✗ bad_variants ", "✗ bad_opt ", "✗ bad_eq ", "✗ bad_field ", "✗ bad_common ",
  "input:   Square { side: 1 }\n", "input:   C\n",
]
