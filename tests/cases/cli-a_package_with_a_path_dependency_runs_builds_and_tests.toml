# a package with a path dependency: `run`, `build` and `test --with-deps`
# compile the dependency's modules it reaches (`json`, `json.text`), its
# private functions too where its tests use them

[[step]]
write = "json/strata.toml"
text = "name = \"json\"\n[deps]\n"

[[step]]
strata = ["--file", "json/", "edit", "text"]
text = '''
pub fn k() -> Int { 1 }
fn helper() -> Int { 2 }
test "k" { assert k() + helper() == 3 }
'''

[[step]]
strata = ["--file", "json/", "edit", "main"]
text = '''
pub fn parse() -> Int { 1 }
test "parse" { assert parse() == 1 }
'''

[[step]]
write = "app/strata.toml"
text = "name = \"app\"\n[deps]\njson = { path = \"../json\" }\n"

[[step]]
strata = ["--file", "app/", "edit", "main"]
text = '''
from json use parse
use json.text
fn main() { print(parse() + text.k()) }
test "app" { assert parse() == 1 }
'''
any_code = true

[[step]]
strata = ["run"]
dir = "app"
stdout = "2\n"

[[step]]
strata = ["build", "-o", "appbin"]
dir = "app"

[[step]]
run = ["./app/appbin"]
memory = true
stdout = "2\n"

[[step]]
strata = ["test", "--with-deps"]
dir = "app"
has = ["✓ json: parse", "✓ json.text: k", "✓ app", "3 passed, 0 failed"]
