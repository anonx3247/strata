# cli.rs: mocks_for_tests: fakes for tests, declared as types; their implementations may leave
# methods out (they do nothing); for tests only; hidden from views unless asked

[[step]]
save = "m.strata"
text = '''
from std.fs use Files, FsError

/// An in-memory disk, for tests.
mock MemDisk = { files: Dict[String, String] = Dict[String, String] {} }

impl Files for MemDisk {
  fn read(self, path: String) -> Result[String, FsError] {
    Ok(get(self.files, path) ?? "nothing")
  }

  fn write(mut self, path: String, text: String) -> Result[(), FsError] {
    mut self.files.insert(path, text)
    Ok(())
  }
}

fn save_then_load(mut fs: Files, text: String) -> Result[String, FsError] {
  (mut fs.write("a.txt", text))!
  fs.read("a.txt")
}

test "saving then loading" {
  mut fs := MemDisk {}
  assert save_then_load(mut fs, "hi") == Ok("hi")
  x := fs.exists("a.txt")
  assert x || !x
}
'''

[[step]]
strata = ["--file", "m.strata", "view", "main"]
