# cli.rs: every_example_round_trips_through_render

[[step]]
strata = ["--file", "$ROOT/examples/bank.strata", "view", "main"]
capture = "bank.st"

[[step]]
save = "bank.strata"
from_tmp = "bank.st"

[[step]]
strata = ["--file", "bank.strata", "view", "main"]
out_file = "bank.st"

[[step]]
strata = ["--file", "bank.strata", "test"]

