# a package: one file per module; the text read back in, module by module,
# prints the same
[[step]]
strata = ["--file", "$ROOT/examples/tasks", "view", "--split", "t1"]

[[step]]
run = ["mkdir", "-p", "t2"]

[[step]]
run = ["cp", "$ROOT/examples/tasks/strata.toml", "t2/strata.toml"]

[[step]]
save = "t2/model.strata"
from_tmp = "t1/model.st"

[[step]]
save = "t2/memory.strata"
from_tmp = "t1/memory.st"

[[step]]
save = "t2/print.strata"
from_tmp = "t1/print.st"

[[step]]
strata = ["--file", "t2", "view", "--split", "t3"]

[[step]]
run = ["diff", "t1/model.st", "t3/model.st"]

[[step]]
run = ["diff", "t1/memory.st", "t3/memory.st"]

[[step]]
run = ["diff", "t1/print.st", "t3/print.st"]

[[step]]
strata = ["--file", "t2", "test"]
