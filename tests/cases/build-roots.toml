# Scoped allocation from roots, phase 1 (compiler/roots, docs/internals.md
# "Memory"): a program built with `--memory-sites` gives each allocation the
# region it would get, or the reason it stays counted, in the sites' table
# (the `root` column), and reports totals by root when it ends. A function's
# result takes its caller's verdict at run time (`result`). The same program
# built as usual frees everything.

[[step]]
save = "roots.strata"
from = "roots.st"

[[step]]
strata = ["--file", "roots.strata", "build", "--no-verify", "--memory-sites", "-o", "prog"]

[[step]]
run = ["sh", "-c", "STRATA_MEMORY_SITES=sites.tsv ./prog 2>roots.txt; awk -F'\t' '$3 == \"alloc\" { print $1 \"\t\" $4 \"\t\" $6 \"\t\" $7 }' sites.tsv; sed -n '/memory roots/,$p' roots.txt"]
out = "6 3 5 1 1\n5\tmain\tpush(keep, Big { a: i, b: 0, c: 0, d: 0, name: \"kept\" })\tfunction\n4\tmain\tBig { a: i, b: 0, c: 0, d: 0, name: \"last\" }\tcounted: replaced in a loop\n3\tmain\t[Big { a: i, b: 0, c: 0, d: 0, name: \"each\" }, make(i)]\tloop body\n3\tmake\t\tresult\n1\tmain\tBig { a: 0, b: 0, c: 0, d: 0, name: \"first\" }\tfunction\n1\tmain\tlen([Big { a: 9, b: 0, c: 0, d: 0, name: \"temp\" }])\tstatement\n1\tfill\tpush(acc, Big { a: n, b: 0, c: 0, d: 0, name: \"lent\" })\tcounted: grows a mut parameter\nmemory roots:                                                allocs   in arena      runtime     releases       nested\n  statement                                                       1          0           15           14            1\n  loop body                                                       6          0            6            3            6\n  function                                                        6          0            5            7            6\n  counted: replaced in a loop                                     4          0            0            5            0\n  counted: stored into a mut parameter                            0          0            0            1            0\n  counted: grows a mut parameter                                  1          0            0            0            0\n  releases in helpers called outside a release                                                                      0\n  scoped (codes 1-4), share of all                            72.2%                  100.0%        80.0%       100.0%\n"

[[step]]
strata = ["--file", "roots.strata", "build", "--no-verify", "-o", "plain"]

[[step]]
run = ["./plain"]
memory = true
stdout = "6 3 5 1 1\n"
