# cli.rs: loops_forget_variables_changed_anywhere_in_their_body: `bump(mut n)`
# inside a list literal changes `n`: the loop must not keep `n == 0`
[[step]]
save = "l.strata"
text = '''
fn bump(mut x: Int) -> Int {
  x = x + 1
  x
}

fn count() -> Int
  ensures it == 0
{
  mut n := 0
  mut i := 0
  while i < 3 {
    ys := [bump(mut n)]
    i = i + 1
  }
  n
}
'''

[[step]]
strata = ["--file", "l.strata", "verify"]
fails = true
has = ["✗ count"]
lacks = ["bug in the prover"]

# a built-in changing its receiver (`mut got.push(x)`, `mut e.insert(…)`)
# changes the variable too: neither loop keeps it as it was before
[[step]]
save = "m.strata"
text = '''
fn pushed(xs: List[Int]) -> List[Int]
  ensures len(it) == 0
{
  mut got := []
  for x in xs {
    mut got.push(x)
  }
  got
}

fn inserted(xs: List[Int], d: Dict[Int, Int]) -> Dict[Int, Int]
  ensures it == d
{
  mut e := d
  mut i := 0
  while i < len(xs) {
    mut e.insert(i, 1)
    i += 1
  }
  e
}
'''

[[step]]
strata = ["--file", "m.strata", "verify", "--no-write"]
fails = true
has = ["✗ pushed", "✗ inserted"]
lacks = ["bug in the prover"]
