text = '''
fn p(s: String) -> Result[Int, String] { Err(s) }
fn f() -> Option[Int] { Some(p("a")?) }'''

[[step]]
run = ["sh", "-c", "\"$STRATA\" --file qonresult.strata edit < qonresult.src && \"$STRATA\" --file qonresult.strata check"]
fails = true
has = ["`?` needs an Option"]

[[step]]
