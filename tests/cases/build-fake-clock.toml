# build.rs: programs built (`strata build`) and run with arguments, their
# output and exit code as recorded (tests/data/build/expected), every object
# freed (STRATA_MEMORY=check)

[[step]]
save = "fake-clock.strata"
from = "fake-clock.st"

[[step]]
strata = ["build", "fake-clock.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/fake-clock-fake-clock.out"

[[step]]
strata = ["run", "fake-clock.strata"]
memory = true
golden = "tests/data/build/expected/fake-clock-fake-clock.out"
