# A `for` over a list is searched as a `while` over its indexes would be
# (the `ensures` of the variable returned, over the elements visited so
# far: `n <= len(xs)`, every visited element a key, every kept one
# positive), but what that finds names the index and can't be written into
# a `for`, and `verify` searches nothing: those checks are fuzzed, and say
# which loop and variable they are about, and that a `while` over the
# indexes is what `strata fix` can search. (Undecided: IDEAS.md, "The
# invariant search runs where code is written".)
[[step]]
save = "f.strata"
text = '''
fn positives(xs: List[Int]) -> Int
  ensures it <= len(xs)
  ensures it >= 0 {
  mut n := 0
  for x in xs {
    if x > 0 {
      n += 1
    }
  }
  n
}

fn marked(xs: List[Int], d: Dict[Int, Int]) -> Dict[Int, Int]
  ensures all(xs, x -> it.contains(x))
  ensures len(it) >= len(d) {
  mut e := d
  for x in xs {
    mut e.insert(x, 1)
  }
  e
}

fn kept(xs: List[Int]) -> List[Int]
  ensures len(it) <= len(xs)
  ensures all(it, y -> y > 0) {
  mut got := []
  for x in xs {
    if x > 0 {
      mut got.push(x)
    }
  }
  got
}
'''

[[step]]
strata = ["--file", "f.strata", "verify", "--no-race", "--no-cache"]
has = [
  "~ positives",
  "after `for`, no invariant bounds `n`: write one, or loop with `while` over the indexes for `strata fix positives` to search for one",
  "~ marked",
  "~ kept",
]
lacks = ["✗ "]
