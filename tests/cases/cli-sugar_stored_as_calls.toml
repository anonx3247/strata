# Ranges, elements, slices, element assignments, comprehensions, `Dict` and
# `Set` literals and `loop` are stored as calls and `while true`
# (compiler/sugar), shown as written, and run as before; the round-trip law
# holds for the file (tools/roundtrip.sh).

[[step]]
write = "s.st"
text = '''
type P = { xs: List[Int], n: Int }

fn main() {
  print(f([1, 2, 3], Dict {}, 0))
}

fn f(xs: List[Int], d: Dict[String, Int], k: Int) -> Int {
  mut ys := xs
  ys[0] = 5
  ys[k + 1] += 2
  mut grid := [[1, 2], [3, 4]]
  grid[1][0] = 9
  mut ps := [P { xs: [1], n: 0 }]
  ps[0].n = 3
  ps[0].xs[0] = 4
  a := xs[1..3]
  b := xs[..2]
  c := xs[1..]
  e := [x * 2 for x in xs where x > 1]
  g := [(x, y) for x in xs for y in ys]
  h := Set { x for x in xs }
  i := Dict { "a": 1, "b": 2 }
  j := Dict[String, Int] {}
  l := Set { 1, 2 }
  m := Dict { s: 1 for s in ["q"] }
  mut t := 0
  for z in 0..=3 {
    t += z
  }
  loop {
    break
  }
  t
    + ys[0]
    + len(a)
    + len(b)
    + len(c)
    + len(e)
    + len(g)
    + len(h)
    + len(i)
    + len(j)
    + len(l)
    + len(m)
    + grid[1][0]
    + ps[0].n
    + ps[0].xs[0]
    + f2([1, 2, 3])[1..][0]
}

fn f2(xs: List[Int]) -> List[Int] {
  xs
}
'''

[[step]]
save = "s.strata"
from_tmp = "s.st"

[[step]]
strata = ["--file", "s.strata", "view", "main"]
out_file = "s.st"

[[step]]
strata = ["header", "s.strata", "--tree"]
has = ['Call { callee: Var("$core:set_at")', 'Call { callee: Var("$core:slice")', 'Call { callee: Var("$core:fold")', 'While { cond: BoolLit(true)']

[[step]]
strata = ["--file", "s.strata", "run"]
has = ["54"]

[[step]]
run = ["sh", "$ROOT/tools/roundtrip.sh", "--strata", "$STRATA", "s.strata"]
has = ["1 files, 0 differ"]

# a function named after a builtin that sugar calls is refused
[[step]]
save = "at.strata"
text = '''
fn at(xs: List[Int], i: Int) -> Int {
  i
}

fn main() {
  print(at([1], 0))
}
'''
fails = true

[[step]]
strata = ["--file", "at.strata", "check"]
has = ["ok: 2 definitions check"]
