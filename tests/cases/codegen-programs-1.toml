# codegen.rs: compiled_programs_do_what_rust_compiled_ones_do (part 1):
# built, run, and compared with what the build of llvm.rs printed
# (recorded in tests/data/build/expected/codegen-programs-NAME.out)

[[step]]
save = "console.strata"
from = "console.st"

[[step]]
strata = ["build", "console.strata", "-o", "console"]

[[step]]
run = ["./console"]
keep_stack = true
golden = "tests/data/build/expected/codegen-programs-console.out"

