# `xs[i] = v` on a `mut` list: `xs` becomes a list with element `i`
# replaced (a copy that held the old list keeps it), on places too
# (`s.counts[1]`, `grid[r][c]`, `s.items[0].qty`, a `mut` parameter's
# element), `+=` included; `set_at` is the same as a function. The tree
# keeps it as written (rendered back the same, `big[i] *= big[i]`
# included); the checker says what is wrong as written; a slice isn't a
# place.

[[step]]
save = "a.strata"
from = "a.st"

[[step]]
strata = ["--file", "a.strata", "view", "main"]
capture = "r.st"
has = [
  "  xs[2] += 5\n",
  "  grid[1][0] = 5\n",
  "  s.counts[1] = 3\n",
  "  s.items[0].qty = 42\n",
  "    xs[i] += 10\n",
  "  names[k] = names[0] + \"!\"\n",
  "    big[i] *= big[i]\n",
]

[[step]]
save = "r.strata"
from_tmp = "r.st"

[[step]]
strata = ["--file", "r.strata", "view", "main"]
out_file = "r.st"

[[step]]
strata = ["--file", "a.strata", "run"]
stdout = "[7, 2, 8]\n[7, 100, 8]\n[7, 2, 8]\n[[0, 0], [5, 0], [0, 9]]\nShop { items: [Item { name: \"a\", qty: 42 }, Item { name: \"c\", qty: 3 }], counts: [0, 3] }\n[7, 100, 18]\n[\"x\", \"x!\"]\n[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]\n-1\n0\n"

[[step]]
strata = ["build", "a.strata", "-o", "prog", "--no-verify"]

[[step]]
run = ["./prog"]
memory = true
stdout = "[7, 2, 8]\n[7, 100, 8]\n[7, 2, 8]\n[[0, 0], [5, 0], [0, 9]]\nShop { items: [Item { name: \"a\", qty: 42 }, Item { name: \"c\", qty: 3 }], counts: [0, 3] }\n[7, 100, 18]\n[\"x\", \"x!\"]\n[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]\n-1\n0\n"

[[step]]
save = "e.strata"
from = "e.st"
fails = true
has = [
  "error in a: cannot assign to `xs`: it is not mutable",
  "error in b: assigning `xs[0]`: expected `Int`, found `String`",
  "error in c: `s[0] = …`: only a list's elements can be assigned, and `s` is a `String`",
]
lacks = ["set_at"]

[[step]]
write = "s.st"
text = """
fn main() {
  mut xs := [1, 2]
  xs[0..1] = [3]
}
"""

[[step]]
run = ["sh", "-c", "\"$STRATA\" --file s.strata edit < s.st"]
fails = true
has = ["only a variable, a field or an element (`x`, `x.f`, `xs[i]`) can be assigned"]
