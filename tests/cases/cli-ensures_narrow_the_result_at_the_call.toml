strata = ["--file", "mbad.strata", "edit"]
text = '''
type Order =
  | Pending { id: Int }
  | Paid { id: Int, amount: Int }
  | Shipped { id: Int, tracking: String }

impl Order {
  fn shipped(self) -> Order
    ensures (it is Shipped) == (self is Paid || self is Shipped) {
    self
  }
  fn first_item(self) -> Option[Int] {
    None
  }
}

fn same(o: Option[Int]) -> Option[Int]
  ensures (it is Some) == (o is Some) {
  o
}

fn find(d: Dict[String, Int], k: String) -> Order
  ensures d.contains(k) ==> it is Shipped {
  Pending { id: 0 }
}

fn a(o: Order) -> Int {
  match o.shipped() {
    Shipped => 1,
  }
}

fn b(o: Order) -> Int {
  match o.first_item() {
    Some(x) => x,
  }
}

fn c(o: Option[Int]) -> Int {
  match o {
    None => match same(o) {
      None => 0,
      Some(x) => x,
    },
    Some(_) => 1,
  }
}

fn e(o: Order) -> Int {
  match o {
    Pending => o.shipped().amount,
    _ => 0,
  }
}

fn f(d: Dict[String, Int]) -> Int {
  find(d, "k").amount
}
'''
fails = true
has = [
  "error in b: non-exhaustive match on `Option[Int]`: `None` is not covered",
  "error in c: unreachable match arm `Some(x)`: the result is `None` here (from what its function ensures)",
  "error in e: `Pending` has no field `amount`, so not every `Paid | Pending` does (match on it first)",
]
lacks = ["error in a:", "error in f:"]
