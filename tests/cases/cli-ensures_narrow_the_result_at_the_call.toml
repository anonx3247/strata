# What a function or method says of its result's variant (`ensures o is
# Paid ==> it is Shipped`, `-> Order where it is Shipped`) narrows its calls'
# results:
# `strata check` reads a field only the narrowed variants have and covers a
# match on the call with the variants left; a field not every variant has is
# an error; `if o is Paid` narrows `o` in the branch taken. Where the
# condition is the solver's (`d.contains(k)`), `verify` proves the match
# covers the call; an `ensures` not proven is checked when the callee
# returns, so the narrowed read never sees another variant
[[step]]
strata = ["--file", "t.strata", "edit"]
text = '''
type Order =
  | Pending { id: Int }
  | Paid { id: Int, amount: Int }
  | Shipped { id: Int, tracking: String }

/// Ships a paid order.
fn ship(o: Order) -> Order
  ensures (it is Shipped) == (o is Paid || o is Shipped) {
  match o {
    Paid => Shipped { id: o.id, tracking: f"T{o.amount}" },
    _ => o,
  }
}

/// Always shipped.
fn shipped(id: Int) -> Order where it is Shipped {
  Shipped { id, tracking: "X" }
}

fn label(o: Order) -> String {
  match o {
    Paid => ship(o).tracking,
    Shipped => {
      s := ship(o)
      s.tracking
    },
    Pending => match ship(o) {
      Pending => "pending",
      Paid => "paid",
    },
  }
}

fn amount(o: Order) -> Int {
  if o is Paid {
    o.amount
  } else {
    0
  }
}

fn reset(o: Order) -> Int {
  match o {
    Paid => {
      mut s := ship(o)
      s = Pending { id: 0 }
      s.id
    },
    _ => o.id,
  }
}

fn lookup(d: Dict[String, Int], k: String) -> Option[Int]
  ensures (it is Some) == d.contains(k) {
  get(d, k)
}

fn known(d: Dict[String, Int], k: String) -> Int {
  if d.contains(k) {
    match lookup(d, k) {
      Some(v) => v,
    }
  } else {
    0
  }
}

fn main() {
  print(label(Paid { id: 1, amount: 5 }))
  print(label(Pending { id: 2 }))
  print(shipped(3).tracking)
  print(amount(Paid { id: 4, amount: 7 }) + reset(Paid { id: 5, amount: 1 }))
  print(known(Dict { "a": 1 }, "a") + known(Dict { "a": 1 }, "b"))
}
'''

[[step]]
strata = ["--file", "t.strata", "verify", "--checks", "--no-race"]
has = [
  "proven:  ensures it is Shipped == (o is Paid || o is Shipped)",
  "proven:  result of `shipped`: Order where it is Shipped",
  "✓ known                    proven (1 check)\n    proven:  some arm of the `match` matches",
]

[[step]]
strata = ["--file", "t.strata", "run"]
out = "T5\npending\nX\n7\n1\n"

[[step]]
strata = ["--file", "bad.strata", "edit"]
text = '''
type Order =
  | Pending { id: Int }
  | Paid { id: Int, amount: Int }
  | Shipped { id: Int, tracking: String }

fn ship(o: Order) -> Order
  ensures o is Paid ==> it is Shipped {
  match o {
    Paid => Shipped { id: o.id, tracking: "T" },
    _ => o,
  }
}

fn first[T](xs: List[T]) -> Option[T] {
  match xs {
    [x, ..] => Some(x),
    _ => None,
  }
}

fn tracking(o: Order) -> String {
  o.tracking
}

fn unshipped(o: Order) -> String {
  ship(o).tracking
}

fn pending(o: Order) -> Int {
  match o {
    Pending => match ship(o) {
      Shipped => 1,
    },
    Paid => match ship(o) {
      Shipped => 2,
      Pending => 3,
    },
    _ => match first([1]) {
      Some(x) => x,
    },
  }
}
'''
fails = true
has = [
  "error in tracking: `Pending` has no field `tracking`, so not every `Order` does (match on it first)",
  "error in pending: non-exhaustive match on `Order`: `Paid` is not covered",
  "error in pending: unreachable match arm `Pending`: the result is `Shipped` here (from what its function ensures)",
  "error in pending: non-exhaustive match on `Option[Int]`: `None` is not covered",
]
# `ship(o).tracking` with `o` not narrowed: the condition is left to verify
lacks = ["error in unshipped"]

