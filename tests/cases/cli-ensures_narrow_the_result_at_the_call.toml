# methods (a type's own, a trait's), `Option` narrowed by the checker, and a
# field read whose condition only verify decides (proven in `known`, refuted
# in `careless`, checked when it runs)
[[step]]
strata = ["--file", "m.strata", "edit"]
text = '''
type Order =
  | Pending { id: Int }
  | Paid { id: Int, amount: Int }
  | Shipped { id: Int, tracking: String }

impl Order {
  fn shipped(self) -> Order
    ensures (it is Shipped) == (self is Paid || self is Shipped) {
    match self {
      Paid => Shipped { id: self.id, tracking: f"T{self.amount}" },
      _ => self,
    }
  }
}

trait Ship {
  fn ship(self) -> Order
    ensures it is Shipped
}

impl Ship for Order {
  fn ship(self) -> Order {
    Shipped { id: self.id, tracking: "S" }
  }
}

fn by_method(o: Order) -> String {
  match o {
    Paid => o.shipped().tracking,
    _ => match o.ship() {
      Shipped => o.ship().tracking,
    },
  }
}

fn same(o: Option[Int]) -> Option[Int]
  ensures (it is Some) == (o is Some) {
  o
}

fn opt(o: Option[Int]) -> Int {
  match o {
    Some(_) => match same(o) {
      Some(v) => v,
    },
    None => 0,
  }
}

fn find(d: Dict[String, Int], k: String) -> Order
  ensures d.contains(k) ==> it is Shipped {
  if d.contains(k) {
    Shipped { id: 1, tracking: "F" }
  } else {
    Pending { id: 0 }
  }
}

fn known(d: Dict[String, Int], k: String) -> String {
  if d.contains(k) {
    find(d, k).tracking
  } else {
    ""
  }
}

fn careless(d: Dict[String, Int], k: String) -> String {
  find(d, k).tracking
}

fn main() {
  print(by_method(Paid { id: 1, amount: 5 }))
  print(by_method(Pending { id: 2 }))
  print(opt(Some(4)))
  d := Dict { "a": 1 }
  print(known(d, "a"))
  print(careless(d, "b"))
}
'''

[[step]]
strata = ["--file", "m.strata", "verify", "--checks", "--no-race"]
fails = true
has = [
  "✓ by_method                proven (3 checks)\n    proven:  field `tracking` of a call's result\n    proven:  some arm of the `match` matches\n    proven:  field `tracking` of a call's result",
  "✓ opt                      proven (1 check)",
  "✓ known                    proven (1 check)\n    proven:  field `tracking` of a call's result",
  "field `tracking` of a call's result: Pending { id: 0 } has no such field (stack: careless)",
]

[[step]]
strata = ["--file", "m.strata", "run"]
fails = true
has = [
  "T5\nS\n4\nF\n",
  "fault (Refinement): field `tracking` of a call's result: Pending { id: 0 } has no such field",
]

