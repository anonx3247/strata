# cli.rs: procedural_mutation_is_explicit

[[step]]
save = "m.strata"
text = '''
type Line = { qty: Int where 1 <= it && it <= 99 }
fn restock(mut line: Line, extra: Int) { line.qty = line.qty + extra }
fn sum(xs: List[Int]) -> Int {
  mut s := 0
  for x in xs { s = s + x }
  s
}
test "ok" {
  mut l := Line { qty: 2 }
  restock(mut l, 3)
  assert l.qty == 5
  assert sum([1, 2, 3]) == 6
}
test "refined" {
  mut l := Line { qty: 98 }
  restock(mut l, 5)
}
'''

[[step]]
strata = ["--file", "m.strata", "test"]
fails = true
has = ["✓ ok", "103 does not satisfy"]

