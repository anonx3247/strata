# a call that can change an argument says so: `mut` at the call site
[[step]]
save = "c.strata"
text = '''
type Line = { qty: Int }
trait Counter { fn tick(mut self) -> ()  fn peek(self) -> Int }
impl Counter for Line { fn tick(mut self) { self.qty = self.qty + 1 }  fn peek(self) -> Int { self.qty } }
fn restock(mut line: Line, extra: Int) { line.qty = line.qty + extra }
fn qty(line: Line) -> Int { line.qty }
fn unmarked() -> Int {
  mut l := Line { qty: 1 }
  restock(l, 2)
  l.qty
}
fn needless() -> Int {
  mut l := Line { qty: 1 }
  qty(mut l)
}
fn builtin() -> Int {
  mut xs := [1]
  len(mut xs)
}
fn receiver() -> Int {
  mut l := Line { qty: 1 }
  mut l.tick()
  restock(mut l, 1)
  l.qty
}
fn unmarked_receiver() {
  mut l := Line { qty: 1 }
  l.tick()
}
fn needless_receiver() -> Int {
  mut l := Line { qty: 1 }
  mut l.peek()
}
fn stray() -> Int {
  mut n := 1
  m := mut n
  m
}
type Box = { n: Int }
impl Box { fn bump(mut self) { self.n = self.n + 1 }  fn twice(mut self) { self.bump()
 mut self.bump() } }
fn own_unmarked() {
  mut b := Box { n: 1 }
  b.bump()
}
fn first(ls: List[Line]) -> Line { Line { qty: 1 } }
'''

[[step]]
strata = ["--file", "c.strata", "check"]
fails = true
has = ["in unmarked: `restock` can change its `mut line` parameter: write `mut l` to show that `l` may change", "in needless: `mut` on an argument of `qty`, but its parameter `line` is not `mut`", "in builtin:", "in unmarked_receiver: `tick` changes its receiver (`mut self`): write `mut l.tick(…)`", "in needless_receiver: `mut l.peek(…)`: `peek` doesn't change its receiver", "in stray: `mut n` marks an argument", "in own_unmarked: `bump` changes its receiver (`mut self`): write `mut b.bump(…)`", "in impl Box: `bump` changes its receiver (`mut self`): write `mut self.bump(…)`"]
lacks = ["in receiver"]

