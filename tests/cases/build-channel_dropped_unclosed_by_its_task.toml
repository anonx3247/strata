# A task drops a channel it made without closing its sender: the task
# panics as for any unclosed sender, and its end doesn't touch the freed
# channel (guard malloc faults on a use after free)

[[step]]
save = "made.strata"
from = "made.st"

[[step]]
strata = ["build", "made.strata", "-o", "prog", "--no-verify"]

[[step]]
run = ["./prog"]
env = { DYLD_INSERT_LIBRARIES = "/usr/lib/libgmalloc.dylib" }
code = 101
has = ["sent", "a task ended without closing its copy of a sender"]
