# cli.rs: capabilities_given_by_the_runtime: made only by the runtime, for `main` and tests that ask; capability
# traits for everything else

[[step]]
write = "p/strata.toml"
text = "name = \"p\"\n"

[[step]]
module = "clock"
into = "$TMP/p/"
text = '''
/// Reading the time.
pub capability trait Clock {
  fn now(self) -> Int
}

/// The machine's clock.
pub capability SystemClock {
  /// Seconds, as the system tells.
  fn seconds() -> Int {
    42
  }
}

impl Clock for SystemClock {
  fn now(self) -> Int {
    self.seconds()
  }
}

pub type Fixed = { at: Int }

impl Clock for Fixed {
  fn now(self) -> Int {
    self.at
  }
}

pub fn late(c: Clock) -> Bool {
  c.now() > 40
}
'''

[[step]]
module = "main"
into = "$TMP/p/"
text = '''
from clock use SystemClock, Fixed, late

fn main(sys: SystemClock) {
  print(f"{sys.seconds()} {late(sys)} {late(Fixed { at: 1 })}")
}

test "the real clock" (sys: SystemClock) {
  assert late(sys)
}

test "a fixed clock" {
  assert !late(Fixed { at: 1 })
}
'''

# the text round-trips
[[step]]
strata = ["--file", "p", "view", "clock"]
stdout = '''
/// Reading the time.
