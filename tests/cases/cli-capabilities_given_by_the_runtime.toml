'''

[[step]]
strata = ["--file", "p", "check"]

# the runtime makes it: compiled, built
[[step]]
strata = ["run", "p"]
stdout = "42 true false\n"

[[step]]
strata = ["--file", "p", "test"]
has = ["✓ the real clock", "2 passed"]

[[step]]
strata = ["build", "p", "-o", "clockprog"]

[[step]]
run = ["./clockprog"]
stdout = "42 true false\n"

# the capability's own code is trusted; code taking one is proven from its contracts
[[step]]
strata = ["--file", "p", "verify"]
any_code = true
has = ["assumed: `SystemClock` is a capability", "✓ main ", "clock.late"]
lacks = ["panicked"]

# nothing else makes one
[[step]]
module = "bad"
into = "$TMP/p/"
text = '''
from clock use SystemClock

fn forge() -> SystemClock {
  SystemClock {}
}

fn mocked() -> SystemClock {
  mock SystemClock
}

test "asks for an int" (n: Int) {
  assert n == 1
}
'''

[[step]]
strata = ["--file", "p", "check"]
fails = true
has = ["`SystemClock` is a capability: only the runtime makes one, for `main` or a test that asks for it (`system_clock: SystemClock`)", "`mock` needs a trait, found `clock.SystemClock`", "test parameter `n: Int`: a test asks only for capabilities"]

[[step]]
run = ["rm", "p/bad.strata"]

# its functions don't take `self`
[[step]]
strata = ["--file", "x.strata", "edit"]
text = "capability C {\n  fn f(self) -> Int {\n    1\n  }\n}\n"
fails = true
has = ["a capability's functions don't take `self`"]

# std's: `main` names `Disk` and `Process`, and calls their traits' methods
# without the traits imported; `Files` itself is for code below `main`
[[step]]
save = "std_caps.strata"
text = '''
from std.fs use Disk
from std.process use Process

fn main(mut disk: Disk, process: Process) {
  mut disk.write("cap.txt", "hi") except { () }
  print(disk.read("cap.txt") except { "?" })
  mut disk.remove("cap.txt") except { () }
  print(disk.exists("cap.txt"))
  print(len(process.args()))
}
'''

[[step]]
strata = ["run", "std_caps.strata", "--", "a", "b"]
stdout = "hi\nfalse\n2\n"

[[step]]
save = "asks_files.strata"
text = '''
from std.fs use Files

fn main(files: Files) {
  print(files.exists("x"))
}
'''

[[step]]
strata = ["run", "asks_files.strata"]
fails = true
has = ["Name the capability instead, `disk: Disk` (std.fs), and pass it where `Files` is wanted"]
