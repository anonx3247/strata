# build.rs: programs built (`strata build`) and run with arguments, their
# output and exit code as recorded (tests/data/build/expected), every object
# freed (STRATA_MEMORY=check)

[[step]]
save = "mut_field_breaks_invariant.strata"
from = "mut_field_breaks_invariant.st"

[[step]]
strata = ["build", "mut_field_breaks_invariant.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/dyn-mut_field_breaks_invariant.out"

