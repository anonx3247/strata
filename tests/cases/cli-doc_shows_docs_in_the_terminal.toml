# a module of std
[[step]]
strata = ["doc", "std.json"]
env = { NO_COLOR = "1" }
has = ["std.json\n========\n", "    fn parse(text: String) -> Result[JsonValue, String]\n"]

# a definition of the program: its signature, contracts and doc
[[step]]
strata = ["--file", "shop/", "doc", "total"]
env = { NO_COLOR = "1" }
stdout = '''
orders.total
============

    fn total(o: Order) -> Int
      ensures it >= 0

What an order costs, in cents: each line's `price` times its `count`.
'''

[[step]]
strata = ["--file", "shop/", "doc", "Order.size"]
env = { NO_COLOR = "1" }
has = ["    fn size(self) -> Int\n\nHow many lines it has.\n"]

# a builtin, with its cost
[[step]]
strata = ["doc", "Dict.insert"]
env = { NO_COLOR = "1" }
stdout = '''
core.builtins.insert
====================

    builtin fn insert[K, V](mut d: Dict[K, V], k: K, v: V)
      ensures d.get(k) == Some(v)

`mut d.insert(k, v)`: adds `k`, or replaces its value. Cost: O(1) amortized, in
place when nothing else holds `d`. Else O(n) to copy the entries and their
index; the next changes are then in place.
'''

# a name in several modules: the candidates
[[step]]
strata = ["doc", "parse"]
env = { NO_COLOR = "1" }
has = [
  "`parse` names definitions in several modules:\n",
  "  - `std.json.parse`: Parses JSON text.\n",
  "  - `std.regex.parse`: A pattern read as a `Regex`, or why it isn't one.\n",
]

[[step]]
strata = ["doc", "std.json.parse"]
env = { NO_COLOR = "1" }
has = ["Parses JSON text."]
lacks = ["several modules"]

# nothing of that name
[[step]]
strata = ["doc", "no_such_thing_anywhere"]
fails = true
has = ["`no_such_thing_anywhere` names no page, module or definition"]

[[step]]
strata = ["doc", "language", "traits"]
fails = true
has = ["`strata doc` takes one topic"]

# writing reference pages is `docgen`'s
[[step]]
strata = ["doc", "--man"]
fails = true
has = ["`strata doc` takes no option `--man`"]
