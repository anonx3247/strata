# a check's site is its expression's text (`text.check_site`), so the
# proofs of two places with the same text in a function can't be told
# apart: two proofs at `xs[i]` may be of one place, the other not proven,
# and both checks stay
[[step]]
save = "two.strata"
text = '''
fn pick(xs: List[Int], i: Int) -> Int
    requires 0 <= i && i < len(xs)
{
    xs[i] + xs[i]
}

fn main() {
    print(pick([1, 2, 3], 1))
}
'''

[[step]]
write = "proofs.txt"
text = '''
proven-at	pick	594299182	index in range
proven-at	pick	594299182	index in range
entry	pick	requires 0
'''

[[step]]
run = ["sh", "-c", "cd \"$ROOT\" && \"$STRATA\" codegen --proofs \"$TMP/proofs.txt\" \"$TMP/two.strata\" | awk '/^define i64 @\"strata:pick\"/,/^}/' | grep -c C081B46CB90CB63 || true"]
stdout = '''
2
'''
