[[step]]
save = "neg.strata"
text = '''
fn shifted(n: Int) -> Int {
  1 << n
}

fn low(x: Int) -> Int
  requires x >= 0
  ensures it <= 255
{
  x & 255
}

fn kind(n: Int) -> Int {
  match n {
    where (it | 1) == 3 | 0 => 1,
    _ => 2,
  }
}


type Flags = Int
  where (it | 15) == 15

fn same(x: Flags) -> Flags {
  x
}
'''

[[step]]
strata = ["--file", "neg.strata", "verify", "--cases", "10"]
any_code = true
has = ["✗ shifted", "by a negative number of bits", "✓ low", "✓ kind", "✓ same"]

# a bit operation compared keeps its parentheses
[[step]]
strata = ["--file", "neg.strata", "render"]
has = ["where (it | 1) == 3 | 0 => 1,", "where (it | 15) == 15", "x & 255"]
