# cli.rs: bit_operators: as Python's (two's complement), with Rust's precedence; a negative shift
# is a fault, and `verify` finds it

[[step]]
save = "bits.strata"
text = '''
fn show3(a: Int, b: Int) {
  print(f"{a & b} {a | b} {a ^ b}")
}

fn show2(a: Int, k: Int) {
  print(f"{a << k} {a >> k}")
}

fn main() {
  show3(12, 10)
  show3(-12, 10)
  show3(-1, 1180591620717411303429)
  show3(18446744073709551619, -36893488147419103232)
  show3(7, 0)
  show2(1, 70)
  show2(-5, 1)
  show2(-5, 3)
  show2(1180591620717411303424, 69)
  show2(-1180591620717411303425, 68)
  show2(3, 0)
  print(1 + 2 << 3 & 7 | 8 ^ 1)
  print(-1 & 255 == 255)
}
'''

[[step]]
strata = ["--file", "bits.strata", "run"]
stdout = '''
