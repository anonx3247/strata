text = '''
/// One more.
fn bump(mut n: Int)
  ensures n == old n + 1 {
  n += 1
}

/// Two more, through `bump`'s contract.
fn bump_twice(mut n: Int)
  ensures n == old n + 2 {
  bump(mut n)
  bump(mut n)
}

/// Adds `x` at the end.
fn push_one(mut xs: List[Int], x: Int)
  ensures len(xs) == old len(xs) + 1 {
  xs += [x]
}

/// Says it adds one, but leaves out what isn't positive.
fn push_positive(mut xs: List[Int], x: Int)
  ensures len(xs) == old len(xs) + 1 {
  if x > 0 {
    xs += [x]
  }
}

/// `old` takes a unary expression: `old (a + b)` reads the sum before.
fn shift(mut a: Int, mut b: Int)
  ensures a + b == old (a + b) && a == old b && b == old a {
  t := a
  a = b
  b = t
}

type Tally = { n: Int }

trait Counter {
  fn total(self) -> Int
  fn incr(mut self)
    ensures self.total() == old self.total() + 1
}

impl Counter for Tally {
  fn total(self) -> Int = self.n

  fn incr(mut self) {
    self.n += 1
  }
}

/// Any counter, through the trait's contract.
fn incr_twice[C: Counter](mut c: C)
  ensures c.total() == old c.total() + 2 {
  mut c.incr()
  mut c.incr()
}

fn main() {
  mut k := 3
  bump_twice(mut k)
  print(k)
  mut t := Tally { n: 0 }
  incr_twice(mut t)
  print(t.n)
  mut ys := [1]
  push_one(mut ys, 2)
  push_positive(mut ys, 0)
  print(ys)
}
'''

