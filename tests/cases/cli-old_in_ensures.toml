# parameters and `mut self`. Written and read back; checked where it may go
# (only an `ensures`, once, over what the function starts with); a needless
# one (naming no `mut` parameter) is a warning `strata fix` drops; proven by
# verify over the values before and after, at call sites through the
# callee's contract (a trait method's too, from a generic caller); refuted
