# `verify` searches for no loop invariant: loops get those derived from
# their code and those written. The search runs where code is written:
# `edit` searches the loops of the functions it changes whose checks the
# derived invariants don't prove, and writes what it finds into the code
# as `invariant` clauses, with a warning. A loop whose invariants are
# derived stays as written (`early`: `i <= 10` is derived from its code).
# (`lx.at` goes up by 1 or 2 a pass, so `lx.at <= n` isn't derived:
# `quoted_end`'s `ensures` fails without it.) Code written otherwise
# (`edit --no-search` here) fails the check, and `verify` says which loop
# and variable it is about, and that `strata fix NAME` searches; `fix`
# then writes what the search finds. std is never written: only the
# program edited is.

[[step]]
strata = ["--file", "q.strata", "edit"]
from = "q.st"
has = [
  '''warning: in `quoted_end`: added `invariant lx.at <= n` to `while lx.at < n && char_at(lx, lx.at) != "\"" && col >= 0` (found by search)''',
]
lacks = ["in `early`: added"]

[[step]]
strata = ["--file", "q.strata", "view", "main"]
has = ['''  while lx.at < n && char_at(lx, lx.at) != "\"" && col >= 0
    invariant lx.at <= n {''', "  while i < 10 {"]

# `verify` proves the written invariant, and searches nothing
[[step]]
strata = ["--file", "q.strata", "verify", "--no-race", "--no-cache", "--checks", "--show-searches"]
has = [
  "✓ quoted_end ",
  '''proven:  invariant `lx.at <= n` after a pass of `while lx.at < n && char_at(lx, lx.at) != "\"" && col >= 0`''',
  "✓ early ",
]
lacks = ["search", "added"]

# written without the search: `verify` says how to go on
[[step]]
strata = ["--file", "n.strata", "edit", "--no-search"]
from = "q.st"
lacks = ["added"]

[[step]]
strata = ["--file", "n.strata", "verify", "--no-race", "--no-cache", "--show-searches"]
has = [
  "~ quoted_end ",
  '''after `while lx.at < n && char_at(lx, lx.at) != "\"" && col >= 0`, no invariant bounds `lx`: write one, or run `strata fix quoted_end` to search for one''',
  "✓ early ",
]
lacks = ["search `", "searches:"]

[[step]]
strata = ["--file", "n.strata", "fix", "quoted_end"]
has = [
  '''fixed: in `quoted_end`: added `invariant lx.at <= n` to `while lx.at < n && char_at(lx, lx.at) != "\"" && col >= 0` (found by search)''',
]

[[step]]
strata = ["--file", "n.strata", "verify", "--no-race", "--no-cache"]
has = ["✓ quoted_end ", "✓ early "]

# nothing left to find
[[step]]
strata = ["--file", "n.strata", "fix", "quoted_end"]
has = ["nothing to fix"]

# std's loops are never written
[[step]]
run = ["sh", "-c", "cat $ROOT/std/*.strata | shasum > std-before"]

[[step]]
strata = ["--file", "s.strata", "edit"]
text = '''
use std.toml

fn quoted(s: String) -> String {
  toml.quote(s)
}
'''
lacks = ["added"]

[[step]]
run = ["sh", "-c", "cat $ROOT/std/*.strata | shasum | diff - std-before"]
