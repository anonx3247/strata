# a ghost contract clause (`ghost requires`, `ghost ensures`, `ghost
# invariant`) is proven (or refuted, or fuzzed) by `verify`, which notes it
# as a ghost one, but never compiled into a runtime check: a false one
# doesn't fault when the program runs, and `build` lists those not proven
# without failing. `--check-ghosts` (`run`, `test`) checks them after all.

[[step]]
save = "ghost.strata"
text = '''
/// The sum of `xs`, from `k`: claimed (falsely) to be `k + 7`.
fn total(xs: List[Int], k: Int) -> Int
  ghost requires xs.all(x -> x >= k)
  ghost ensures it == k + 7
{
  mut s := k
  for x in xs
    ghost invariant s >= k
  {
    s += x
  }
  s
}

fn main() {
  print(total([1, 2], 0))
  print(total([-5], 3))
}

test "the total of two" {
  assert total([1, 2], 0) == 3
}
'''

# written and read back
[[step]]
strata = ["--file", "ghost.strata", "view", "main"]
has = [
  "  ghost requires xs.all(x -> x >= k)",
  "  ghost ensures it == k + 7",
  "    ghost invariant s >= k",
]

# `ghost` is a word only before a clause
[[step]]
save = "word.strata"
text = '''
fn main() {
  ghost := 3
  print(ghost)
}
'''

[[step]]
strata = ["run", "word.strata"]
stdout = "3\n"

# never checked: a false `ensures`, a `requires` and an `invariant` a call
# breaks, and the program runs
[[step]]
strata = ["run", "ghost.strata"]
stdout = "3\n-2\n"

[[step]]
strata = ["--file", "ghost.strata", "test"]
lacks = ["✗"]

# verify reports them as usual, noted as ghost
[[step]]
strata = ["--file", "ghost.strata", "verify"]
code = 1
has = ["ensures it == k + 7", "(ghost: not checked when the program runs)"]

# build says which aren't proven, and builds
[[step]]
strata = ["--file", "ghost.strata", "build", "-o", "ghost"]
has = [
  "ghost contract clauses aren't proven by `verify`",
  "  in `total`: ghost ensures it == k + 7",
  "built ghost",
]

[[step]]
run = ["./ghost"]
stdout = "3\n-2\n"

# `--check-ghosts` checks them
[[step]]
strata = ["run", "ghost.strata", "--check-ghosts"]
code = 101
has = ["postcondition of `total` violated: ensures it == k + 7"]

[[step]]
strata = ["--file", "ghost.strata", "test", "--check-ghosts"]
any_code = true
has = ["✗", "ensures it == k + 7"]
