# In a package opened from its folder, the invariants `edit` finds by
# search for the functions it changed are written as a change of their
# own, logged in strata.log as made by edit (and committed in a git
# repository, as the edit is).

[[step]]
strata = ["init"]

[[step]]
strata = ["edit"]
from = "q.st"
has = ["warning: in `quoted_end`: added `invariant lx.at <= n`"]

[[step]]
strata = ["log"]
has = ["edit: loop invariants found by search"]

[[step]]
run = ["grep", "-c", '"by":"edit"', "strata.log"]
has = ["1"]

[[step]]
strata = ["view", "main", "--proofs"]
has = ["    invariant lx.at <= n {"]
