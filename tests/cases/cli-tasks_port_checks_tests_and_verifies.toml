# cli.rs: tasks_port_checks_tests_and_verifies
[[step]]
strata = ["--file", "$ROOT/examples/tasks", "test"]
has = ["0 failed"]

[[step]]
strata = ["--file", "$ROOT/examples/tasks", "verify", "--no-race"]
# (`print.demo` is fuzzed, not proven, since `MemQueue`'s refinement says
# `all(table.items(), …)`, which the prover doesn't model yet: after `drain`
# it can't show `describe(queue)` its argument still satisfies it)
has = [
  "✓ law enqueue_once for memory.MemQueue[P, E] proven",
  "✓ model.drain",
  "✓ model.run_worker         proven",
  "✓ memory.MemQueue[P, E].claim proven",
  "✓ memory.MemQueue[P, E].record proven",
  "✓ memory.MemQueue[P, E].release proven",
  "✓ memory.MemQueue[P, E].expire proven",
  "print.demo",
]
lacks = ["✗", "skipped"]

[[step]]
strata = ["--file", "$ROOT/examples/tasks", "run", "print.demo"]
has = ["task-3: Done after 2"]
