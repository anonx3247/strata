# an integer beyond what a JSON number holds exactly isn't written:
# `to_json` returns an error, and verify has nothing to report
[[step]]
strata = ["--file", "big.strata", "edit"]
text = '''
from std.json use Json

type A = { x: Int }

derive Json for A

fn main() {
  print(A { x: 9007199254740992 }.to_json())
  print(A { x: 3 }.to_json() is Ok)
}
'''

[[step]]
strata = ["run", "big.strata"]
out = '''
Err("x: 9007199254740992 is beyond ±(2^53 - 1), the integers a JSON number holds exactly")
true
'''

[[step]]
strata = ["--file", "big.strata", "verify", "--cases", "20", "--require", "proven"]
has = ["✓ std.json.encode_as.for.A."]

# `integers = "proven"`: each integer field must be shown to be a `SafeInt`
[[step]]
write = "proven/strata.toml"
text = "name = \"proven\"\n\n[json]\nintegers = \"proven\"\n"

[[step]]
strata = ["--file", "./", "edit", "main"]
dir = "proven"
text = '''
from std.json use Json, SafeInt

type A = { x: Int }

derive Json for A

type B = { id: SafeInt, n: Int where 0 <= it && it < 100 }

derive Json for B
'''

[[step]]
strata = ["verify", "--cases", "20"]
dir = "proven"
fails = true
has = ["✗ std.json.encode_as.for.A.", "does not satisfy `std.json.SafeInt`"]
lacks = ["✗ std.json.encode_as.for.B."]

# a package can make `from_json` refuse keys a record doesn't have
[[step]]
write = "strict/strata.toml"
text = "name = \"strict\"\n\n[json]\nunknown_keys = \"error\"\n"

[[step]]
strata = ["--file", "./", "edit", "main"]
dir = "strict"
text = '''
from std.json use Json, Ignore, parse

type A = { x: Int }

derive Json for A

fn main() {
  j := parse("{\"x\": 1, \"y\": 2}") !! std.json.Null
  print(A.from_json(j))
  print(A.from_json_with(j, Ignore))
}
'''

[[step]]
strata = ["run", "."]
dir = "strict"
out = "Err(\"unknown field \\\"y\\\"\")\nOk(A { x: 1 })\n"

[[step]]
write = "strict/strata.toml"
text = "name = \"strict\"\n\n[json]\nunknown_keys = \"sometimes\"\n"

[[step]]
strata = ["run", "."]
dir = "strict"
fails = true
has = ["unknown_keys is \"error\" or \"ignore\""]
