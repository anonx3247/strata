# `strata --file F fix` checks the fixed script before writing it, as
# `--file F edit` does: a script that doesn't check is left as it was.

[[step]]
save = "s.strata"
text = '''
fn unused_one() -> Int {
  1
}

fn main() -> Int {
  "not an Int"
}
'''

[[step]]
run = ["cp", "s.strata", "s.before"]

[[step]]
strata = ["--file", "s.strata", "fix"]
fails = true
has = ["rejected: s.strata wouldn't check after the fixes", "nothing was written"]

[[step]]
run = ["cmp", "s.strata", "s.before"]

[[step]]
save = "t.strata"
text = '''
fn unused_one() -> Int {
  1
}

fn main() -> Int {
  2
}
'''

[[step]]
strata = ["--file", "t.strata", "fix"]
has = ["fixed: removed `unused_one`"]

[[step]]
strata = ["--file", "t.strata", "view", "main"]
lacks = ["unused_one"]
