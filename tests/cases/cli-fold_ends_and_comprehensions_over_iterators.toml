# cli.rs: fold_ends_and_comprehensions_over_iterators

[[step]]
strata = ["--file", "c.strata", "edit"]
text = '''
type Count = { at: Int, end: Int }

impl Iterator[Int] for Count {
  fn next(mut self) -> Option[Int] {
    if self.at < self.end {
      self.at += 1
      Some(self.at - 1)
    } else {
      None
    }
  }
}

impl FiniteIterator[Int] for Count {
  fn len(self) -> Natural {
    if self.end > self.at { self.end - self.at } else { 0 }
  }
}

type Naturals = { at: Int }

impl Iterator[Int] for Naturals {
  fn next(mut self) -> Option[Int] {
    self.at += 1
    Some(self.at - 1)
  }
}


fn spin(n: Int) -> Int {
  mut k := n
  while true {
    k += 1
  }
  k
}

fn ok_sum() -> Int {
  Count { at: 0, end: 4 }.filter(x -> x > 1).map(x -> x * 2).fold(0, (a, b) -> a + b)
}

fn bad_lambda() -> Int {
  Count { at: 0, end: 4 }.map(x -> spin(x)).fold(0, (a, b) -> a + b)
}

fn filtered_len() -> Int {
  Count { at: 0, end: 10 }.filter(x -> x % 3 == 0).len()
}

fn main() {
  print(ok_sum())
  print(filtered_len())
  odd_squares := [n * n for n in Naturals { at: 0 } where n % 2 == 1]
  for s in odd_squares {
    if s > 50 {
      break
    }
    print(s)
  }
  c := Count { at: 0, end: 4 }
  doubled := [x * 2 for x in c]
  print(doubled.len())
  print(doubled.to_list())
  print([(a, b) for a in c for b in ["x", "y"] where a > 1])
  print(Set { x % 2 for x in c })
  print(Dict { x: x * x for x in c })
  print([x + 1 for x in [1, 2, 3] where x != 2])
}
'''

[[step]]
strata = ["run", "c.strata"]
stdout = '''
10
4
1
9
25
49
4
[0, 2, 4, 6]
[(2, "x"), (2, "y"), (3, "x"), (3, "y")]
Set { 0, 1 }
Dict { 0: 0, 1: 1, 2: 4, 3: 9 }
[2, 4]
'''

[[step]]
strata = ["--file", "c.strata", "verify"]
any_code = true
has = ["it calls `spin`, which may not terminate"]

# `fold` on an unbounded iterator: never returns, so refused
[[step]]
strata = ["--file", "inf.strata", "edit", "--as-given"]
text = '''
type N = { at: Int }

impl Iterator[Int] for N {
  fn next(mut self) -> Option[Int] {
    self.at += 1
    Some(self.at)
  }
}

fn f() -> Int {
  N { at: 0 }.fold(0, (a, b) -> a + b)
}

fn g() -> Int {
  N { at: 0 }.map(x -> x * 2).fold(0, (a, b) -> a + b)
}
'''
any_code = true
has = ["error in f: `fold` needs a `FiniteIterator`: `N` is an `Iterator` but not a `FiniteIterator`", "error in g: calling `fold`: `Mapped[N, Int, Int]` implements `FiniteIterator` only when"]
