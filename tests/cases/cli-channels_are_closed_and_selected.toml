# cli.rs: channels_are_closed_and_selected: a channel has no `close` (it
# ends when its last sender is dropped), a `spawn` may capture a sender
# inside another value, and `select`'s arms wait on `recv`, `send` or
# `await`

[[step]]
save = "c.strata"
text = '''
fn closed_by_hand() {
  (tx, rx) := channel(1)
  tx.send(1) except { () }
  tx.close()
}

fn nested_sender() -> Int {
  (tx, rx) := channel(1)
  pair := (tx, 1)
  scope {
    spawn {
      pair.0.send(1) except { () }
    }
  }
  rx.recv() ?? 0
}

fn arms(rx: Receiver[Int]) -> Int {
  select {
    rx.recv() as x => 1,
    len([1]) as y => 2,
  }
}

fn named_send(tx: Sender[Int]) {
  select {
    tx.send(1) as x => (),
  }
}

fn race_return(x: Int) -> Int {
  race {
    { return 1 } as a => a,
    x as b => b,
  }
}

fn fine(rx: Receiver[Int]) -> Int {
  (tx, out) := channel()
  scope {
    spawn {
      tx.send(1) except { () }
    }
  }
  select {
    rx.recv() as x => x ?? 0,
    out.recv() as y => y ?? 1,
  }
}
'''

[[step]]
strata = ["--file", "c.strata", "check"]
fails = true
has = ["error in closed_by_hand: a channel has no `close`: it ends when its last sender is dropped", "error in arms: a `select` arm waits on `rx.recv()`, `tx.send(v)`, `await h` or `clock.after(d)`", "error in named_send: a `send` arm gives nothing to name", "error in race_return: `return` can't leave a task (a `spawn`, a `race` arm)"]
lacks = ["error in fine", "error in nested_sender"]
