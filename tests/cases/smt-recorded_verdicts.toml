# smt.rs: smt_outcomes_as_in_rust, termination_as_in_rust, verify_as_in_rust (and the other
# `*_as_in_rust` on tests/data/smt): the Strata verifier's verdicts on those programs, recorded
# while they agreed with Rust's (verify_byte_at, verify_capability: recorded as the Strata
# verifier gives them, where the Rust one had a prover bug, or proved what it fuzzes elsewhere)

[[step]]
run = ["sh", "-c", "\"$STRATA\" --file step1.strata edit < \"$ROOT/tests/data/smt/step1.st\" > /dev/null; true"]

