# a variable passed `mut` that another argument of the same call changes too:
# the call takes its value first and puts its own back, so that change would
# be lost. An error, for a call, a call changing its receiver, and an
# assignment in a block argument; separate statements are fine.

[[step]]
save = "m.strata"
text = '''
type G = { n: Int }

fn bump(mut g: G) -> Int {
  g.n += 1
  g.n
}

fn both(mut g: G, k: Int) -> Int {
  g.n += k
  g.n
}

impl G {
  fn add(mut self, k: Int) {
    self.n += k
  }
}

fn nested() -> Int {
  mut g := G { n: 0 }
  both(mut g, bump(mut g))
}

fn receiver() {
  mut g := G { n: 0 }
  mut g.add(bump(mut g))
}

fn assigned() -> Int {
  mut g := G { n: 0 }
  both(mut g, {
    g = G { n: 5 }
    1
  })
}

fn apart() -> Int {
  mut g := G { n: 0 }
  k := bump(mut g)
  both(mut g, k)
}
'''

[[step]]
strata = ["--file", "m.strata", "check"]
fails = true
has = [
  "error in nested: `both` is given `mut g`, and its argument `bump(mut g)` changes `g` too: that change would be lost (the call puts its own `g` back): give it a variable of its own first",
  "error in receiver: `add` is given `mut g`, and its argument `bump(mut g)` changes `g` too",
  "error in assigned: `both` is given `mut g`, and its argument `{ …` changes `g` too",
]
lacks = ["error in apart"]
