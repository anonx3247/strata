# cli.rs: a_pending_change_can_be_aborted_or_kept_with_its_holes

[[step]]
strata = ["init"]

[[step]]
save = "main.strata"
text = '''
fn tax(amount: Int) -> Int {
  amount / 10
}

fn total(amount: Int) -> Int {
  amount + tax(amount)
}

fn double_tax(a: Int) -> Int {
  tax(a) * 2
}

test "totals" {
  assert total(100) == 110
}
'''

[[step]]
strata = ["render", "main"]
capture = "taxes.st"

[[step]]
strata = ["edit"]
text = "fn tax(amount: Int, rate: Int) -> Int { amount * rate / 100 }"

[[step]]
strata = ["edit", "extra"]
text = "fn more() -> Int { 1 }"

[[step]]
run = ["test", "-f", "extra.strata"]

# abort: every file as it was, including the module the change added
[[step]]
strata = ["abort"]
has = ["undid the pending change"]

[[step]]
strata = ["render", "main"]
out_file = "taxes.st"

[[step]]
run = ["test", "-f", "extra.strata"]
code = 1

[[step]]
run = ["cat", "strata.log"]
stdout = ""

# keep: recorded as is, the holes become ordinary ones
[[step]]
strata = ["edit"]
text = "fn tax(amount: Int, rate: Int) -> Int { amount * rate / 100 }"

[[step]]
strata = ["done", "--keep-holes", "-m", "rates, callers to do"]
has = ["2 holes kept as ?todo_"]

[[step]]
strata = ["render", "main"]
has = ["amount + ?todo_1", "?todo_2 * 2"]
