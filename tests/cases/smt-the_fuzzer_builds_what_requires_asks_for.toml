# verify's fuzzer builds a `requires`'s inputs with the program's own
# functions (`new_tally`, then `bump`s): random tallies almost never meet
# `tally_ok` (13 of 800 did), built ones do; a driver whose stepper can't
# be compiled yet (`odd`) is compiled with its arguments generated, as
# before. (`total` adds `5 + 5`, not `10`: with `s += 10` the loop's
# invariant `s == 10 * i` is derived from its code, and `total` is proven,
# not fuzzed.)

[[step]]
save = "u.strata"
text = '''
/// Ten points a step, each step's value logged.
type Tally = { n: Int, log: List[Int] }

fn tally_ok(t: Tally) -> Bool {
  t.n >= 0 && t.n % 10 == 0 && len(t.log) * 10 == t.n
}

fn new_tally() -> Tally
  ensures tally_ok(it) {
  Tally { n: 0, log: [] }
}

fn bump(mut t: Tally, x: Int)
  requires tally_ok(t)
  ensures tally_ok(t) {
  t.n += 10
  t.log = t.log + [x]
}

fn total(t: Tally) -> Int
  requires tally_ok(t)
  ensures it == t.n {
  mut s := 0
  for _ in t.log {
    s = s + 5 + 5
  }
  s
}
'''

[[step]]
run = ["sh", "-c", "cd \"$ROOT\" && STRATA_CACHE=\"$TMP/cache\" \"$STRATA\" verify --no-cache \"$TMP/u.strata\""]
any_code = true
has = ["~ total                    fuzzed: 200 cases, 68 discarded by `requires`", "✓ bump "]

[[step]]
save = "w.strata"
text = '''
type Holder = { it: Iterator[Int] }

fn units(s: String) -> Natural {
  h := Holder { it: [byte_len(s)].iter() }
  mut n: Natural = 0
  for _ in h.it {
    n += 1
  }
  n
}

/// Ten points a step, each step's value logged.
type Tally = { n: Int, log: List[Int] }

fn tally_ok(t: Tally) -> Bool {
  t.n >= 0 && t.n % 10 == 0 && len(t.log) * 10 == t.n
}

fn new_tally() -> Tally
  ensures tally_ok(it) {
  Tally { n: 0, log: [] }
}

fn odd(mut t: Tally, s: String) {
  t.n += units(s)
}

fn total(t: Tally) -> Int
  requires tally_ok(t)
  ensures it == t.n {
  mut s := 0
  for _ in t.log {
    s = s + 5 + 5
  }
  s
}
'''

[[step]]
run = ["sh", "-c", "cd \"$ROOT\" && STRATA_CACHE=\"$TMP/cache\" \"$STRATA\" verify --no-cache \"$TMP/w.strata\""]
any_code = true
has = ["~ total                    fuzzed: 13 cases, 787 discarded by `requires`"]
