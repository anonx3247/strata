# `strata view` hides the proof material of a trait's default methods and
# laws, a capability's functions and tests as it does a function's; `strata
# edit` of that view puts it back, and `--proofs` round-trips it.

[[step]]
strata = ["init"]

[[step]]
strata = ["edit", "--no-search", "--proofs"]
from = "kinds.st"

[[step]]
strata = ["view", "main"]
counts = { "// ⋯ 1 invariant" = 3, "// ⋯ 1 proof" = 1 }
lacks = ["invariant i", "assert n + n"]

# the view, edited back as it is: nothing changes
[[step]]
run = ["sh", "-c", "$STRATA view main > shown.st && $STRATA edit --no-search < shown.st"]
lacks = ["dropped"]

[[step]]
strata = ["view", "main", "--proofs"]
has = [
  "    while i < 2\n      invariant i <= 2 {\n      s += 1",
  "    n := x.count()\n    assert n + n >= n + n by double_le(n, n)\n    true",
  "    while i < 3\n      invariant i <= 3 {\n      i += 1\n    }\n    i",
  "  while i < 3\n    invariant i <= 3 {\n    i += 1\n  }\n  assert i == 3",
]
lacks = ["⋯"]

# `--proofs` text, edited back as it is: the same text
[[step]]
run = ["sh", "-c", "$STRATA view main --proofs > a.st && $STRATA edit --no-search --proofs < a.st && $STRATA view main --proofs | diff a.st -"]
