# Scoped allocation from roots (compiler/roots, `--memory-sites`): a value a
# callee may give back as it is (a function returning a `String` it was
# given, `join`, `to_string`, `repeat`) and the part of an f-string of one
# part outlive their statement through the variable (`holds_nothing`,
# `copies`, `flow`), so their verdict is the function's, not the
# statement's. Check mode and the JIT print the same list.

[[step]]
save = "given.strata"
from = "given.st"

[[step]]
strata = ["--file", "given.strata", "build", "--no-verify", "--memory-sites", "-o", "sites"]

[[step]]
run = ["sh", "-c", "STRATA_MEMORY_SITES=sites.tsv ./sites >/dev/null 2>&1; awk -F'\\t' '$3 == \"runtime\" && $4 == \"main\" { print $6 \"\\t\" $7 }' sites.tsv | uniq"]
out = "either(\"\", f\"e{i}\")\tfunction\njoin([f\"j{i}\"], \",\")\tfunction\nto_string(f\"s{i}\")\tfunction\nrepeat(f\"r{i}\", 1)\tfunction\nf\"{f\"o{i}\"}\"\tfunction\nf\"{chr(97 + i)}\"\tfunction\npush(kept, e)\tfunction\npush(kept, j)\tfunction\npush(kept, s)\tfunction\npush(kept, r)\tfunction\npush(kept, o)\tfunction\npush(kept, c)\tfunction\n[]\tfunction\n"

[[step]]
strata = ["--file", "given.strata", "build", "--no-verify", "-o", "plain"]

[[step]]
run = ["./plain"]
memory = true
stdout = "[\"e0\", \"j0\", \"s0\", \"r0\", \"o0\", \"a\", \"e1\", \"j1\", \"s1\", \"r1\", \"o1\", \"b\", \"e2\", \"j2\", \"s2\", \"r2\", \"o2\", \"c\"]\n"

[[step]]
strata = ["--file", "given.strata", "run"]
out = "[\"e0\", \"j0\", \"s0\", \"r0\", \"o0\", \"a\", \"e1\", \"j1\", \"s1\", \"r1\", \"o1\", \"b\", \"e2\", \"j2\", \"s2\", \"r2\", \"o2\", \"c\"]\n"
