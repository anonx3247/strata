# cli.rs: record_defaults

[[step]]
strata = ["--file", "$ROOT/tests/data/defaults.strata", "test"]
has = ["1 passed"]

[[step]]
strata = ["--file", "$ROOT/tests/data/defaults.strata", "render"]
capture = "defaults.st"

[[step]]
save = "again.strata"
from_tmp = "defaults.st"

[[step]]
strata = ["render", "--file", "again.strata"]
out_file = "defaults.st"

# an argument: a field left out takes its default
[[step]]
save = "r.strata"
text = '''
type R = { n: Int = 1, s: String }
fn f(r: R) -> Int { r.n }
'''

[[step]]
strata = ["--file", "r.strata", "run", "f", "R { s: \"x\" }"]
stdout = "1\n"

# checked where the type is defined
[[step]]
save = "bad.strata"
text = '''
type R = { n: Int where it > 0 = 0 }
type S = { s: String = 1 }
'''

[[step]]
strata = ["--file", "bad.strata", "check"]
fails = true
has = ["the default of `n`, 0, does not satisfy", "default of field `s`: expected `String`"]

# the command line: a field with a default is an option
[[step]]
strata = ["run", "$ROOT/examples/hello", "--", "Ada", "--times", "2"]
counts = { "hello, Ada!" = 2 }

[[step]]
strata = ["run", "$ROOT/examples/hello", "--", "--help"]
has = ["--times <Int>", "(default: 1)"]
