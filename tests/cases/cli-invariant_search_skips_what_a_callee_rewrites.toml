# A loop whose pass passes a variable to a `mut` parameter gets back any
# value of the parameter's type (what the callee wrote, nothing known of
# it): a candidate invariant naming that variable, where a pass ends with
# it so, is dropped without asking the solver. `words`' loop ends a pass
# after `word(mut r)`, so `r.at <= n`, `r.at >= 0`, ... are dropped
# there, and the search (`edit`'s, here `fix`'s) finds nothing. `word`
# has a `requires`, so the call is seen through its contract: with no
# `ensures` naming `r`, what comes back is any value too. `verify` says
# which loop the failing index is in, and that `strata fix` searches.

[[step]]
save = "w.strata"
text = '''
type Reader = { text: List[String], at: Int, words: List[String] }

fn word(mut r: Reader)
  requires r.at >= 0 {
  mut w := ""
  while r.at < len(r.text) && r.text[r.at] != " " {
    w += r.text[r.at]
    r.at += 1
  }
  mut r.words.push(w)
}

fn words(text: List[String]) -> List[String] {
  mut r := Reader { text, at: 0, words: [] }
  n := len(text)
  while r.at < n {
    if r.text[r.at] == " " {
      r.at += 1
      continue
    }
    word(mut r)
  }
  r.words
}
'''

[[step]]
strata = ["--file", "w.strata", "verify", "--no-race", "--no-cache", "--show-searches"]
has = [
  "~ words ",
  "in `while r.at < n`, no invariant bounds `r`: write one, or run `strata fix words` to search for one",
  "no bound was shown to go down (tried `n - r.at`); write an `invariant` or a `decreases` for it, or run `strata fix words` to search for an invariant",
]
lacks = ["search `"]

[[step]]
strata = ["--file", "w.strata", "fix", "words"]
has = ["warning: in `words`: not proven: index in range", "nothing to fix"]
