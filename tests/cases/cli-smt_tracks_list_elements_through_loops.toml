# Facts about the fields of a list's elements: a list a loop changes is,
# at the loop's head, any valid list of its declared type, its elements
# made by position (each a valid `Resting`, so `o.remaining - t` is
# proven a `Natural`); a written invariant sees through the helpers it
# calls; two lists known equal (`q == orders`) agree at the positions the
# code reads; an element field's wrong assumption is refuted
[[step]]
strata = ["--file", "t.strata", "edit"]
text = '''
/// An order resting in a queue: what it shows is at most what remains.
type Order = { id: Int, remaining: Positive, shown: Positive }

/// The displayed-quantity rule.
fn shown_ok(o: Order) -> Bool {
  o.shown <= o.remaining
}

type Resting = Order where shown_ok(it)

/// The id of the first order, -1 for none.
fn first_id(xs: List[Resting]) -> Int {
  match get(xs, 0) {
    Some(o) => o.id,
    None => -1,
  }
}

/// Fills `want` from the queue, each order giving what it shows, a
/// partly filled one going to the back: the fields of the queue's
/// elements keep their refinements through the loop.
fn fill(orders: List[Resting], want: Positive) -> Natural {
  mut q: List[Resting] = orders
  mut r: Natural = want
  mut i := 0
  while r > 0 && i < len(q)
    invariant i >= 0 {
    o := q[i]
    t := min(r, o.shown)
    let left: Natural = o.remaining - t
    r -= t
    if left > 0 && r == 0 {
      // filled: the order keeps its place, showing less
      q = [Order { ..o, remaining: left, shown: min(o.shown, left) }] + q[i + 1..]
      i = 0
    } else {
      if left > 0 {
        mut q.push(Order { ..o, remaining: left, shown: min(o.shown, left) })
      }
      i += 1
    }
  }
  r
}

/// The same, wrongly assuming an order always keeps something back.
fn fill_wrong(orders: List[Resting], want: Positive) -> Natural {
  mut q: List[Resting] = orders
  mut r: Natural = want
  mut i := 0
  while r > 0 && i < len(q)
    invariant i >= 0 {
    o := q[i]
    let hidden: Positive = o.remaining - o.shown
    r -= min(r, hidden)
    i += 1
  }
  r
}

/// The first order's id, read in a loop whose invariant says the queue is
/// untouched until then (a helper seen through, and two lists known equal
/// agreeing where the code reads them).
fn head(orders: List[Resting]) -> Int
  ensures it == first_id(orders) {
  mut q: List[Resting] = orders
  mut seen := -1
  mut n := 0
  while n < 1 && len(q) > 0
    invariant n >= 0
    invariant n == 0 ==> q == orders
    invariant n > 0 ==> seen == first_id(orders) {
    seen = q[0].id
    q = q[1..]
    n += 1
  }
  if n == 0 {
    first_id(orders)
  } else {
    seen
  }
}

fn main() {
  print(fill([], 1))
}
'''

