# strata repl, its input piped: values kept between lines (in compiled
# memory: functions and closures too), definitions of the session's own (a
# value of a type redefined dropped), the REPL's console, `mut` methods,
# faults reported and the session kept
[[step]]
save = "p.strata"
text = """
fn double(x: Int) -> Int {
  x * 2
}

type Point = { x: Int, y: Int }
"""

[[step]]
strata = ["--file", "p.strata", "repl"]
text = """
1 + 2
x := double(5)
mut xs := [1, 2]
xs = xs + [x]
xs
p := Point { x: 1, y: 2 }
:type p.x
fn triple(n: Int) -> Int { n * 3 }
triple(x)
fn triple(n: Int) -> Int { n * 30 }
triple(x)
mut console.print(f"x is {x}")
x
:view double
mut xs.push(7)
xs
inc := (n: Int) -> n + 1
inc(x)
add := (a: Int) -> (b: Int) -> a + b
add5 := add(5)
add5(1)
type Point = { x: Int, y: Int, z: Int }
"""
out = """
3: Int
x: Int = 10
xs: List[Int] = [1, 2]
[1, 2, 10]: List[Int]
p: Point = Point { x: 1, y: 2 }
Int
defined `triple`
30: Int
defined `triple`
300: Int
x is 10
10: Int
fn double(x: Int) -> Int {
  x * 2
}
[1, 2, 10, 7]: List[Int]
inc: (Int) -> Int
11: Int
add: (Int) -> (Int) -> Int
add5: (Int) -> Int
6: Int
dropped `p`: its type changed
defined `Point`
"""

[[step]]
strata = ["--file", "p.strata", "repl"]
text = """
nope + 1
mut ys := [1]
ys = ys + [[1, 2][5]]
ys
disk.read("x")
:frobnicate
"""
fails = true
has = ["unknown variable `nope`", "index 5 out of range (length 2)", "[1]: List[Int]", "unknown variable `disk`", "unknown command `:frobnicate`"]
