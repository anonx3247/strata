[[step]]
save = "bad.strata"
text = '''
type Square = { side: Positive }
type Circle = { radius: Positive }
type Shape = Square | Circle

fn gap(n: Int) -> String {
  match n {
    where it < 3 => "small",
    where it > 5 => "large",
  }
}

fn missing_member(v: Int | String) -> String {
  match v {
    Int => "n",
  }
}

fn dead(n: Int) -> String {
  match n {
    Int => "any",
    Positive => "never",
  }
}

fn dead2(n: Int) -> String {
  match n {
    where it >= 0 => "a",
    where it < 0 => "b",
    7 => "c",
  }
}

fn wrong(s: Shape) -> Int {
  match s {
    String => 1,
    _ => 2,
  }
}

fn opaque(s: String) -> Int {
  match s {
    NonEmptyString => 1,
  }
}

fn no_field(s: Shape) -> Int { s.side }

fn mixed() -> Int {
  x := if true { Square { side: 1 } } else { Circle { radius: 1 } }
  1
}
'''

[[step]]
strata = ["--file", "bad.strata", "check"]
fails = true
has = ["non-exhaustive match on `Int`: `where 3 <= it && it <= 5` is not covered", "non-exhaustive match on `Int | String`: `String` is not covered", "unreachable match arm `Positive`", "unreachable match arm `7`", "pattern `String`: expected `Circle | Square`, found `String`", "non-exhaustive match on `String`: `where len(it.code_points()) == 0` is not covered", "not every `Circle | Square` does"]
lacks = ["unreachable match arm `String`"]

# a variant is a type, so its name is unique in its module; two modules
# may each have a `Done` (told apart as `a.Done`, `b.Done`)
[[step]]
module = "a"
into = "$TMP/clash/"
text = "pub type Status = | Done | Open\n"

[[step]]
module = "b"
into = "$TMP/clash/"
text = "pub type Outcome = | Done | Failed\n"

[[step]]
strata = ["--file", "clash", "check"]
