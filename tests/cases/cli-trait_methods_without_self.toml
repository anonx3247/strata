# cli.rs: trait_methods_without_self

[[step]]
save = "m.strata"
text = '''
trait Monoid {
  fn empty() -> Self
  fn combine(self, other: Self) -> Self
  fn twice(self) -> Self {
    self.combine(self).combine(Self.empty())
  }
  law left_identity(a: Self):
    Self.empty().combine(a) == a
}

type Money = { cents: Int }

impl Monoid for Money {
  fn empty() -> Money {
    Money { cents: 0 }
  }

  fn combine(self, other: Money) -> Money {
    Money { cents: self.cents + other.cents }
  }
}

impl Monoid for String {
  fn empty() -> String {
    ""
  }

  fn combine(self, other: String) -> String {
    self + other
  }
}

fn concat[T: Monoid](xs: List[T]) -> T {
  fold(xs, T.empty(), (acc, x) -> acc.combine(x))
}

fn concat_twice[T: Monoid](xs: List[T]) -> T {
  concat(xs).twice()
}

fn total(ms: List[Money]) -> Money {
  concat(ms)
}

test "static trait methods" {
  assert Money.empty() == Money { cents: 0 }
  assert total([Money { cents: 2 }, Money { cents: 3 }]) == Money { cents: 5 }
  assert concat(["a", "b"]) == "ab"
  let none: List[Money] = []
  assert concat(none) == Money { cents: 0 }
  assert concat_twice(["x"]) == "xx"
  assert String.empty() == ""
}
'''

[[step]]
strata = ["--file", "m.strata", "test"]
has = ["1 passed"]

[[step]]
strata = ["--file", "m.strata", "verify"]
has = ["law left_identity for Money", "law left_identity for String"]
lacks = ["✗"]

[[step]]
strata = ["--file", "m.strata", "render"]
has = ["fn empty() -> Self", "T.empty()", "Self.empty().combine(a) == a"]

[[step]]
save = "s.strata"
text = '''
trait Bounded {
  fn lowest() -> Self
  fn rank(self) -> Int
    ensures it >= 0
}

trait Zero {
  fn zero() -> Self
    ensures it == it
}

type Level = { n: Natural }

impl Bounded for Level {
  fn lowest() -> Level {
    Level { n: 0 }
  }

  fn rank(self) -> Int {
    self.n
  }
}

fn lowest_rank[T: Bounded]() -> Natural {
  T.lowest().rank()
}

fn level_floor() -> Natural {
  Level.lowest().rank()
}

trait Monoid {
  fn empty() -> Self
  fn combine(self, other: Self) -> Self
  law left_identity(a: Self):
    Self.empty().combine(a) == a
}

type Max = { v: Int }

impl Monoid for Max {
  fn empty() -> Max {
    Max { v: 5 }
  }

  fn combine(self, other: Max) -> Max {
    if self.v > other.v { self } else { other }
  }
}

test "generic with no arguments" {
  assert level_floor() == 0
}
'''

[[step]]
strata = ["--file", "s.strata", "verify"]
any_code = true
has = ["✗ law left_identity for Max"]
lacks = ["✗ lowest_rank ", "✗ level_floor "]

[[step]]
save = "p.strata"
text = '''
trait Parse {
  fn parse(s: String) -> Self
    requires s != ""
  fn size(self) -> Int
    ensures it >= 0
}

type Word = { text: String }

impl Parse for Word {
  fn parse(s: String) -> Word {
    Word { text: s }
  }

  fn size(self) -> Int {
    len(self.text.code_points())
  }
}

fn read[T: Parse](s: NonEmptyString) -> Natural {
  T.parse(s).size()
}

fn word_size(s: NonEmptyString) -> Natural {
  Word.parse(s).size()
}

test "parse" {
  assert word_size("hello") == 5
}
'''

[[step]]
strata = ["--file", "p.strata", "verify"]
lacks = ["✗ read ", "✗ word_size "]

[[step]]
save = "bad.strata"
text = '''
trait Monoid {
  fn empty() -> Self
  fn combine(self, other: Self) -> Self
}

trait Version {
  fn version() -> Int
}

type Money = { cents: Int }

impl Monoid for Money {
  fn empty() -> Money {
    Money { cents: 0 }
  }

  fn combine(self, other: Money) -> Money {
    Money { cents: self.cents + other.cents }
  }
}

fn concat[T: Monoid](xs: List[T]) -> T {
  fold(xs, T.empty(), (acc, x) -> acc.combine(x))
}

fn unbounded[T](x: T) -> T {
  T.empty()
}

fn as_value(xss: List[List[Money]]) -> List[Money] {
  xss.map(concat)
}

fn not_impl() -> Int {
  Int.empty()
}

test "unknown type" {
  assert concat([]) == concat([])
}
'''

