# A field, tuple element or variants' shared field whose type is a sum or a
# union has that type.

[[step]]
save = "p.strata"
text = '''
type Order = { status: Option[Int], n: Int }

type Tagged = { tag: Int | String }

type Shape = | Circle { r: Int, label: Option[String] } | Rect { w: Int, label: Option[String] }

fn want(_b: Bool) -> Int = 0

fn option_field(o: Order) -> Int = want(o.status)

fn union_field(t: Tagged) -> Int = want(t.tag)

fn tuple_element(p: (Int, Option[Int])) -> Int = want(p.1)

fn variant_field(s: Shape) -> Int = want(s.label)

fn fine(o: Order, t: Tagged, p: (Int, Option[Int]), s: Shape) -> Int {
  k := match t.tag {
    Int => 1,
    String => 2,
  }
  (o.status ?? 0) + (p.1 ?? 0) + k + if (s.label ?? "") == "" { 0 } else { 1 }
}'''

[[step]]
strata = ["--file", "p.strata", "check"]
fails = true
has = [
  "error in option_field: call to `want`, argument 1: expected `Bool`, found `Option[Int]`",
  "error in union_field: call to `want`, argument 1: expected `Bool`, found `Int | String`",
  "error in tuple_element: call to `want`, argument 1: expected `Bool`, found `Option[Int]`",
  "error in variant_field: call to `want`, argument 1: expected `Bool`, found `Option[String]`",
]
lacks = [
  "error in fine",
]
