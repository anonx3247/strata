# `strata diff --graph T`: the moves of a sum type added and removed
# between the two ends of the diff, in words (compiler/graph's `changes`)

[[step]]
strata = ["init"]

[[step]]
strata = ["add", "$ROOT/tests/data/graph/orders.strata"]

[[step]]
strata = ["edit", "-m", "cancel"]
text = '''
fn cancel(o: Order, reason: NonEmptyString) -> Order {
  match o {
    Pending { id, .. } => Cancelled { id, reason },
    _ => o,
  }
}
'''

[[step]]
strata = ["diff", "--graph", "Order"]
has = [
  "+ fn cancel",
  "how `Order` values move:",
  "`cancel` now makes `Pending -> Cancelled` too (as `OneOrder.save` did)",
]

# a step removed: `ship` makes nothing but errors now
[[step]]
strata = ["edit", "-m", "no shipping"]
text = '''
fn ship(
  mut db: Db,
  id: OrderId,
  tracking: NonEmptyString,
) -> Result[Order, ShipError] {
  Err(NotPending)
}
'''

[[step]]
strata = ["diff", "--graph", "Order", "--from", "2"]
has = ["`ship` no longer makes `-> Shipped` (it moves no `Order` now)"]

[[step]]
strata = ["diff", "--graph", "Order", "--html"]
has = ["<!DOCTYPE html>", "before", "after", "`cancel` now makes `Pending -&gt; Cancelled` too"]
