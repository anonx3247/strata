# smt: under STRATA_TERMS=1 a sum shared by two queries is defined with
# the sort of its terms (`Real`, `Int`), never `Int` for a sum of reals
[[step]]
save = "f.strata"
text = '''
type Small = Float where abs(it) <= 1000000.0

fn total(a: Real, b: Real, c: Real, d: Real, e: Real, f: Real, g: Real, h: Real, i: Real) -> Real
  ensures it >= a + b + c + d + e + f + g + h + i
  ensures it <= a + b + c + d + e + f + g + h + i {
  a + b + c + d + e + f + g + h + i
}

fn count(a: Int, b: Int, c: Int, d: Int, e: Int, f: Int, g: Int, h: Int, i: Int) -> Int
  ensures it >= a + b + c + d + e + f + g + h + i
  ensures it <= a + b + c + d + e + f + g + h + i {
  a + b + c + d + e + f + g + h + i
}

fn float_total(a: Small, b: Small, c: Small, d: Small) -> Float
  ensures it >= a + b + c + d - 1.0
  ensures it <= a + b + c + d + 1.0 {
  a + b + c + d
}
'''

[[step]]
strata = ["--file", "f.strata", "verify", "--no-cache", "--no-race"]
env = { "STRATA_TERMS" = "1" }
has = ["✓ total ", "✓ count ", "✓ float_total "]
lacks = ["mixes sorts"]

[[step]]
strata = ["--file", "f.strata", "verify", "--no-cache", "--no-race"]
has = ["✓ total ", "✓ count ", "✓ float_total "]
