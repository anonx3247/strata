# `strata new MODULE "DOC"` makes a module at its path from the definitions
# piped in, DOC the comment that opens it (its doc), stored, checked and
# committed as `edit` would. A module that exists, a missing doc or nothing
# piped in is refused, and nothing is written.

[[step]]
strata = ["init"]

[[step]]
strata = ["new", "shop.shapes", "Shapes and their areas."]
text = '''
/// A rectangle's area.
pub fn area(w: Int, h: Int) -> Int = w * h
'''
has = ["fn     shop.shapes.area         added"]

[[step]]
strata = ["view", "shop.shapes"]
out = '''
// Shapes and their areas.

/// A rectangle's area.
pub fn area(w: Int, h: Int) -> Int {
  w * h
}
'''

[[step]]
strata = ["new", "shop.shapes", "Shapes again."]
text = '''
pub fn side() -> Int = 1
'''
code = 2
has = ["error: module `shop.shapes` exists (shop/shapes.strata): change it with `strata edit shop.shapes`"]

[[step]]
strata = ["view", "shop.shapes"]
lacks = ["side", "again"]

[[step]]
strata = ["new", "shop.orders"]
text = '''
pub fn total() -> Int = 0
'''
code = 2
has = ["a new module needs its doc line"]

[[step]]
strata = ["new", "shop.orders", "Orders."]
code = 2
has = ["nothing to put in `shop.orders`"]

[[step]]
strata = ["new", "Shop", "Orders."]
code = 2
has = ["`Shop` is not a module name"]

[[step]]
strata = ["view", "shop.orders"]
fails = true
