# a mutable options parameter, in a script
[[step]]
save = "opts.strata"
from = "opts.st"

[[step]]
strata = ["build", "opts.strata", "-o", "opts"]

[[step]]
run = ["./opts", "--count", "4", "a", "b"]
golden = "tests/data/build/expected/options-script-0.out"

[[step]]
run = ["./opts"]
golden = "tests/data/build/expected/options-script-1.out"

[[step]]
run = ["./opts", "--count"]
golden = "tests/data/build/expected/options-script-2.out"

[[step]]
run = ["./opts", "--help"]
golden = "tests/data/build/expected/options-script-3.out"
