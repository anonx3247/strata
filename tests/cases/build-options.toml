# build.rs: options_from_the_command_line_compile, the_jit_reads_options:
# options read with the derived `from_args`, built and on the JIT

[[step]]
strata = ["build", "$ROOT/examples/hello", "-o", "hello"]

[[step]]
strata = ["build", "$ROOT/examples/wc", "-o", "wc"]

[[step]]
run = ["$TMP/hello"]
dir = "$ROOT"
golden = "tests/data/build/expected/options-0-hello.out"

[[step]]
strata = ["run", "$ROOT/examples/hello", "--"]
dir = "$ROOT"
golden = "tests/data/build/expected/options-0-hello.out"

[[step]]
run = ["$TMP/hello", "Ada", "--loud"]
dir = "$ROOT"
golden = "tests/data/build/expected/options-1-hello.out"

[[step]]
strata = ["run", "$ROOT/examples/hello", "--", "Ada", "--loud"]
dir = "$ROOT"
golden = "tests/data/build/expected/options-1-hello.out"

[[step]]
