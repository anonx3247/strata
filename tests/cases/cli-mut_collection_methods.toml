[[step]]
save = "v.strata"
text = '''
fn pushed(xs: List[Int], x: Int) -> List[Int]
  ensures len(it) == len(xs) + 1 && it[len(xs)] == x {
  mut ys := xs
  mut ys.push(x)
  ys
}

fn inserted(xs: List[Int], i: Int) -> List[Int]
  requires 0 <= i && i <= len(xs)
  ensures len(it) == len(xs) + 1 {
  mut ys := xs
  mut ys.insert(i, 0)
  ys
}

fn grow(mut xs: List[Int], x: Int)
  ensures len(xs) == old len(xs) + 2 {
  mut xs.push(x)
  mut xs.push(x)
}

fn keyed(d: Dict[Int, Int], k: Int) -> Dict[Int, Int]
  ensures contains(it, k) && get(it, k) == Some(1) {
  mut e := d
  mut e.insert(k, 1)
  e
}

fn bad(xs: List[Int]) -> Int {
  mut ys := xs
  mut ys.remove(0)
  len(ys)
}
'''

