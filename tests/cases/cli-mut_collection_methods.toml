# Lists, dicts and sets change through `mut` methods (`mut xs.push(x)`,
# `mut xs.pop()`, `mut xs.insert(i, x)`, `mut xs.remove(i)`, `clear`,
# `sort`, `sort_by`, `reverse`, `mut d.insert(k, v)`, `mut s.remove(x)`, on
# a variable or a field), new values come from expressions (`xs + [x]`,
# `xs.sorted()`, `xs.reversed()`); the old functional forms and an unmarked
# call are errors that say how to write them, `strata fix` rewrites them,
# and `verify` knows what each method does (an index out of range is
# refuted).

[[step]]
save = "m.strata"
text = '''
type Bag = { items: List[Int], seen: Set[Int] }

fn add(mut b: Bag, x: Int) {
  mut b.items.push(x)
  mut b.seen.insert(x)
}

fn main() {
  mut xs := [3, 1, 2]
  mut xs.push(4)
  last := mut xs.pop()
  mut xs.insert(0, 9)
  mut xs.remove(1)
  mut xs.sort_by(x -> -x)
  mut ys := xs
  mut ys.reverse()
  mut zs := ys
  mut zs.clear()
  mut d := Dict[String, Int] { "a": 1, "b": 2 }
  mut d.remove("a")
  mut d.insert("c", 3)
  mut e := d
  mut e.clear()
  mut s := Set[Int] { 1, 2 }
  mut s.remove(1)
  mut b := Bag { items: [], seen: Set[Int] {} }
  add(mut b, 5)
  add(mut b, 6)
  let empty: List[Int] = []
  mut es := empty
  none := mut es.pop()
  print(f"{xs} {last} {ys} {zs} {e} {s} {b.items} {b.seen} {none}")
  print(f"{len(d)} {get(d, "c")} {xs.sorted()} {xs.reversed()} {"abc".reversed()}")
}
'''

[[step]]
strata = ["--file", "m.strata", "run"]
stdout = '''
[9, 2, 1] Some(4) [1, 2, 9] [] Dict {} Set { 2 } [5, 6] Set { 5, 6 } None
2 Some(3) [1, 2, 9] [1, 2, 9] cba
'''

