# a declared type holds for a variable's whole life, mutable or not
[[step]]
save = "mut.strata"
text = '''
fn m(mut n: Positive) -> String {
  match n { 1 => "one", where it > 1 => "more" }
}
fn changes_in_arm(mut n: Positive) -> String {
  match n {
    where it > 5 => {
      n = n - 1
      match n { where it > 4 => "big", 1 | 2 | 3 | 4 => "small" }
    },
    _ => "tiny",
  }
}
fn lit() -> Int {
  mut x: Positive = 3
  x = -1
  x
}
fn set_neg(mut k: Int) { k = -3 }
fn wb() -> Int {
  mut p: Positive = 4
  set_neg(mut p)
  p
}
fn bump(mut k: Positive) { k = k + 1 }
fn wb_ok() -> Int {
  mut p: Natural = 1
  bump(mut p)
  p
}
'''

[[step]]
strata = ["--file", "mut.strata", "check"]
fails = true
counts = { "error in " = 2 }
has = ["in lit: refinement violated at compile time in assigning `x`: -1 does not satisfy `Positive`", "in wb: call to `set_neg`, argument 1: `p` is declared `Positive`, but the `mut` parameter is `Int`"]

