# cli.rs: f_string_format_specs

[[step]]
save = "f.strata"
text = '''
type Cents = Int where it >= 0

fn row(name: String, price: Float, qty: Cents, delta: Int) -> String {
  f"[{name:<8}|{price:>8.2}|{qty:03}|{delta:+}|{name:*^10}|{name:.3}|{len([1, 2].map((n: Int) -> n))}]"
}

test "specs" {
  assert row("tea", 3.14159, 7, 5) == "[tea     |    3.14|007|+5|***tea****|tea|2]"
  assert row("biscuits", -2.5, 42, -3) == "[biscuits|   -2.50|042|-3|*biscuits*|bis|2]"
  assert f"{-42:06}" == "-00042"
}
'''

[[step]]
strata = ["--file", "f.strata", "test"]
has = ["1 passed"]

# specs survive rendering
[[step]]
strata = ["--file", "f.strata", "render"]
has = ["{price:>8.2}", "{name:*^10}", "{qty:03}"]

[[step]]
save = "e.strata"
text = '''
fn a(n: Int) -> String { f"{n:.2}" }
fn b(s: String) -> String { f"{s:05}" }
'''

[[step]]
strata = ["--file", "e.strata", "check"]
fails = true
has = ["`.N` applies to a Float", "`+` and `0` apply to numbers"]

# a spec that doesn't parse can't be stored
[[step]]
strata = ["--file", "x.strata", "edit"]
text = "fn c(n: Int) -> String { f\"{n:x}\" }\n"
fails = true
has = ["bad format spec `x`"]
