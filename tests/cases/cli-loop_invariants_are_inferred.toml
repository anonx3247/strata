# cli.rs: loop_invariants_are_inferred: derived from the loop's code
# (`early`'s `i <= 10`: `i` goes up by one a pass under `i < 10`), else,
# where a check fails without more, searched by `edit` among candidates
# from the condition, the `ensures`, the `requires` and how the loop's
# integers change; kept when they hold on entry and after every pass, and
# written into the code (`search`: `lo` and `hi` jump to `mid`), where
# `verify` proves them
[[step]]
save = "t.strata"
text = '''
fn early(n: Int) -> Int
  ensures it >= 0 && it <= 10
{
  mut i: Int = 0
  while i < 10 {
    if i == n { break }
    i += 1
  }
  i
}
fn search(xs: List[Int], t: Int) -> Int
  ensures it >= 0 && it <= len(xs)
{
  mut lo: Int = 0
  mut hi: Int = len(xs)
  while lo < hi {
    mid := (lo + hi) / 2
    if xs[mid] < t { lo = mid + 1 } else { hi = mid }
  }
  lo
}
fn wrong(n: Natural) -> Int
  ensures it == n + 1
{
  mut i: Int = 0
  while i < n { i += 1 }
  i
}
'''

[[step]]
strata = ["--file", "t.strata", "verify", "--checks", "--no-race"]
fails = true
has = ["✓ early ", "invariant of `while i < 10`: i <= 10 (derived)", "✓ search ", "proven:  invariant `hi >= lo` after a pass of `while lo < hi`", "✗ wrong", "found by the solver"]
