# cli.rs: loop_invariants_are_inferred: candidates from the condition, the
# `ensures`, the `requires` and how the loop's integers change; kept when
# they hold on entry and after every pass
[[step]]
save = "t.strata"
text = '''
fn early(n: Int) -> Int
  ensures it >= 0 && it <= 10
{
  mut i: Int = 0
  while i < 10 {
    if i == n { break }
    i += 1
  }
  i
}
fn search(xs: List[Int], t: Int) -> Int
  ensures it >= 0 && it <= len(xs)
{
  mut lo: Int = 0
  mut hi: Int = len(xs)
  while lo < hi {
    mid := (lo + hi) / 2
    if xs[mid] < t { lo = mid + 1 } else { hi = mid }
  }
  lo
}
fn wrong(n: Natural) -> Int
  ensures it == n + 1
{
  mut i: Int = 0
  while i < n { i += 1 }
  i
}
'''

[[step]]
strata = ["--file", "t.strata", "verify", "--checks", "--no-race"]
fails = true
has = ["✓ early ", "invariant of `while i < 10`: i <= 10 (inferred)", "✓ search ", "invariant of `while lo < hi`: lo <= hi (inferred)", "✗ wrong", "found by the solver"]
