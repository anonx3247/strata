# Trait models: `model orders: T` in a trait, `model orders = e` in each
# impl; contracts name them (`self.orders`, `db.orders`), with `old`; a
# trait's `invariant` (every method assumes it, every `mut self` one keeps
# it) and `ensures` (every `mut self` method meets it). Written and read
# back; verify proves each impl against the trait's contracts through its
# abstraction (a faithful one proven, one keeping the last order refuted)
# and code over the trait through the model alone; contracts naming a model
# are ghost (checked with `--check-ghosts`); `mock Db` runs the model; the
# errors (an impl without a model, an unknown one, a model in a body)
[[step]]
strata = ["--file", "m.strata", "edit"]
text = '''
type Order = { item: String, shipped: Bool }

/// Orders kept somewhere.
trait Db {
  /// Every order, by id.
  model orders: Dict[Int, Order]

  fn save(mut self, id: Int, o: Order)
    ensures self.orders == old self.orders.with(id, o)
  fn lookup(self, id: Int) -> Option[Order]
    ensures it == self.orders.get(id)
}

/// In memory.
type MemDb = { all: Dict[Int, Order] }

impl Db for MemDb {
  model orders = self.all

  fn save(mut self, id: Int, o: Order) {
    mut self.all.insert(id, o)
  }

  fn lookup(self, id: Int) -> Option[Order] = self.all.get(id)
}

/// Keeps only the last order saved.
type OneOrder = { last: Option[(Int, Order)] }

impl Db for OneOrder {
  model orders = match self.last {
    Some((k, o)) => Dict[Int, Order] { k: o },
    None => Dict[Int, Order] {},
  }

  fn save(mut self, id: Int, o: Order) {
    self.last = Some((id, o))
  }

  fn lookup(self, id: Int) -> Option[Order] = match self.last {
    Some((k, o)) => if k == id {
      Some(o)
    } else {
      None
    },
    None => None,
  }
}

/// Marks order `id` shipped.
fn ship(mut db: Db, id: Int) -> Result[(), String]
  ensures match old db.orders.get(id) {
    Some(o) => it is Ok
      && db.orders == (old db.orders).with(id, Order { ..o, shipped: true }),
    None => it is Err && db.orders == old db.orders,
  } {
  match db.lookup(id) {
    Some(o) => {
      mut db.save(id, Order { ..o, shipped: true })
      Ok(())
    },
    None => Err("no such order"),
  }
}

fn main() {
  mut db := MemDb { all: Dict[Int, Order] {} }
  mut db.save(1, Order { item: "tea", shipped: false })
  print(ship(mut db, 1))
  print(ship(mut db, 2))
  print(db.lookup(1))
}

test "the mock runs the model" {
  mut db := mock Db
  mut db.save(7, Order { item: "pen", shipped: false })
  assert db.lookup(7) == Some(Order { item: "pen", shipped: false })
  assert ship(mut db, 7) is Ok
  assert db.lookup(7) == Some(Order { item: "pen", shipped: true })
  assert ship(mut db, 8) is Err
}
'''

