# a trait's invariant: a refinement of every implementing type's model
# (each method of `self` knows it, a `mut self` one keeps it, a result of
# type `Self` establishes it, a value of the trait carries it); its
# `ensures`: every `mut self` method meets it
[[step]]
strata = ["--file", "s.strata", "edit"]
text = '''
/// Items in stock.
trait Stock {
  model count: Int
  ghost invariant self.count >= 0
  ensures self.count >= old self.count - 1

  fn add(mut self)
    ensures self.count == old self.count + 1
  fn take(mut self) -> Bool
    ensures it == (old self.count > 0)
  fn empty() -> Self
}

type Shelf = { n: Int }

impl Stock for Shelf {
  model count = self.n

  fn empty() -> Self = Shelf { n: 0 }

  fn add(mut self) {
    self.n += 1
  }

  fn take(mut self) -> Bool {
    if self.n > 0 {
      self.n -= 1
      true
    } else {
      false
    }
  }
}

/// Takes one even when there is none.
type Leaky = { n: Int }

impl Stock for Leaky {
  model count = self.n

  fn empty() -> Self = Leaky { n: -1 }

  fn add(mut self) {
    self.n += 1
  }

  fn take(mut self) -> Bool {
    had := self.n > 0
    self.n -= 1
    had
  }
}

/// Takes two, through the trait: never below zero.
fn take_two(mut s: Stock) -> Int
  ensures s.count >= 0 {
  mut got := 0
  if mut s.take() {
    got += 1
  }
  if mut s.take() {
    got += 1
  }
  got
}

/// What any stock's count is, without asking it.
fn never_negative(s: Stock) -> Int
  ensures s.count >= 0 {
  0
}
'''

