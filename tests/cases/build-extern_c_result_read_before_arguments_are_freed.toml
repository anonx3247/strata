# The `String` an `extern c` function returns is read before the copies of
# its arguments are freed: here C returns its argument (`MallocScribble`
# fills freed memory).
[[step]]
write = "strata.toml"
text = "name = \"ffi\"\n\n[native]\nsources = [\"ffi.c\"]\n"

[[step]]
write = "ffi.c"
from = "ffi.c"

[[step]]
save = "main.strata"
from = "main.st"

[[step]]
strata = ["build", "-o", "prog"]

[[step]]
run = ["./prog"]
env = { MallocScribble = "1" }
memory = true
stdout = "a string C hands back as its result, long enough to span blocks\n"

[[step]]
strata = ["run", "."]
env = { MallocScribble = "1" }
stdout = "a string C hands back as its result, long enough to span blocks\n"
