# cli.rs: lists_are_known_by_position: `xs[k]`, slices, `+`, `push`,
# `reverse` and literals keep which element is where
[[step]]
save = "t.strata"
text = '''
type Sorted = List[Int] where all(1..len(it), i -> it[i - 1] <= it[i])
type Message = { content: List[Int] }
type Chain = List[Message] where all(1..len(it), i -> all(it[i].content, c -> c > 0))
fn first_le_second(xs: Sorted) -> Bool
  requires len(xs) >= 2
  ensures it
{
  xs[0] <= xs[1]
}
fn tail(xs: Sorted) -> Sorted
  requires len(xs) > 0
{
  xs[1..len(xs)]
}
fn add_max(xs: Sorted, x: Int) -> Sorted
  requires len(xs) == 0 || xs[len(xs) - 1] <= x
{
  xs + [x]
}
fn bad_add(xs: Sorted, x: Int) -> Sorted {
  xs + [x]
}
fn bad_lit() -> Sorted {
  xs := [1, 3, 2]
  xs
}
fn last_of_rev(xs: List[Int]) -> Bool
  requires len(xs) > 0
  ensures it
{
  xs.reversed()[len(xs) - 1] == xs[0]
}
fn joined(a: List[Int], b: List[Int]) -> Bool
  requires len(a) == 2 && len(b) > 0
  ensures it
{
  (a + b)[2] == b[0]
}
fn some_positive(xs: List[Int]) -> Bool
  requires len(xs) > 0 && xs[0] > 0
  ensures it
{
  any(xs, x -> x > 0)
}
fn inner(ms: Chain, k: Int, j: Int) -> Bool
  requires 1 <= k && k < len(ms) && 0 <= j && j < len(ms[k].content)
  ensures ms[k].content[j] > 0
{
  true
}
'''

[[step]]
strata = ["--file", "t.strata", "verify", "--cases", "30"]
fails = true
has = ["✓ first_le_second ", "✓ tail ", "✓ add_max ", "✓ last_of_rev ", "✓ joined ", "✓ some_positive ", "✓ inner ", "✗ bad_add", "✗ bad_lit"]
