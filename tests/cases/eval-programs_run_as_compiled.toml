# eval.rs: programs_run_as_compiled: compiler/eval (`strata eval PRELUDE STD... -- FILE`, what runs
# compile-time code codegen doesn't cover) runs the build programs as their compiled builds do: the
# same output and exit code as the recorded goldens (not files_and_environment: compile-time code
# has no files or arguments, and eval runs no host I/O)

[[step]]
run = ["sh", "-c", "\"$STRATA\" pack --prelude prelude.strata > /dev/null"]

[[step]]
run = ["sh", "-c", "cd \"$ROOT\" && \"$STRATA\" eval \"$TMP/prelude.strata\" \"$ROOT\"/std/*.strata -- \"$ROOT/tests/data/build/numbers.strata\" 2>&1 | sed -e \"s/^--- exit/\\n--- exit/\" -e \"/^===$/d\" | diff - \"$ROOT/tests/data/build/expected/numbers.out\""]

