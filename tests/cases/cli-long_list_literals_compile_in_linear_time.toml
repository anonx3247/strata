# cli.rs: long_list_literals_compile_in_linear_time: (the Rust test also required the 60,000-element run to take under 2 s)

[[step]]
save = "t.strata"
text = "fn total(xs: List[Int]) -> Int {\n  sum(xs)\n}\n"

[[step]]
strata = ["--file", "t.strata", "run", "total", "[1, 2]"]
out = "3\n"

[[step]]
run = ["sh", "-c", "\"$STRATA\" --file t.strata run total \"[$(yes 1 | head -n 60000 | paste -sd, -)]\""]
out = "60000\n"
