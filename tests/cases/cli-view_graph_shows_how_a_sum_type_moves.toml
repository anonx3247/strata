# `strata view --graph T`: how the values of a sum type move between its
# variants, read off the code and asked of the solver (compiler/graph).

# a value made new is an entry; `ship`'s refinement pins what it makes;
# `OneOrder.save` may make any move, `load` none
[[step]]
strata = ["view", "--graph", "Order", "--file", "$ROOT/examples/orders.strata"]
has = [
  "Order = Pending | Shipped | Cancelled",
  "(new)     -> Shipped    by ship (possible)",
  "any       -> any        by OneOrder.save (possible)",
  "proven impossible: 8 more (in 2 functions; --all lists them)",
]

[[step]]
strata = ["view", "--graph", "Order", "--file", "$ROOT/examples/orders.strata", "--all"]
has = [
  "Pending   -> Cancelled  by OneOrder.save (possible)",
  "proven impossible:",
  "Pending   -> Shipped    by OneOrder.load",
  "(new)     -> Pending    by ship",
]

# a field path through a list (`MemQueue.entries[i].status`): the same
# element before and after; `mem_release` only moves running tasks
[[step]]
strata = ["view", "--graph", "Status", "--file", "$ROOT/examples/tasks"]
has = [
  "Running   -> Pending    by mem_record (unknown), mem_release (unknown)",
  "Running   -> Exhausted  by mem_record (unknown), mem_release (unknown)",
  "any       -> any        by mem_enqueue (unknown), MemQueue.enqueue (possible or unknown)",
]

[[step]]
strata = ["view", "--graph", "Status", "--file", "$ROOT/examples/tasks", "--all"]
has = ["Pending   -> Exhausted  by mem_claim, mem_record, mem_release, statuses"]

# a page with the graph drawn
[[step]]
strata = ["view", "--graph", "Order", "--file", "$ROOT/examples/orders.strata", "--html"]
has = ["<!DOCTYPE html>", "<svg", ">Shipped</text>", "ship (possible)"]

[[step]]
strata = ["view", "--graph", "Shape", "--file", "$ROOT/examples/orders.strata"]
code = 2
has = ["no sum type `Shape` in the program"]
