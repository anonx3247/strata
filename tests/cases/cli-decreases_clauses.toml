# A loop or a recursion that ends because one of two measures goes down:
# found when the measures are the loop's bounds (its condition's, or those
# its body tests), compared in order; else written as a `decreases` clause,
# proven where every pass ends (or at every recursive call), refuted with a
# counterexample, and checked when the program runs where it isn't proven
[[step]]
strata = ["--file", "t.strata", "edit"]
text = '''
/// `j` goes up to `m`, then `i` goes up and `j` starts again: the pair
/// (`n - i`, `m - j`) goes down, compared in order.
fn grid(n: Int, m: Int) -> Int {
  mut i := 0
  mut j := 0
  mut count := 0
  while i < n {
    if j < m {
      j += 1
      count += 1
    } else {
      i += 1
      j = 0
    }
  }
  count
}

/// Takes one from `a`, filling `b` up again, or else one from `b`.
fn drain(a0: Natural, b0: Natural) -> Int {
  mut a := a0
  mut b := b0
  mut steps := 0
  while a + b > 0
    decreases (a, b) {
    if a > 0 {
      a -= 1
      b = b0
    } else {
      b -= 1
    }
    steps += 1
  }
  steps
}

/// The same with the measures the wrong way round: `b` goes up when `a`
/// goes down.
fn drain_wrong(a0: Natural, b0: Natural) -> Int {
  mut a := a0
  mut b := b0
  mut steps := 0
  while a + b > 0
    decreases (b, a) {
    if a > 0 {
      a -= 1
      b = b0 + 1
    } else {
      b -= 1
    }
    steps += 1
  }
  steps
}

/// A `loop` is shown to end by its `decreases` clause.
fn halve(n0: Natural) -> Int {
  mut n := n0
  mut k := 0
  loop
    invariant n >= 0
    decreases n {
    if n == 0 {
      break
    }
    n = n / 2
    k += 1
  }
  k
}

/// Recursion with its measure written: `a` goes down, or `a` stays and `b`
/// does.
fn walk(a: Natural, b: Natural) -> Int
  decreases (a, b) {
  if b > 0 {
    1 + walk(a, b - 1)
  } else if a > 0 {
    1 + walk(a - 1, 3)
  } else {
    0
  }
}

/// A measure that doesn't go down: refuted, and checked when it runs.
fn stuck(n: Int) -> Int
  decreases 5 {
  if n <= 0 {
    0
  } else {
    1 + stuck(n - 1)
  }
}

fn main() {
  print(grid(3, 4))
  print(drain(2, 3))
  print(halve(37))
  print(walk(2, 2))
  print(drain_wrong(0, 3))
  print(drain_wrong(1, 3))
}
'''

[[step]]
strata = ["--file", "t.strata", "view", "main", "--proofs"]
has = [
  "  while a + b > 0\n    decreases (a, b) {\n",
  "  loop\n    invariant n >= 0\n    decreases n {\n",
  "fn walk(a: Natural, b: Natural) -> Int\n  decreases (a, b) {\n",
]

[[step]]
strata = ["--file", "t.strata", "verify", "--checks", "--no-race"]
fails = true
has = [
  "terminates: `while i < n` ends: the pair (`n - i`, `m - j`), compared in order, goes down on every pass",
  "proven:  decreases `(a, b)` after a pass of `while a + b > 0`",
  "terminates: `while a + b > 0` ends: its `decreases (a, b)` measure goes down on every pass",
  "✗ drain_wrong",
  "decreases failed: `(b, a)` did not go down in a pass of `while a + b > 0`",
  "may not terminate: the loop `while a + b > 0`: its `decreases (b, a)` was not shown to go down on every pass (it is checked when the program runs)",
  "terminates: `loop` ends: its `decreases n` measure goes down on every pass",
  "proven:  decreases `(a, b)` at a call of `walk`",
  "terminates: its `decreases (a, b)` measure goes down on every recursive call and is never negative there",
  "✗ stuck",
  "decreases failed: `5` did not go down at a call of `stuck` (before: 5, after: 5)",
]

[[step]]
strata = ["--file", "t.strata", "run"]
fails = true
has = [
  "12\n5\n6\n10\n3\n",
  "decreases failed: `(b, a)` did not go down in a pass of `while a + b > 0` (before: 3, 1, after: 4, 0)",
]

[[step]]
strata = ["--file", "c.strata", "edit"]
text = '''
fn twice(n: Int) -> Int {
  mut i := 0
  while i < n
    decreases n - i
    decreases i {
    i += 1
  }
  for x in [1, 2]
    decreases x {
    i += x
  }
  i
}

fn named(s: String) -> Int {
  mut t := s
  while t != ""
    decreases t {
    t = ""
  }
  0
}
'''
fails = true
has = [
  "more than one `decreases` clause: write one, `decreases (a, b)` for measures compared in order",
  "a `for` loop has no `decreases` clause: it ends on its own (the clause is for `while` and `loop`)",
  "decreases: expected `Int`, found `String`",
]
