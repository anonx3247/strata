# cli.rs: own_methods_locals_and_function_values

[[step]]
write = "strata.toml"
text = "name = \"m\"\n"

[[step]]
module = "counter"
into = "$TMP/"
text = '''
pub type Counter = { n: Natural }

impl Counter {
  fn bump(mut self) {
    self.n = self.n + 1
  }
}
'''

[[step]]
module = "main"
into = "$TMP/"
text = '''
from counter use Counter

type Twice = { f: (Natural) -> Natural }

/// A function named like `Counter`'s method (in another module): `mut k.bump()`
/// is still the method.
fn bump(c: Counter) -> Natural {
  mut k := c
  mut k.bump()
  k.n
}

/// A local named like the function hides it: this is not recursion.
fn fresh() -> Counter {
  mut fresh := Counter { n: 0 }
  mut fresh.bump()
  fresh
}

/// What a function value returns is a valid value of its result type.
fn twice(t: Twice, x: Natural) -> Natural {
  f := t.f
  f(f(x))
}

/// A lambda passed for a function parameter gets valid arguments.
fn use_twice() -> Natural {
  twice(Twice { f: n -> n + 1 }, 3)
}

test "methods" {
  assert bump(Counter { n: 1 }) == 2
  assert fresh().n == 1
}
'''

[[step]]
strata = ["--file", ".", "test"]
has = ["1 passed"]

[[step]]
strata = ["--file", ".", "verify", "--checks"]
any_code = true
has = ["✓ fresh", "✓ twice"]
lacks = ["may not terminate"]
