# a variant is named by its module: two unions declaring one name with data
# is an error (in a single file too), and a union naming an atom another
# declares holds that one type, as if `type Aa` were declared on its own and
# both unions held it: no warning, and the program checks and runs

[[step]]
save = "two.strata"
text = '''
type P1 = Aa(Int) | Bb
type P2 = Aa(String) | Cc

fn main() {
  print("hi")
}
'''

[[step]]
strata = ["--file", "two.strata", "check"]
fails = true
has = ["variant `Aa` of `P1` has the same name as the variant `Aa` of `P2`", "must be unique in its module, whatever type it is in (rename one)"]

[[step]]
strata = ["--file", "shared.strata", "edit"]
text = '''
type P1 = Aa | Bb
type P2 = Aa | Cc

fn main() {
  print("hi")
}
'''
lacks = ["same name", "`Aa`"]

[[step]]
strata = ["--file", "shared.strata", "run"]
stdout = "hi\n"
