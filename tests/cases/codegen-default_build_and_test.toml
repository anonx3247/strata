# codegen.rs: build_and_test_use_compiler_codegen_by_default: `strata build` and `strata test` compile
# with compiler/codegen (llvm.rs's fallback left with Rust)

[[step]]
save = "ok.strata"
text = '''
fn double(n: Int) -> Int {
    n * 2
}

test "double" {
    assert double(2) == 4
}

fn main() {
    print(double(21))
}
'''

[[step]]
strata = ["build", "ok.strata", "-o", "ok"]
has = ["(compiler/codegen)"]

[[step]]
run = ["./ok"]
stdout = '''
42
'''

[[step]]
strata = ["--file", "ok.strata", "test"]
has = ["✓ double", "1 passed, 0 failed"]
