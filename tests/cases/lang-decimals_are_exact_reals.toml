# Decimal literals are exact rationals (`Real`, core.real) unless a `Float`
# is wanted: arithmetic, order, printing (`1/3`, `0.1`), conversions and
# parsing; a `Float` beside one, in a field, or what a variable meets later
# (`mut t := 0.0`); every object freed; verify proves `Real` code exactly
# (SMT reals) and finds what doesn't hold; the errors where they mix

[[step]]
strata = ["--file", "r.strata", "edit"]
text = '''
type Shape = { side: Float }

fn area(s: Shape) -> Float {
  s.side * s.side
}

fn total(xs: List[Shape]) -> Float {
  mut t := 0.0
  for s in xs {
    t = t + area(s)
  }
  t
}

fn mean(xs: List[Real] where len(it) > 0) -> Real {
  sum(xs) / Real.from(len(xs))
}

fn main() {
  print(0.1 + 0.2 == 0.3)
  third := 1.0 / 3.0
  print([third, third * 3.0, -2.5, 7.0 % 2.5])
  print(f"{2.0 / 3.0:.3} {0.125:.2} {third}")
  print([floor(-0.5), ceil(-0.5), round(2.5), round(-2.5)])
  print([abs(-0.75), min(0.1, 0.2), max(0.1, 0.2)])
  print([third.to_float(), 0.1.to_float()])
  print([Real.parse("6.02e23"), Real.parse("1/-4"), Real.parse("x")])
  print(mean([0.5, 0.25, 1.5]))
  print(sorted([0.5, 0.25, third]))
  print(total([Shape { side: 1.5 }, Shape { side: 0.5 }]))
  let f: Float = 0.1
  print(f + 0.2)
  print(sqrt(2.25))
}
'''

[[step]]
strata = ["--file", "r.strata", "run"]
stdout = "true\n[1/3, 1.0, -2.5, 2.0]\n0.667 0.12 1/3\n[-1, 0, 3, -3]\n[0.75, 0.1, 0.2]\n[Some(0.3333333333333333), Some(0.1)]\n[Some(602000000000000000000000.0), Some(-0.25), None]\n0.75\n[0.25, 1/3, 0.5]\n2.5\n0.30000000000000004\n1.5\n"

[[step]]
strata = ["--file", "r.strata", "build", "-o", "prog"]

[[step]]
run = ["./prog"]
memory = true
stdout = "true\n[1/3, 1.0, -2.5, 2.0]\n0.667 0.12 1/3\n[-1, 0, 3, -3]\n[0.75, 0.1, 0.2]\n[Some(0.3333333333333333), Some(0.1)]\n[Some(602000000000000000000000.0), Some(-0.25), None]\n0.75\n[0.25, 1/3, 0.5]\n2.5\n0.30000000000000004\n1.5\n"

[[step]]
strata = ["--file", "v.strata", "edit"]
text = '''
fn tenths() -> Real where it == 0.3 {
  0.1 + 0.2
}

pub fn mid(a: Real, b: Real) -> Real
  ensures min(a, b) <= it && it <= max(a, b) {
  (a + b) / 2.0
}

pub fn inverse(x: Real where it != 0.0) -> Real {
  1.0 / x
}

pub fn reckless(x: Real) -> Real {
  1.0 / x
}

pub fn floored(x: Real) -> Int
  ensures Real.from(it) <= x && x < Real.from(it + 1) {
  floor(x)
}

pub fn wrong(x: Real) -> Real
  ensures it > x {
  x * 2.0
}

fn main() {
  print(tenths())
}
'''

[[step]]
strata = ["--file", "v.strata", "verify"]
fails = true
has = [
  "✓ tenths ",
  "✓ mid ",
  "✓ inverse ",
  "✓ floored ",
  "✗ reckless ",
  "✗ wrong ",
]

