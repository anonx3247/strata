# a `Real` is never built from its parts
[[step]]
strata = ["--file", "q.strata", "edit", "--as-given"]
text = '''
pub fn a() -> Real {
  Real { num: 2, den: 4 }
}

pub fn b(r: Real) -> Real {
  mut x := r
  x.num = 3
  x
}

pub fn d(x: Real) -> Real {
  n := 5
  x * n
}

pub fn c(r: Real) -> Int {
  r.num + r.den
}

fn main() {
  print(c(0.5))
}
'''
any_code = true

[[step]]
strata = ["--file", "q.strata", "check"]
fails = true
has = [
  "error in a: a `Real` is made by a literal (`0.5`, `2`), `Real.from(n)`, `Real.parse(s)` or arithmetic, not from its parts (`num` and `den` are kept in lowest terms)",
  "error in b: `x.num`: a `Real`'s `num` and `den` can't be assigned (it is kept in lowest terms): make a new one with arithmetic",
  "error in d: `*` operands: expected `Real`, found `Int`",
]
