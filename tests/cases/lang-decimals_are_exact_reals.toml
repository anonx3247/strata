# integer literals where a `Real` is wanted, patterns on literals, exact
# JSON numbers, a division by zero said as such

[[step]]
strata = ["--file", "p.strata", "edit"]
text = '''
from std.json use Json, parse, stringify

type Price = { amount: Real, rate: Float }

derive Json for Price

fn name(x: Real) -> String {
  match x {
    0.5 => "half",
    2 => "two",
    -1.5 => "minus",
    where it > 10.0 => "big",
    _ => "other",
  }
}

fn twice(x: Real) -> Real {
  x * 2 + 1
}

fn main() {
  print([name(0.5), name(1.0 / 2.0), name(2.0), name(12.5), name(0.25), name(-1.5)])
  print(twice(0.25))
  let r: Real = 3
  print(r / 4)
  // an integer literal with no `Real` asked for is an `Int`, next to Real code
  n := 5
  print([n / 2, n % 2])
  print(r * Real.from(n))
  p := Price { amount: 0.1 + 0.2, rate: 0.5 }
  print(stringify(p.to_json() !! std.json.Null))
  print(Price.from_json(parse("{\"amount\": 12345678901234567890.123456789, \"rate\": 0.25}") !! std.json.Null))
  print(stringify(parse("[0.1, 1e-30, 1e300, 3]") !! std.json.Null))
  print(1.0 / (r - 3))
}
'''

[[step]]
strata = ["--file", "p.strata", "build", "-o", "prog2"]

[[step]]
run = ["sh", "-c", "./prog2 2>&1; echo exit $?"]
stdout = "[\"half\", \"half\", \"two\", \"big\", \"other\", \"minus\"]\n1.5\n0.75\n[2, 1]\n15.0\n{\"type\":\"Price\",\"amount\":0.3,\"rate\":0.5}\nOk(Price { amount: 12345678901234567890.123456789, rate: 0.25 })\n[0.1,1e-30,1e+300,3]\nfault (Runtime): division by zero\n    stack: main\nexit 101\n"

