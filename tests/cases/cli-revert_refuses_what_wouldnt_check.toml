# `strata revert` checks the definition put back with the rest of the
# package before writing it: one whose callers have since changed is
# refused, and the file is left as it was.

[[step]]
run = ["git", "init", "-q", "-b", "main"]

[[step]]
run = ["git", "config", "user.name", "t"]

[[step]]
run = ["git", "config", "user.email", "t@example.com"]

[[step]]
strata = ["init"]

[[step]]
strata = ["edit", "shapes", "-m", "shapes"]
text = "pub fn area(w: Int) -> Int {\n  w * w\n}\n\npub fn twice(w: Int) -> Int {\n  area(w) * 2\n}\n"

[[step]]
strata = ["edit", "shapes", "-m", "area takes h"]
text = "pub fn area(w: Int, h: Int) -> Int {\n  w * h\n}\n\npub fn twice(w: Int) -> Int {\n  area(w, w) * 2\n}\n"

[[step]]
run = ["cp", "shapes.strata", "shapes.before"]

[[step]]
strata = ["revert", "shapes.area"]
fails = true
has = ["rejected: shapes.strata wouldn't check with `shapes.area` reverted", "nothing was written"]

[[step]]
run = ["cmp", "shapes.strata", "shapes.before"]

# `twice` reverted alone calls `area` the old way: refused too
[[step]]
strata = ["revert", "shapes.twice", "--force"]
fails = true
has = ["rejected"]

[[step]]
strata = ["check"]
has = ["ok"]
