# `--memory-sites` (docs/internals.md, "Memory"): a built program counts
# each counting operation by its site and reports the totals by kind and
# the sites counted most when it ends, the whole table to
# STRATA_MEMORY_SITES; the same on the JIT; and with every object freed
# (`grow` gives a small value: the box its caller makes of it is a site).
# After the sites, the totals by root (compiler/roots, case `build-roots`).

[[step]]
save = "sites.strata"
from = "sites.st"

[[step]]
strata = ["--file", "sites.strata", "build", "--no-verify", "--memory-sites", "-o", "prog"]

[[step]]
run = ["env", "STRATA_MEMORY_SITES=sites.tsv", "./prog"]
out = "10 0 [9, 2, 3] [1, 2, 3] 5 012345678901 18\nmemory sites: 105 sites\n  alloc              18 at 3 of 6 sites (heap 12, arena 6)\n  stack               4 at 1 of 1 sites\n  dup                53 at 10 of 15 sites\n  release           138 at 41 of 41 sites\n  unique              1 at 1 of 1 sites (held once 0, shared 1)\n  owned              16 at 2 of 2 sites (held once 15, shared 1)\n  push                0 at 0 of 1 sites (in place 0, new buffer 0)\n  append             12 at 1 of 1 sites (in place 11, new buffer 1)\n  arena               1 at 1 of 1 sites\n  unique.p           45 at 3 of 3 sites (held once 45, shared 0)\n  owned.p             0 at 0 of 0 sites (held once 0, shared 0)\n  runtime            59 at 27 of 33 sites (objects made 60)\n  allocations inside the runtime's functions: 63\ntop sites:\n            15 alloc    arena 5  grow  push(p.points, Point { x: i, y: i * i })\n            15 owned    shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 dup       grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 release   grow  push(p.points, Point { x: i, y: i * i })\n            15 dup       grow  push(p.points, Point { x: i, y: i * i })\n            15 release   grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  p.steps + 1\n            15 dup       grow  p.steps + 1\n            15 release   grow  p.steps + 1\n            15 release   drop:List[Point]  \n            12 runtime  made 12  label  s + to_string(i % 10)\n            12 append   new buffer 1  label  s + to_string(i % 10)\n            12 release   label  s + to_string(i % 10)\n            12 release   label  s + to_string(i % 10)\n             6 runtime  made 6  debug:List[Int]  \n             6 runtime  made 6  debug:List[Int]  \n             6 runtime  made 6  debug:List[Int]  \n             6 release   debug:List[Int]  \nmemory roots:                                                allocs   in arena      runtime     releases       nested\n  statement                                                       0          0           36           19           20\n  function                                                       17          6           12           55           18\n  counted: replaced in a loop                                     0          0           13           25            0\n  not classified                                                  1          0            0            1            0\n  releases in helpers called outside a release                                                                      0\n  scoped (codes 1-4), share of all                            94.4%                   78.7%        74.0%       100.0%\n"

[[step]]
run = ["head", "-3", "sites.tsv"]
out = "count\tsecond\tkind\tfunction\tlocation\tcode\troot\n15\t5\talloc\tgrow\t\tpush(p.points, Point { x: i, y: i * i })\tresult\n15\t15\towned\tgrow\t\tpush(p.points, Point { x: i, y: i * i })\t\n"

[[step]]
run = ["./prog"]
memory = true
stdout = "10 0 [9, 2, 3] [1, 2, 3] 5 012345678901 18\n"

[[step]]
strata = ["--file", "sites.strata", "run", "--memory-sites"]
out = "10 0 [9, 2, 3] [1, 2, 3] 5 012345678901 18\nmemory sites: 105 sites\n  alloc              18 at 3 of 6 sites (heap 12, arena 6)\n  stack               4 at 1 of 1 sites\n  dup                53 at 10 of 15 sites\n  release           138 at 41 of 41 sites\n  unique              1 at 1 of 1 sites (held once 0, shared 1)\n  owned              16 at 2 of 2 sites (held once 15, shared 1)\n  push                0 at 0 of 1 sites (in place 0, new buffer 0)\n  append             12 at 1 of 1 sites (in place 11, new buffer 1)\n  arena               1 at 1 of 1 sites\n  unique.p           45 at 3 of 3 sites (held once 45, shared 0)\n  owned.p             0 at 0 of 0 sites (held once 0, shared 0)\n  runtime            59 at 27 of 33 sites (objects made 60)\n  allocations inside the runtime's functions: 63\ntop sites:\n            15 alloc    arena 5  grow  push(p.points, Point { x: i, y: i * i })\n            15 owned    shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 dup       grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  push(p.points, Point { x: i, y: i * i })\n            15 release   grow  push(p.points, Point { x: i, y: i * i })\n            15 dup       grow  push(p.points, Point { x: i, y: i * i })\n            15 release   grow  push(p.points, Point { x: i, y: i * i })\n            15 unique.p shared 0  grow  p.steps + 1\n            15 dup       grow  p.steps + 1\n            15 release   grow  p.steps + 1\n            15 release   drop:List[Point]  \n            12 runtime  made 12  label  s + to_string(i % 10)\n            12 append   new buffer 1  label  s + to_string(i % 10)\n            12 release   label  s + to_string(i % 10)\n            12 release   label  s + to_string(i % 10)\n             6 runtime  made 6  debug:List[Int]  \n             6 runtime  made 6  debug:List[Int]  \n             6 runtime  made 6  debug:List[Int]  \n             6 release   debug:List[Int]  \nmemory roots:                                                allocs   in arena      runtime     releases       nested\n  statement                                                       0          0           36           19           20\n  function                                                       17          6           12           55           18\n  counted: replaced in a loop                                     0          0           13           25            0\n  not classified                                                  1          0            0            1            0\n  releases in helpers called outside a release                                                                      0\n  scoped (codes 1-4), share of all                            94.4%                   78.7%        74.0%       100.0%\n"
