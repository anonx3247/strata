# a contract that says what one value is (a `requires` conjunct naming one
# parameter, an `ensures` conjunct naming only `it`) is a refinement, and a
# refinement naming another parameter is a contract: `check` warns, showing the
# replacement, and `strata fix` makes it; `mut` parameters are left alone (a
# refinement holds for the variable's whole life, a `requires` only on entry), and
# so are relations

[[step]]
save = "s.strata"
text = '''
type Cents = Int where it >= 0

fn pay(price: Cents, n: Int) -> Cents
  requires price >= 100 && n > 0 && price > n
  ensures it >= 0
  ensures it >= price
{
  price * n
}

fn pick(n: Int, k: Int where it >= 0 && it <= n) -> Int where it <= n { k }

fn bump(mut n: Int) -> Int requires n > 0 {
  n += 1
  n
}

type Box = { v: Int }

impl Box {
  fn get(self) -> Int requires self.v > 0 { self.v }
}

fn main() {
  mut b := 1
  print(f"{pay(100, 2)} {pick(3, 2)} {bump(mut b)} {Box { v: 2 }.get()}")
}
'''

[[step]]
strata = ["--file", "s.strata", "check"]
has = [
  "warning: in `pay`, `requires price >= 100` only constrains `price`: that is a refinement of its type, `price: Cents where it >= 100`",
  "warning: in `pay`, `requires n > 0` only constrains `n`: that is a refinement of its type, `n: Int where it > 0`",
  "warning: in `pay`, `ensures it >= 0` only constrains the result: that is a refinement of its type, `-> Cents where it >= 0`",
  "warning: in `pick`, the refinement of `k: Int where it >= 0 && it <= n` names another parameter",
  "write `k: Int where it >= 0` and `requires k <= n`",
  "warning: in `pick`, the result's refinement (`-> Int where it <= n`) names a parameter",
  "write `-> Int` and `ensures it <= n`",
  "warning: in `Box.get`, `requires self.v > 0` only constrains `self`: that is a refinement of its type, `self: Self where it.v > 0`",
  "ok: 7 definitions check",
]
lacks = ["`bump`", "requires price > n` only", "ensures it >= price` only"]

[[step]]
strata = ["--file", "s.strata", "fix", "pick"]
has = ["fixed: in `pick`, the refinement of `k: Int where it >= 0 && it <= n`"]
lacks = ["`pay`"]

[[step]]
strata = ["--file", "s.strata", "fix"]
has = ["fixed: in `pay`", "fixed: in `Box.get`"]
lacks = ["`pick`"]

[[step]]
strata = ["--file", "s.strata", "fix"]
stdout = '''
nothing to fix
'''

[[step]]
strata = ["--file", "s.strata", "view", "main"]
has = [
  '''
fn pay(
  price: Cents where it >= 100,
  n: Int where it > 0,
) -> Cents where it >= 0
  requires price > n
  ensures it >= price {''',
  '''
fn pick(n: Int, k: Int where it >= 0) -> Int
  requires k <= n
  ensures it <= n {''',
  "fn bump(mut n: Int) -> Int\n  requires n > 0 {",
  "fn get(self: Self where it.v > 0) -> Int {",
]

[[step]]
strata = ["--file", "s.strata", "check"]
lacks = ["warning"]

[[step]]
strata = ["--file", "s.strata", "run"]
stdout = '''
200 2 2 2
'''

[[step]]
strata = ["--file", "s.strata", "verify"]
has = ["✓ pay ", "✓ pick ", "✓ Box.get "]
lacks = ["✗"]

# in a package, `fix` is one change, logged as an edit is
[[step]]
run = ["mkdir", "p"]

[[step]]
strata = ["init"]
dir = "p"

[[step]]
save = "p/main.strata"
text = '''
fn half(n: Int) -> Int requires n >= 0 ensures it >= 0 { n / 2 }

fn main() {
  print(half(8))
}
'''

[[step]]
strata = ["fix", "--no-commit", "-m", "refinements"]
dir = "p"
has = ["fixed: in `half`, `requires n >= 0` only constrains `n`"]

[[step]]
strata = ["view", "main"]
dir = "p"
has = ["fn half(n: Int where it >= 0) -> Int where it >= 0 {"]

[[step]]
run = ["sh", "-c", "grep -c refinements p/strata.log"]
stdout = '''
1
'''
