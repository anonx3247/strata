# types as values (lab trial, REBUILD.md "Types are values"): a type function
# (`type Patch[T: Record] = e`), made types used by name (`Patch[User] { .. }`),
# `x.(e)` read and written, `T.make(for f in T.fields: e)`, blanket impls over a
# kind (`impl[T: Record] Tr for T`), and their errors

[[step]]
strata = ["--file", "p.strata", "edit"]
text = '''
from std.typing use Type, Field, Record

type Change[T] =
  | Keep
  | Set(T)

/// Every field of `T` as a change, kept by default.
type Patch[T: Record] = Record { fields: [for f in T.fields: Field { name: f.name, type: Change[f.type], default: Some("Keep") }] }

/// Values changed by a patch `P`.
trait Patchable[P] {
  fn patched(self, p: P) -> Self
  fn apply(mut self, p: P)
}

impl[T: Record] Patchable[Patch[T]] for T {
  fn patched(self, p: Patch[T]) -> T {
    T.make(for f in T.fields: match p.(f.name) {
      Keep => self.(f.name),
      Set(v) => v,
    })
  }
  fn apply(mut self, p: Patch[T]) {
    comptime for f in T.fields {
      match p.(f.name) {
        Keep => (),
        Set(v) => {
          self.(f.name) = v
        },
      }
    }
  }
}

type User = { name: String, title: Option[String], age: Int }

type Point = { x: Int, y: Int }

fn main() {
  bob := User { name: "Bob", title: Some("Dr"), age: 40 }
  print(bob.patched(Patch[User] { title: Set(None) }))
  print(bob.patched(Patch[User] {}))
  mut b := bob
  mut b.apply(Patch[User] { age: Set(41), name: Set("Rob") })
  print(b)
  print(Point { x: 1, y: 2 }.patched(Patch[Point] { y: Set(5) }))
}
'''

[[step]]
strata = ["--file", "p.strata", "run"]
stdout = '''
User { name: "Bob", title: None, age: 40 }
User { name: "Bob", title: Some("Dr"), age: 40 }
User { name: "Rob", title: Some("Dr"), age: 41 }
Point { x: 1, y: 5 }
'''

# the sugar is shown back as written
[[step]]
strata = ["--file", "p.strata", "view", "main"]
has = ["type Patch[T: Record] = Record {", "type: Change[f.type],", "match p.(f.name) {", "self.(f.name) = v", "Patch[User] { title: Set(None) }"]

# an impl for one of the types a blanket impl covers overlaps it
[[step]]
strata = ["--file", "p.strata", "edit"]
text = '''
impl Patchable[Patch[Point]] for Point {
  fn patched(self, p: Patch[Point]) -> Point {
    self
  }
  fn apply(mut self, p: Patch[Point]) {
    ()
  }
}
'''
fails = true
has = ["`impl[T: Record] Patchable[Patch[T]] for T` overlaps `impl Patchable[Patch[Point]] for Point` (in the root module): both give `Patchable` to `Point`; overlapping impls are forbidden"]

# so does another blanket impl of the trait for the same kind
[[step]]
strata = ["--file", "p.strata", "edit"]
text = '''
impl[U: Record] Patchable[Patch[U]] for U {
  fn patched(self, p: Patch[U]) -> U {
    self
  }
  fn apply(mut self, p: Patch[U]) {
    ()
  }
}
'''
fails = true
has = ["overlaps `impl[T: Record] Patchable[Patch[T]] for T` (in the root module): both give `Patchable` to every Record"]

