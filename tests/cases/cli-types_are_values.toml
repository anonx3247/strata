# `Debug` ported to a generic impl (`Show`): one per kind
[[step]]
strata = ["--file", "s.strata", "edit"]
text = '''
from std.typing use Record, Union, Atom, implements, compile_error

/// A value written as code, like `Debug`.
trait Show {
  fn show(self) -> String
}

impl Show for Int {
  fn show(self) -> String {
    to_string(self)
  }
}

impl Show for String {
  fn show(self) -> String {
    debug(self)
  }
}

impl Show for Bool {
  fn show(self) -> String {
    to_string(self)
  }
}

impl[T: Record] Show for T {
  fn show(self) -> String {
    mut parts := []
    comptime for f in T.fields {
      if comptime !implements(f.type, "Show") {
        compile_error(f"field `{f.name}`: `{f.type.written}` doesn't implement `Show`")
      }
      mut parts.push(f.name + ": " + self.(f.name).show())
    }
    (comptime T.name ?? "") + " { " + join(parts, ", ") + " }"
  }
}

impl[U: Union] Show for U {
  fn show(self) -> String {
    match self {
      m => if comptime m.kind is Atom {
        comptime m.name ?? ""
      } else {
        (comptime m.name ?? "") + "(" + self.0.show() + ")"
      } for m in U.members,
    }
  }
}

type Point = { x: Int, y: Int }

type Shape =
  | Dot
  | Circle(Int)

type Pin = { at: Point, label: String, on: Bool, shape: Shape }

fn main() {
  print(Pin { at: Point { x: 1, y: 2 }, label: "home", on: true, shape: Circle(3) }.show())
  print(Dot.show())
}
'''

[[step]]
strata = ["--file", "s.strata", "run"]
stdout = '''
Pin { at: Point { x: 1, y: 2 }, label: "home", on: true, shape: Circle(3) }
Dot
'''

