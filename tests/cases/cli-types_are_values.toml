# a loop whose body reads a different field per element must be `comptime for`
[[step]]
strata = ["--file", "p.strata", "edit"]
text = '''
impl[T: Record] Patchable[Patch[T]] for T {
  fn patched(self, p: Patch[T]) -> T {
    self
  }
  fn apply(mut self, p: Patch[T]) {
    for f in T.fields {
      match p.(f.name) {
        Keep => (),
        Set(v) => {
          self.(f.name) = v
        },
      }
    }
  }
}
'''
fails = true
has = ["runs once at run time, but its body differs per element (it reads a field named by `f`): write `comptime for`"]

# `comptime for` over a list not known while compiling
[[step]]
strata = ["--file", "c.strata", "edit"]
text = '''
fn total(xs: List[Int]) -> Int {
  mut n := 0
  comptime for x in xs {
    n += x
  }
  n
}
'''
fails = true
has = ["the list of a `comptime for` must be known at compile time: unknown variable `xs`"]

