# resolve.rs: dependency_rules: what a package doesn't reach isn't read; --with-deps checks the
# dependencies' tests too; `exports` limit what is part of the contract; a module named like a
# dependency is refused (`strata check --std DIR [--with-deps] PACKAGE`)

[[step]]
write = "json/strata.toml"
text = '''
name = "json"
[deps]
'''

[[step]]
strata = ["--file", "json/", "edit", "main", "--as-given"]
text = '''
pub type Kind = | Num | Word(String)
pub fn parse(s: String) -> Kind { Num }
'''
any_code = true

[[step]]
write = "json/strata.toml"
text = '''
name = "json"
[deps]
'''

[[step]]
strata = ["--file", "json/", "edit", "text", "--as-given"]
text = '''
pub fn k() -> Kind { match parse("x") { Num => Word("n"), w => w } }
test "k" { assert k() == Word("n") }
'''
any_code = true

[[step]]
write = "json/strata.toml"
text = '''
name = "json"
[deps]
'''

[[step]]
strata = ["--file", "json/", "edit", "spare", "--as-given"]
text = '''
pub fn unused() -> Int { 1 }
test "broken"(n: Int) { assert unused() == n }
'''
any_code = true

[[step]]
write = "app/strata.toml"
text = '''
name = "app"
[deps]
json = { path = "../json" }
'''

[[step]]
strata = ["--file", "app/", "edit", "main", "--as-given"]
text = '''
from json use Word
use json.text
fn main() { print(text.k() == Word("n")) }
'''
any_code = true

# spare's failing test is left out, and with it everything else of spare
[[step]]
strata = ["check"]
dir = "app"
has = ["ok: "]
lacks = ["error"]

# a module the package doesn't reach isn't read: not even when it isn't a module file
[[step]]
write = "json/spare.strata"
text = "not a module file"

[[step]]
strata = ["check"]
dir = "app"
has = ["ok: "]
lacks = ["error"]

# exports: modules or definitions; the rest of what is `pub` can't be used from outside
[[step]]
write = "json/strata.toml"
text = '''
name = "json"
exports = ["text", "Kind"]
'''

[[step]]
write = "hidden/strata.toml"
text = '''
name = "hidden"
[deps]
json = { path = "../json" }
'''

[[step]]
strata = ["--file", "hidden/", "edit", "main", "--as-given"]
text = '''
from json use parse, Kind
use json.text
fn main() { print(text.k() == Num) }
'''
any_code = true

[[step]]
strata = ["check"]
dir = "hidden"
any_code = true
has = ["error in use json: `parse` isn't exported by package `json` (only what its strata.toml's `exports` lists is part of its contract)"]

[[step]]
write = "clash/strata.toml"
text = '''
name = "clash"
[deps]
json = { path = "../json" }
'''

[[step]]
strata = ["--file", "clash/", "edit", "json", "--as-given"]
text = '''
pub fn f() -> Int { 1 }
'''
any_code = true

[[step]]
strata = ["check"]
dir = "clash"
any_code = true
has = ["error: module `json` is named like the dependency `json`"]
