# `strata --file F edit` writes what doesn't check all the same (scripts are
# written in steps) and says so plainly: how many errors, which, and that a
# package's edit would be rejected; exit 1

[[step]]
strata = ["--file", "s.strata", "edit"]
text = '''
fn f(x: Int) -> Int {
  x + true
}

fn g() -> Int {
  len(1)
}
'''
code = 1
has = ["written: s.strata doesn't check (2 errors; --file edits are kept as given, unlike a package's edit, which is rejected):", "  error in f:", "  error in g:"]

[[step]]
strata = ["--file", "s.strata", "view", "main"]
has = ["x + true"]

[[step]]
strata = ["--file", "s.strata", "edit"]
text = "fn g() -> Int { 1 }"
code = 1
has = ["(1 error;"]
