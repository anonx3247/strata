# build.rs: what_is_not_compiled_yet_is_named, with the code it is in and
# where (its location, as `strata check` shows its errors)
[[step]]
save = "many.strata"
from = "many.st"

[[step]]
strata = ["build", "many.strata", "--emit-llvm"]
fails = true
has = ["in `main`: not compiled yet: calling `copies` (it mentions `Self` inside another type) on a value of the trait type `Many`"]

[[step]]
strata = ["run", "many.strata"]
fails = true
has = ["compiler/codegen doesn't cover this program yet:", "in `main`: not compiled yet: calling `copies` (it mentions `Self` inside another type) on a value of the trait type `Many`, in `m.copies()`", "--> main@", "/body/1/args/0/args/0", "|   print(len(m.copies()))"]
