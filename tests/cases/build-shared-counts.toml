# build.rs: tasks share nested values with the main thread and each other,
# through captures, channels, `await` on two threads, races and panics:
# what crosses to another thread is moved or copied, never counted by two
# threads (codegen's cross:T), and every object is freed once
# (STRATA_MEMORY=check), on every run

[[step]]
save = "shared.strata"
from = "shared.st"

[[step]]
strata = ["build", "shared.strata", "-o", "prog"]

[[step]]
run = ["./prog"]
memory = true
golden = "tests/data/build/expected/shared-counts.out"

[[step]]
run = ["./prog"]
memory = true
golden = "tests/data/build/expected/shared-counts.out"

[[step]]
run = ["./prog"]
memory = true
golden = "tests/data/build/expected/shared-counts.out"

[[step]]
strata = ["run", "shared.strata"]
golden = "tests/data/build/expected/shared-counts.out"
