# verified: the bound's fields are known, their refinements included
[[step]]
strata = ["--file", "v.strata", "edit"]
text = '''
type Cents = Int where it >= 0

type Order = { id: Int, total: Cents, note: String }

fn total_of(x: { total: Cents, .. }) -> Cents
  ensures it == x.total
= x.total

fn bigger[T: { total: Cents, .. }](a: T, b: T) -> T
  ensures it.total >= a.total && it.total >= b.total
  ensures it.total == a.total || it.total == b.total
{
  if a.total >= b.total { a } else { b }
}

fn wrong[T: { total: Cents, .. }](a: T) -> Int
  ensures it > a.total
= a.total

fn twice(o: Order) -> Int
  ensures it == 2 * o.total
= total_of(o) + bigger(o, o).total
'''

[[step]]
strata = ["--file", "v.strata", "verify", "--no-race"]
fails = true
has = [
  "✓ total_of                 proven (2 checks)",
  "✓ bigger                   proven (3 checks)",
  "✓ twice                    proven (4 checks)",
  "✗ wrong",
  "input:   Order { id: ",
  "postcondition of `wrong` violated: ensures it > a.total",
]

