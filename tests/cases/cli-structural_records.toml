# anonymous records: `{ id: 1, total: 2 }` is a value of `{ id: Int, total: Int }`
# (one generated record type per set of field names, its fields' types its
# arguments): a variable's, a result's and a field's type; equal by fields;
# printed as written; given where an open structural type is asked for
[[step]]
strata = ["--file", "an.strata", "edit"]
text = '''
from std.io use Console

type Order = { id: Int, total: Int, note: String }

/// A summary as an anonymous record.
fn summary(o: Order) -> { id: Int, total: Int } = { id: o.id, total: o.total }

fn total_of(x: { total: Int, .. }) -> Int = x.total

type Report = { best: { id: Int, total: Int }, count: Int }

fn main(mut console: Console) {
  o := Order { id: 7, total: 10, note: "n" }
  s := summary(o)
  let t: { total: Int, id: Int } = { total: 10, id: 7 }
  mut console.print(to_string(s))
  mut console.print(to_string(s == t))
  mut console.print(to_string(total_of(s) + total_of(o)))
  r := Report { best: s, count: 2 }
  mut console.print(to_string(r))
  mut console.print(to_string(r.best.id + r.count))
}
'''

