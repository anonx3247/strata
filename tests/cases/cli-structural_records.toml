fails = true
text = '''
type Order = { id: Int, total: Int }

type Note = { text: String }

type Store[K] = { name: String, key: K }

trait Liner {
  fn line[T: { id: Int, .. }](self, x: T) -> Int
}

type Shop = { name: String }

impl Liner for Shop {
  fn line[T: { id: Int, .. }](self, x: T) -> Int = x.id
}

impl[K] Store[K] {
  fn put(self, x: { id: K, .. }) -> K = x.id
}

fn via_trait(r: Liner, n: Note) -> Int = r.line(n)

fn via_bound[R: Liner](r: R, n: Note) -> Int = r.line(n)

fn via_type(s: Shop, n: Note) -> Int = s.line(n)

fn generic_impl(s: Store[String], o: Order) -> String = s.put(o)

fn fine(r: Liner, o: Order) -> Int = r.line(o)
'''
