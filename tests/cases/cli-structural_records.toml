# `derive Json` reaches the anonymous records a derived type holds: written
# without "type", read back equal
[[step]]
strata = ["--file", "aj.strata", "edit"]
text = '''
from std.json use Json

type Report = { best: { id: Int, total: Int }, count: Int }

derive Json for Report

fn out() -> Result[String, String] {
  r := Report { best: { id: 1, total: 2 }, count: 3 }
  j := r.to_json()!
  back := Report.from_json(j)!
  Ok(j.to_string() + " " + to_string(back == r))
}
'''

