# `{ ..x, total: 0 }` without a type's name: a new value of `x`'s type (x
# unchanged), on a record, a structural parameter and an anonymous record
[[step]]
strata = ["--file", "up.strata", "edit"]
text = '''
from std.io use Console

type Order = { id: Int, total: Int, note: String }

fn zeroed[T: { total: Int, .. }](x: T) -> T = { ..x, total: 0 }

fn assign(mut o: Order)
  ensures o.total == 0 && o.id == old(o.id)
{
  o.total = 0
}

fn update(mut o: Order)
  ensures o.total == 0 && o.id == old(o.id)
{
  o = { ..o, total: 0 }
}

fn named(mut o: Order)
  ensures o.total == 0 && o.id == old(o.id)
{
  o = Order { ..o, total: 0 }
}

fn main(mut console: Console) {
  o := Order { id: 1, total: 5, note: "n" }
  y := { ..o, total: 9 }
  mut console.print(to_string(y) + " " + to_string(o))
  mut console.print(to_string(zeroed(o)))
  s := { id: 2, total: 3 }
  mut console.print(to_string(zeroed(s)) + " " + to_string({ ..s, id: 4 }))
  mut a := o
  assign(mut a)
  mut b := o
  update(mut b)
  mut c := o
  named(mut c)
  mut console.print(to_string(a == b && b == c))
}
'''

[[step]]
strata = ["--file", "up.strata", "view", "main"]
has = ["  y := { ..o, total: 9 }", "  o = { ..o, total: 0 }", "fn zeroed[T: { total: Int, .. }](x: T) -> T {"]

[[step]]
strata = ["--file", "up.strata", "run"]
stdout = "Order { id: 1, total: 9, note: \"n\" } Order { id: 1, total: 5, note: \"n\" }\nOrder { id: 1, total: 0, note: \"n\" }\n{ id: 2, total: 0 } { id: 4, total: 3 }\ntrue\n"

# `o = { ..o, total: 0 }`, `o = Order { ..o, total: 0 }` and `o.total = 0`
# are one program: the same proof, and the same IR (the field set in place
# when `o` is held once, `strata_unique`), but for names
[[step]]
strata = ["--file", "up.strata", "verify", "--no-race", "assign,update,named"]
has = [
  "✓ assign                   proven (1 check)",
  "✓ update                   proven (1 check)",
  "✓ named                    proven (1 check)",
]

[[step]]
strata = ["--file", "up.strata", "build", "--no-verify", "--emit-llvm", "-o", "up.ll"]

[[step]]
run = ["sh", "-c", '''for f in assign update named; do awk "/^define .*\"strata:$f\"/,/^}/" up.ll | sed -E 's/%[a-z.]+[0-9]+/%r/g; s/[a-z]+\.[a-z]+\.[0-9]+/L/g; s/@\.str\.[0-9A-F]+/@s/g; s/^[a-z.]+[0-9]+:/L:/; s/strata:[a-z]+/strata:F/' > $f.norm; done; cmp assign.norm update.norm && cmp assign.norm named.norm && grep -c strata_unique assign.norm''']
stdout = "1\n"

