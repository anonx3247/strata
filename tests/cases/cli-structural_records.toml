text = '''
type Cents = Int where it >= 0

type Order = { id: Int, total: Cents, note: String }

fn summary(o: Order) -> { id: Int, total: Cents }
  ensures it.id == o.id && it.total == o.total
= { id: o.id, total: o.total }

fn bumped(s: { id: Int, total: Cents }) -> { id: Int, total: Cents }
  ensures it.total == s.total + 1
= { id: s.id, total: s.total + 1 }

fn wrong(s: { id: Int, total: Int }) -> Int
  ensures it > s.total
= s.total

fn total_of(x: { total: Cents, .. }) -> Cents = x.total

fn use_it(o: Order) -> Int = total_of(summary(o))

fn raw_total(n: Int) -> Int = total_of({ total: n, id: 1 })
'''

