# cli.rs: learn_strata_code_is_valid_and_canonical: docs/learn-strata.md: the first ```rust block checks, its tests pass, and it
# is as `view` prints it, definition by definition

[[step]]
run = ["sh", "-c", "awk '/^```rust$/{f=1;next} f&&/^```$/{exit} f' $ROOT/docs/learn-strata.md > learn.st"]

[[step]]
save = "learn.strata"
from_tmp = "learn.st"

[[step]]
strata = ["--file", "learn.strata", "check"]

[[step]]
strata = ["--file", "learn.strata", "test"]
has = ["0 failed"]

# each definition as `view` prints it (`view` shows them in reading order,
# the tutorial in its own: the lines, sorted, are the same)
[[step]]
run = ["sh", "-c", "\"$STRATA\" --file learn.strata view main --proofs | LC_ALL=C sort > viewed && LC_ALL=C sort learn.st | diff viewed - && echo same"]
stdout = "same\n"
