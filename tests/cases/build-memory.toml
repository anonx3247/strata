# build.rs: programs built (`strata build`) and run with arguments, their
# output and exit code as recorded (tests/data/build/expected), every object
# freed (STRATA_MEMORY=check)

[[step]]
save = "features.strata"
from = "features.st"

[[step]]
strata = ["build", "features.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-features.out"

[[step]]
save = "in_place.strata"
from = "in_place.st"

[[step]]
strata = ["build", "in_place.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-in_place.out"

[[step]]
save = "insert_in_place.strata"
from = "insert_in_place.st"

[[step]]
strata = ["build", "insert_in_place.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-insert_in_place.out"

[[step]]
save = "more_in_place.strata"
from = "more_in_place.st"

[[step]]
strata = ["build", "more_in_place.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-more_in_place.out"

[[step]]
save = "nested_assign.strata"
from = "nested_assign.st"

[[step]]
strata = ["build", "nested_assign.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-nested_assign.out"

[[step]]
save = "stack.strata"
from = "stack.st"

[[step]]
strata = ["build", "stack.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/memory-stack.out"

# values that stay in their block, on the stack; fields assigned, entries
# inserted and removed in place
[[step]]
strata = ["build", "stack.strata", "--emit-llvm"]
counts = { " = alloca [" = 2 }

[[step]]
strata = ["build", "in_place.strata", "--emit-llvm"]
has = ["@strata_unique(ptr"]

[[step]]
strata = ["build", "insert_in_place.strata", "--emit-llvm"]
has = ["@strata_tbl_owned(ptr", "@strata_tbl_add(ptr"]

# (4 in `main`; the 5th is `wrap`'s result, built on the stack and
# returned in registers)
[[step]]
strata = ["build", "more_in_place.strata", "--emit-llvm"]
counts = { " = alloca [" = 5 }
has = ["@strata_tbl_remove_at(ptr"]

# a chain too long to drop recursively
[[step]]
save = "chain.strata"
from = "chain.st"

[[step]]
strata = ["build", "chain.strata", "-o", "chain"]

[[step]]
run = ["./chain"]
memory = true
stdout = "999999\n"
