# strata revert NAME [COMMIT]: the definition as it was before COMMIT
# (default: its last change) changed it, in the working tree, the other
# definitions untouched, not committed.

[[step]]
run = ["git", "init", "-q", "-b", "main"]

[[step]]
run = ["git", "config", "user.name", "t"]

[[step]]
run = ["git", "config", "user.email", "t@example.com"]

[[step]]
strata = ["init"]

[[step]]
strata = ["edit", "shapes", "-m", "shapes"]
text = '''
pub fn area(w: Int, h: Int) -> Int {
  w * h
}

pub fn other() -> Int {
  1
}
'''

[[step]]
strata = ["edit", "shapes", "-m", "document area"]
text = '''
/// The area of a rectangle.
pub fn area(w: Int, h: Int) -> Int {
  w * h
}
'''

[[step]]
strata = ["edit", "shapes", "-m", "other is 2"]
text = '''
pub fn other() -> Int {
  2
}
'''

[[step]]
strata = ["edit", "shapes", "-m", "areas are never negative"]
text = '''
/// The area of a rectangle.
pub fn area(w: Int, h: Int) -> Int requires w >= 0 && h >= 0 {
  w * h
}
'''

# its last change undone: the doc stays, `other` stays 2
[[step]]
strata = ["revert", "shapes.area"]
has = ["`shapes.area` as it was before", "(areas are never negative), in shapes.strata (not committed)", "looser precondition"]

[[step]]
strata = ["view", "shapes"]
stdout = '''
/// The area of a rectangle.
pub fn area(w: Int, h: Int) -> Int {
  w * h
}

pub fn other() -> Int {
  2
}
'''

[[step]]
run = ["sh", "-c", "git log --oneline | wc -l | tr -d ' '"]
stdout = "4\n"

# it would lose an uncommitted change
[[step]]
strata = ["revert", "shapes.area"]
code = 2
has = ["has uncommitted changes"]

[[step]]
run = ["git", "checkout", "-q", "--", "."]

# a commit that didn't change it
[[step]]
run = ["sh", "-c", "git log --format=%h --grep='other is 2' > other.sha"]

[[step]]
run = ["sh", "-c", "\"$STRATA\" revert shapes.area $(cat other.sha)"]
code = 2
has = ["didn't change `shapes.area`"]

# the doc's commit undone: the definition before it, doc comment included
[[step]]
run = ["sh", "-c", "\"$STRATA\" revert shapes.area $(git log --format=%h --grep='document area')"]
has = ["(document area)", "doc: [-The area of a rectangle.-]"]

[[step]]
strata = ["view", "shapes"]
has = ["pub fn area(w: Int, h: Int) -> Int {"]
lacks = ["The area of a rectangle", "requires"]

# the commit that added it: removed, with --force over the change just made
[[step]]
run = ["sh", "-c", "\"$STRATA\" revert shapes.area $(git log --format=%h --grep='^shapes$') --force"]
has = ["`shapes.area` removed", "(shapes) added it"]

[[step]]
strata = ["view", "shapes"]
stdout = '''
pub fn other() -> Int {
  2
}
'''

[[step]]
strata = ["check"]
