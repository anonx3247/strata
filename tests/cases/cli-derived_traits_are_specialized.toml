from std.typing use Record
derivable(Record) trait Sized { derived fn n(self) -> Int { comptime len(Self.fields) } }
type S =
  | One
  | Two
derive Sized for S
'''
fails = true
has = ["`Sized` can only be derived for a `Record`, and `S` isn't one", "written, but"]

