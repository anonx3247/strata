# build.rs: programs built (`strata build`) and run with arguments, their
# output and exit code as recorded (tests/data/build/expected), every object
# freed (STRATA_MEMORY=check)

[[step]]
save = "trait_methods.strata"
from = "trait_methods.st"

[[step]]
strata = ["build", "trait_methods.strata", "-o", "prog"]

[[step]]
run = ["./prog", "one", "two words"]
memory = true
golden = "tests/data/build/expected/trait-methods-trait_methods.out"
