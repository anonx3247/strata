# The compiler written in Strata: the syntax tree (`ast`), the binary format
# (`binary`), the printer (`text`), lexer, parser, resolver, type checker
# (`check`, `exhaustive`), an evaluator (`eval`) and the code generator
# (`codegen`, LLVM IR as text). A program, not a
# library: its `main` runs one step of the front end on files
# (`strata --file compiler run -- lex FILE`), which the tests compare with
# the Rust front end; later `strata` will run it as its front end.
name = "compiler"

# LLVM's C API, for the JIT (`compiler jit`): where Homebrew puts LLVM
[native]
sources = ["c/jit.c"]
libs = ["LLVM-C"]
include_dirs = ["/opt/homebrew/opt/llvm/include"]
lib_dirs = ["/opt/homebrew/opt/llvm/lib"]
