<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
:root {
  /* the tour's colours (site/style.css): dark blue-greys and a periwinkle accent;
     the code keeps the viewer's own highlighting */
  color-scheme: dark;
  --bg: #0d0e12; --panel: #13151b; --line: #262a33; --line2: #323743; --text: #ecebe6; --muted: #9b9a94; --faint: #5f6069;
  --accent: #8ea2ff; --accent-soft: #8ea2ff1f;
  --type: #b197fc; --effect: #f783ac; --fn: #74c0fc; --test: #a9e34b;
  --ok: #5fd07a; --warn: #e9d27a; --bad: #ff6b6b;
  --code-bg: #171a21; --kw: #da77f2; --str: #8ce99a; --num: #ffa8a8; --com: #6f7079; --hole-bg: #4a3d0a;
  --kw-ctl: #74c0fc; --kw-spec: #f783ac; --base: #66d9e8; --utype: #ffc078;
  --mono: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --display: "Space Grotesk", "Inter", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--sans); background: var(--bg); color: var(--text); display: grid;
  grid-template-rows: auto auto 1fr; grid-template-columns: 240px 1fr 340px; grid-template-areas: "top top top" "banner banner banner" "left main right"; }
header { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font: 600 16px var(--display); letter-spacing: -.01em; }
header .path { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.chips { display: flex; gap: 6px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
.chip.warn b { color: var(--warn); } .chip.bad b { color: var(--bad); } .chip.ok b { color: var(--ok); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:hover:not(.on) { color: var(--text); }
input[type=search] { font: inherit; padding: 4px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--text); width: 180px; }
.live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.live.off i { background: var(--bad); }

#banner { grid-area: banner; }
#banner .err { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); border-bottom: 1px solid var(--line); padding: 6px 14px; font-family: var(--mono); font-size: 12px; }
#banner .err a { color: var(--bad); cursor: pointer; font-weight: 600; }

aside, main { overflow: auto; min-height: 0; }
#left { grid-area: left; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0 20px; }
#right { grid-area: right; border-left: 1px solid var(--line); background: var(--panel); }
main { grid-area: main; position: relative; }

.group h4 { margin: 12px 14px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); font-weight: 600; }
.item { display: flex; align-items: center; gap: 8px; padding: 3px 14px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.item.dim { opacity: .35; }
.item .lbl { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.none { background: transparent; border: 1px solid var(--faint); }
.kind { font-size: 10px; font-weight: 700; width: 14px; text-align: center; flex: none; font-family: var(--sans); }
.k-type { color: var(--type); } .k-effect { color: var(--effect); } .k-fn { color: var(--fn); } .k-test { color: var(--test); }

/* code view */
#code { padding: 16px 22px 60px; max-width: 980px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
.cgroup { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card { display: grid; grid-template-columns: 26px 1fr; scroll-margin-top: 12px; border-left: 2px solid transparent; }
.card + .card { border-top: 1px solid var(--line); }
.card.sel { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--code-bg)); }
.card.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--warn) 22%, var(--code-bg)); } 100% { background: transparent; } }
.card .gut { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 12px; cursor: pointer; }
.card .gut .kind { font-size: 10.5px; }
.card pre { background: transparent; padding: 9px 14px 9px 2px; }
.meta { float: right; display: inline-flex; gap: 8px; align-items: baseline; font: 11px var(--sans); color: var(--faint); margin-left: 16px; }
.meta .ok { color: var(--ok); } .meta .warn { color: var(--warn); } .meta .bad { color: var(--bad); }
a.tog { font: 11px var(--sans); color: var(--muted); cursor: pointer; border-radius: 4px; padding: 0 4px; white-space: nowrap; }
a.tog:hover { color: var(--accent); background: var(--accent-soft); }
a.tog .br { font-family: var(--mono); font-size: 12.5px; }
.toolbar button.plain { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 9px; padding: 3px 9px; cursor: pointer; }
.toolbar button.plain:hover { color: var(--text); }
.navb button { font-size: 13px; padding: 2px 9px; }
#nav .navb { background: var(--bg); }
.navb button:disabled { color: var(--faint); opacity: .5; cursor: default; }
.doc code { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
.badge { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.muted { color: var(--faint); }
pre { margin: 0; padding: 10px 14px; background: var(--code-bg); font: 12.5px/1.55 var(--mono); overflow-x: auto; white-space: pre; font-variant-ligatures: contextual; font-feature-settings: "calt", "liga"; }
.t-kw { color: var(--kw); } .t-str { color: var(--str); } .t-num { color: var(--num); } .t-com { color: var(--com); font-style: italic; }
.t-ty { color: var(--base); } .t-uty { color: var(--utype); } .t-doc { color: var(--com); }
.t-ctl { color: var(--kw-ctl); } .t-spec { color: var(--kw-spec); } .t-lit { color: var(--num); }
/* a reference keeps its token colour; only the underline marks it clickable */
a.ref.t-ty { color: var(--base); } a.ref.t-uty { color: var(--utype); }
/* capabilities and capability traits: what reaches the outside world */
.t-cap, a.ref.t-cap { color: var(--effect); font-weight: 600; } .k-capability { color: var(--effect); }
.t-hole { background: var(--hole-bg); border-radius: 3px; padding: 0 2px; font-weight: 600; }
a.ref { color: inherit; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: pointer; }
a.ref:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* map */
#tmap { display: block; cursor: grab; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
#tmap:active { cursor: grabbing; }
.tnode { cursor: pointer; }
.tnode rect.body { fill: var(--panel); stroke: var(--line); rx: 8; }
.tnode rect.head { fill: color-mix(in srgb, var(--type) 10%, var(--panel)); stroke: none; rx: 8; }
.tnode.k-effect rect.head { fill: color-mix(in srgb, var(--effect) 12%, var(--panel)); }
.tnode.k-alias rect.head { fill: var(--bg); }
.tnode.sel rect.body { stroke: var(--accent); stroke-width: 2; }
.tnode.fade { opacity: .28; }
.tnode .tn { font: 600 12.5px var(--mono); fill: var(--text); }
.tnode .tk { font: 10.5px var(--sans); fill: var(--faint); }
.tnode.k-effect .tn { fill: var(--effect); }
.tnode .tl { font: 11.5px var(--mono); fill: var(--text); }
.tnode .tl.muted { fill: var(--muted); font-style: italic; }
.tnode .tl.meth { fill: var(--fn); }
.tnode tspan.t-kw { fill: var(--kw); } .tnode tspan.t-ctl { fill: var(--kw-ctl); } .tnode tspan.t-spec { fill: var(--kw-spec); }
.tnode tspan.t-ty { fill: var(--base); } .tnode tspan.t-uty { fill: var(--utype); } .tnode tspan.t-str { fill: var(--str); }
.tnode tspan.t-num, .tnode tspan.t-lit { fill: var(--num); } .tnode tspan.t-com, .tnode tspan.t-doc { fill: var(--com); }
.tedge { stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.tedge.refines, .tedge.alias { stroke: var(--type); stroke-dasharray: 5 4; }
.tedge.op { stroke: var(--effect); stroke-dasharray: 2 3; }
.tedge.hot { opacity: 1; stroke-width: 2; }
.tedge.fade { opacity: .12; }
.tlabel { font: 10.5px var(--mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
.maptools { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; color: var(--muted); font-size: 11.5px; }
.maptools button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.maptools .sep { width: 1px; height: 14px; background: var(--line); }
.maptools span { display: inline-flex; align-items: center; gap: 5px; }
.lg { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--muted); }
.lg.refines { border-top: 2px dashed var(--type); } .lg.op { border-top: 2px dotted var(--effect); }
.muted { color: var(--muted); }
/* code view sections, inspector source, mini graph, hover arrow */
h2.sect { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .7px; color: var(--faint); margin: 22px 0 8px; }
.item.hover { background: color-mix(in srgb, var(--warn) 14%, transparent); }
.card.hover { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--code-bg)); }
.mg { display: block; overflow: visible; }
.mg-h { display: flex; justify-content: space-between; color: var(--faint); font-size: 10.5px; padding: 0 20px; }
.mg-e { fill: none; stroke: var(--faint); stroke-width: 1.2; }
.mg-c { fill: var(--accent); }
.mg-n { cursor: pointer; }
.mg-n text { font: 11.5px var(--mono); fill: var(--text); }
.mg-n:hover text { fill: var(--accent); text-decoration: underline; }
.mg-n text.k-type, .mg-n text.k-trait { fill: var(--type); } .mg-n text.k-fn { fill: var(--fn); } .mg-n text.k-impl { fill: var(--accent); } .mg-n text.k-test { fill: var(--test); }
#arrow { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
#arrow path { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; }
#arrow circle { fill: var(--warn); }
#arrow text { font: 600 12px var(--mono); fill: var(--warn); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
/* modules */
.mod-h { padding: 8px 14px 2px; cursor: pointer; font-size: 12.5px; }
.mod-h b { font-family: var(--mono); }
.mod-uses { color: var(--faint); font-size: 11px; font-family: var(--mono); margin: 1px 0 0 14px; }
.item.private .lbl { color: var(--muted); font-style: italic; }
.region { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: color-mix(in srgb, var(--accent) 30%, var(--line)); stroke-dasharray: 6 5; }
.region-l { font: 600 13px var(--mono); fill: var(--accent); }
/* types: traits */
.tnode.k-trait rect.head { fill: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.tnode.k-trait .tn { fill: var(--accent); }
.tnode.k-distinct rect.head { fill: color-mix(in srgb, var(--type) 18%, var(--panel)); }
.tedge.implements, .tedge.extends { stroke: var(--accent); stroke-width: 1.6; }
.tedge.extends { stroke-dasharray: 7 3; }
.lg.impl { border-top: 2px solid var(--accent); }
.k-trait { color: var(--accent); } .k-impl { color: var(--accent); } .k-extern { color: var(--effect); }
/* flow graph */
.fctl { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; font-size: 11.5px; }
.fctl .seg button { padding: 2px 9px; font-size: 11.5px; }
.g-wrap { padding: 10px 0 40px; overflow-x: auto; }
.g-wrap > .g-seq { width: max-content; min-width: 100%; margin: 0 auto; }
.g-seq { display: flex; flex-direction: column; align-items: center; }
.g-seq > * + * { margin-top: 24px; position: relative; }
.g-seq > * + *::before { content: ''; position: absolute; top: -22px; left: 50%; height: 16px; border-left: 1.5px solid var(--faint); }
.g-seq > * + *::after { content: ''; position: absolute; top: -7px; left: calc(50% - 4px); border: 4px solid transparent; border-top: 6px solid var(--faint); border-bottom: 0; }
.g-node { font: 12px var(--mono); padding: 5px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); white-space: nowrap; max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
.g-node[data-gtoggle], .g-frame-h[data-gtoggle] { cursor: pointer; }
.g-node[data-gtoggle]:hover, .g-frame-h[data-gtoggle]:hover { border-color: var(--accent); color: var(--accent); }
.g-more { color: var(--faint); font-size: 10px; }
.g-start, .g-end { border-radius: 16px; background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.g-quiet { color: var(--faint); border-style: dashed; }
.g-call { border-color: color-mix(in srgb, var(--fn) 45%, var(--line)); }
.g-eff { border-radius: 16px; border-color: color-mix(in srgb, var(--effect) 55%, var(--line)); }
.g-ans { color: var(--muted); font-family: var(--sans); font-size: 11px; margin-left: 6px; }
.g-ans .bad { color: var(--bad); }
.g-frame { border: 1px solid var(--line); border-radius: 10px; padding: 0 16px 14px; background: color-mix(in srgb, var(--fn) 3%, var(--panel)); display: flex; flex-direction: column; align-items: center; }
.g-frame.g-eff { background: color-mix(in srgb, var(--effect) 4%, var(--panel)); border-radius: 12px; }
.g-frame-h { align-self: stretch; font: 600 12px var(--mono); padding: 6px 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; white-space: nowrap; }
.g-scope { border: 1.5px dashed color-mix(in srgb, var(--effect) 45%, var(--line)); border-radius: 12px; padding: 0 16px 14px; display: flex; flex-direction: column; align-items: center; }
.g-scope-h { align-self: stretch; color: var(--muted); font-size: 11.5px; padding: 7px 0 12px; }
.g-chip { font: 11.5px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; margin-left: 3px; }
.g-sub { color: var(--faint); font-size: 11px; margin: 14px 0 0; }
.g-split { display: flex; flex-direction: column; align-items: center; }
.g-cond { border-radius: 4px; transform: none; border-color: color-mix(in srgb, var(--type) 50%, var(--line)); background: color-mix(in srgb, var(--type) 6%, var(--panel)); }
.g-disp { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.g-arms { display: flex; gap: 22px; align-items: stretch; margin-top: 18px; border-top: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); position: relative; }
.g-arms::before { content: ''; position: absolute; top: -19px; left: 50%; height: 18px; border-left: 1.5px solid var(--faint); }
.g-arm { display: flex; flex-direction: column; align-items: center; padding-top: 14px; position: relative; min-width: 60px; }
.g-arm::before { content: ''; position: absolute; top: 0; left: 50%; height: 13px; border-left: 1.5px solid var(--faint); }
.g-arm > .g-seq, .g-arm > .g-node, .g-arm > .g-frame { margin-top: 10px; }
.g-label { font: 11px var(--mono); color: var(--type); background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.g-fill { flex: 1; min-height: 12px; border-left: 1.5px solid var(--faint); margin-top: 6px; }
.g-join { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); margin-top: 0; }
.g-loop { border: 1.5px solid color-mix(in srgb, var(--type) 45%, var(--line)); border-radius: 14px; padding: 0 16px 14px; display: flex; flex-direction: column; align-items: center; }
.g-loop-h { align-self: stretch; font-size: 11.5px; color: var(--text); padding: 7px 0 12px; }
/* flow */
#flow { padding: 14px 22px 60px; font-size: 12.5px; }
.entries { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 6px; }
.elab { width: 84px; color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }
.echip { font: 12px var(--mono); padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.echip:hover { border-color: var(--accent); }
.echip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ehint { color: var(--faint); font-size: 11.5px; margin: 4px 0 14px 90px; }
.froot { font: 600 13px var(--mono); padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.ftree { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 8px 10px 12px; font: 12.5px/1.5 var(--mono); }
.ftree details > summary { cursor: pointer; padding: 1px 0; list-style: none; }
.ftree details > summary::before { content: '▸'; color: var(--faint); display: inline-block; width: 14px; }
.ftree details[open] > summary::before { content: '▾'; }
.ftree .fleaf { padding: 1px 0 1px 14px; }
.fkids { margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.fic { display: inline-block; width: 18px; text-align: center; color: var(--faint); }
.fic.k-fn { color: var(--fn); } .fic.k-effect { color: var(--effect); }
.fname { cursor: pointer; } .fname:hover { color: var(--accent); text-decoration: underline; }
.fargs { color: var(--muted); }
.eff { color: var(--effect); font-weight: 600; }
.arm { color: var(--type); }
.fnote { color: var(--faint); font-family: var(--sans); font-size: 11.5px; margin: 4px 0 2px 14px; }
.retarget { color: var(--faint); margin-left: 6px; cursor: pointer; text-decoration: none; }
.retarget:hover { color: var(--accent); }
.badge.handled { color: var(--ok); }
/* changes */
#changes { padding: 12px 22px 80px; max-width: 1040px; }
.ch-range { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.ch-range b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.ch-range select { max-width: 260px; }
.ch-range select, .ch-range input { font: inherit; font-size: 12px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
.ch-steps { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; margin-bottom: 10px; }
.ch-commit { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 5px; background: var(--panel); }
.ch-commit-h { font: 11px var(--mono); color: var(--faint); margin: 0 2px 3px; }
.ch-patches { display: flex; gap: 4px; flex-wrap: wrap; }
.patch { font: 11.5px var(--sans); border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.patch i { font-style: normal; color: var(--faint); margin-right: 4px; font-family: var(--mono); }
.patch:hover { border-color: var(--accent); }
.patch.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ch-sum { color: var(--muted); font-size: 12.5px; margin: 6px 0 4px; }
.ch-sum b { color: var(--text); }

.card pre.d { padding: 5px 14px 9px 2px; }
.ln { display: block; position: relative; padding-left: 16px; border-radius: 3px; }

.pill { font: 600 10.5px var(--sans); padding: 1px 7px; border-radius: 999px; margin-left: 10px; vertical-align: 1px; border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); color: var(--ok); white-space: nowrap; font-style: normal; text-decoration: none; display: inline-block; }

.refs-upd { font: 11.5px var(--sans); color: var(--muted); margin: 0 14px 8px 2px; }
.ren-line { font: 600 15px var(--mono); padding: 6px 2px 4px; }

.follow { font: 11.5px var(--sans); color: var(--muted); margin: 0 14px 10px 2px; }

.insp-name { font: 600 15px var(--mono); margin: 2px 0 6px; word-break: break-all; }

.box.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }

.empty { color: var(--faint); font-size: 12px; }
.log-e { padding: 7px 0; border-bottom: 1px dashed var(--line); }

#pal { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, #000 35%, transparent); display: none; justify-content: center; align-items: flex-start; padding-top: 12vh; }
#pal.on { display: flex; }
#pal .box-p { width: min(640px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; }
#pal input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; font: 15px var(--mono); padding: 12px 14px; outline: none; }
#pal .res { max-height: 50vh; overflow-y: auto; padding: 4px 0; }

#pal .hint { color: var(--faint); font-size: 11px; padding: 6px 14px; border-top: 1px solid var(--line); }
/* ---------- workspace: three modes ---------- */
body.m-both { grid-template-columns: 250px minmax(380px, 1fr) var(--panel-w, 44vw); }
body.m-both #right { overflow: hidden; }
body.m-agents { grid-template-columns: 250px minmax(0, 1fr) 0; }
body.m-agents #right { display: none; }
body.m-agents #composer > * { max-width: 760px; margin-left: auto; margin-right: auto; }
body.m-agents #composer textarea { display: block; }
.cpanel { display: grid; grid-template-columns: 190px minmax(0, 1fr); height: 100%; }
.cpanel.nosym { grid-template-columns: minmax(0, 1fr); }
.cp-sym { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding-bottom: 20px; }
.cpanel.nosym .cp-sym { display: none; }
.cp-sym .item { padding: 2px 10px; font-size: 12px; }
.cp-sym .mod-h { padding: 8px 10px 2px; }
.cp-code { overflow: auto; min-width: 0; }
.cp-code #code { padding: 0; max-width: none; }
.panel-b { padding: 12px 16px 50px; }
#split { position: fixed; top: 46px; bottom: 0; width: 6px; cursor: col-resize; z-index: 20; display: none; }
#split:hover, body.dragging #split { background: color-mix(in srgb, var(--accent) 35%, transparent); }
body.dragging { user-select: none; cursor: col-resize; }
body.m-prs { grid-template-columns: 300px minmax(420px, 1fr) 330px; }
body.m-both #right, body.m-prs #right { background: var(--bg); }
#modes button { font: 600 12.5px var(--display); padding: 4px 13px; letter-spacing: .01em; }
.code-only { display: contents; }
body:not(.m-code) .code-only { display: none; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 0 var(--accent); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
.card .gut .pulse { margin-top: 1px; }
.btn { font: 500 12px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover:not(:disabled) { color: var(--bg); filter: brightness(1.08); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.small { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
textarea, .field { font: 13px/1.45 var(--sans); background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; width: 100%; resize: vertical; outline: none; }
textarea:focus, .field:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
select.field { padding: 5px 8px; }
.side-h { display: flex; align-items: center; justify-content: space-between; margin: 12px 14px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); font-weight: 600; }
.side-h .btn { text-transform: none; letter-spacing: 0; }
/* sessions */
.sess { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 14px; cursor: pointer; border-left: 2px solid transparent; }
.sess:hover { background: var(--bg); }
.sess.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.sess .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .wh { grid-column: 2 / 4; color: var(--faint); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .st { font-size: 10.5px; color: var(--muted); }
.sess .st.working { color: var(--accent); } .sess .st.asking { color: var(--warn); } .sess .st.failed { color: var(--bad); }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }

#conv { flex: 1; overflow: auto; padding: 16px 22px 30px; min-height: 0; }

#composer textarea { min-height: 62px; max-height: 40vh; }
#composer .row { display: flex; align-items: center; gap: 10px; margin-top: 7px; color: var(--faint); font-size: 11.5px; }
#composer label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--muted); }
.msg-u { margin: 14px 0 10px auto; max-width: 82%; width: fit-content; background: color-mix(in srgb, var(--accent) 11%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line)); border-radius: 12px 12px 4px 12px; padding: 8px 12px; white-space: pre-wrap; }

.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font: 600 14.5px var(--display); margin: 14px 0 6px; } .md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; } .md li { margin: 2px 0; }

.md pre { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0 10px; }
.md pre code { border: 0; padding: 0; background: none; font-size: 12.5px; }

.md a { color: var(--accent); }
.md table { border-collapse: collapse; margin: 6px 0 10px; font-size: 12px; } .md td, .md th { border: 1px solid var(--line); padding: 3px 8px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.tool { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.tool > summary, .tool-h { display: flex; align-items: center; gap: 8px; padding: 6px 11px; cursor: pointer; list-style: none; font-size: 12px; color: var(--muted); }
.tool > summary::-webkit-details-marker { display: none; }
.tool-h .ttl, .tool > summary .ttl { font: 12px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tool .kd { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .6px; color: var(--faint); flex: none; }
.tool .stt { font-size: 10.5px; flex: none; }
.stt.completed { color: var(--ok); } .stt.failed { color: var(--bad); } .stt.in_progress, .stt.pending { color: var(--accent); }
.tool-b { border-top: 1px solid var(--line); }
.tool-b pre { max-height: 420px; overflow: auto; }
.tool-b .lbl2 { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .6px; color: var(--faint); padding: 7px 12px 0; }
.tool.strata { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.tool.strata .tool-h { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); cursor: default; }
.tool.strata .sub { font: 600 12px var(--mono); color: var(--accent); }
.tool .defs { display: flex; gap: 5px; flex-wrap: wrap; padding: 7px 12px 0; }
.tool .defs a { font: 11.5px var(--mono); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.tool .defs a:hover, .tool .defs a.on { background: var(--accent-soft); }
.out { font: 12px/1.5 var(--mono); }
.out .ok { color: var(--ok); } .out .bad { color: var(--bad); } .out .warn { color: var(--warn); } .out .dim { color: var(--faint); }
.perm { margin: 10px 0; border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 6%, var(--panel)); border-radius: 10px; padding: 9px 12px; }
.perm.done { border-color: var(--line); background: var(--panel); opacity: .8; }
.perm .q { font-weight: 600; margin-bottom: 7px; }
.perm .q code { font: 12px var(--mono); }
.perm .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.sysl { color: var(--faint); font-size: 11.5px; margin: 8px 0; display: flex; gap: 8px; align-items: center; }
.sysl::before, .sysl::after { content: ''; flex: 1; border-top: 1px dashed var(--line); }
.sysl.bad { color: var(--bad); }
.logs { margin: 6px 0; color: var(--faint); font-size: 11.5px; }
.logs summary { cursor: pointer; }
.logs pre { max-height: 220px; overflow: auto; font-size: 11px; color: var(--muted); border-radius: 6px; margin-top: 4px; }
.plan { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; background: var(--panel); font-size: 12.5px; }
.plan .pe { display: flex; gap: 8px; padding: 1px 0; } .plan .pe.completed { color: var(--faint); text-decoration: line-through; } .plan .pe.in_progress { color: var(--accent); }
.empty-big { color: var(--faint); text-align: center; padding: 18vh 20px 0; font-size: 13px; line-height: 1.7; }
.empty-big b { color: var(--text); font: 600 18px var(--display); display: block; margin-bottom: 6px; }
/* the agents' code panel */
.panel-h { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); position: sticky; top: 0; z-index: 2; }
.panel-h b { color: var(--text); font: 600 12.5px var(--mono); }
.panel-b { padding: 12px 16px 50px; }
/* the dialog */

#dlg h3 { margin: 0 0 12px; font: 600 16px var(--display); }

#dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#dlg .hint2 { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
/* the activity sidebar */
.act { font-size: 12px; padding-bottom: 14px; }
.act-b { margin: 0 8px 6px; }
.act-bh { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.act-bh:hover { background: var(--bg); }
.act-bh.sel, .act-c.sel > .act-ch, .act-u.sel { background: var(--accent-soft); }
.act-bh .bn { font: 600 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.act-bh .ar { color: var(--faint); width: 10px; flex: none; font-size: 10px; }
.act-bi { margin-left: 13px; border-left: 1px solid var(--line); padding-left: 6px; }
.act-ch, .act-u { display: flex; gap: 7px; align-items: baseline; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
.act-ch:hover, .act-u:hover, .act-d:hover { background: var(--bg); }
.act-ch .sha { font: 11px var(--mono); color: var(--faint); flex: none; }
.act-ch .sub2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.act-ch .wh2 { color: var(--faint); font-size: 10.5px; flex: none; }
.act-u { color: var(--warn); font-style: italic; }
.act-ds { padding: 0 0 3px 18px; }
.act-d { display: flex; gap: 6px; align-items: center; font: 11.5px var(--mono); padding: 1px 6px; border-radius: 5px; cursor: pointer; overflow: hidden; white-space: nowrap; }
.act-d .mk { width: 10px; font-size: 11px; }
.act-d .nm2 { overflow: hidden; text-overflow: ellipsis; }

/* ---------- softer: less contrast, fewer boxes, code that wraps ---------- */

  /* the same hues as before, a little quieter on the dark background */
  --kw: color-mix(in srgb, #da77f2 78%, #0d0e12); --kw-ctl: color-mix(in srgb, #74c0fc 78%, #0d0e12); --kw-spec: color-mix(in srgb, #f783ac 78%, #0d0e12);
  --str: color-mix(in srgb, #8ce99a 75%, #0d0e12); --num: color-mix(in srgb, #ffa8a8 75%, #0d0e12);
  --base: color-mix(in srgb, #66d9e8 78%, #0d0e12); --utype: color-mix(in srgb, #ffc078 78%, #0d0e12);
  --type: color-mix(in srgb, #b197fc 80%, #0d0e12); --effect: color-mix(in srgb, #f783ac 80%, #0d0e12); --fn: color-mix(in srgb, #74c0fc 80%, #0d0e12); --test: color-mix(in srgb, #a9e34b 75%, #0d0e12);
}

.btn.primary:hover:not(:disabled) { color: var(--accent); filter: none; background: color-mix(in srgb, var(--accent) 16%, transparent); }
ins { background: color-mix(in srgb, var(--ok) 17%, transparent); } del { background: color-mix(in srgb, var(--bad) 15%, transparent); }

<script>
const lv = x => isNaN(+x) ? x : +x;
const S = { members: localStorage.getItem('strata-members') || 'inline', data: null, raw: '', level: 1, sel: null, scope: 'slice', q: '', over: {}, prevHash: {}, flash: new Set(), showTests: false, open: {}, allOpen: false };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function status(d) {

  if (d.holes.length) return ['warn', d.holes.length + ' hole' + (d.holes.length > 1 ? 's' : '')];
  if (v && v.status === 'incomplete') return ['warn', 'incomplete'];
  const loops = v?.terminates?.status === 'unknown' ? ' · may not terminate' : '';
  if (v && v.status === 'proven') return [loops ? 'warn' : 'ok', 'proven' + loops];
  if (v && v.status === 'fuzzed') return [loops ? 'warn' : 'ok', 'fuzzed ' + v.cases + loops];
  if (v && v.status === 'assumed') return ['none', 'assumed'];
  if (d.kind === 'fn') return ['none', 'unverified'];
  if (d.kind === 'extern') return ['none', 'foreign: assumed'];
  return ['', ''];
}

// ---------- syntax highlighting with clickable references ----------
// Keywords in three groups: what declares things, what steers control flow
// (including matching), and what states rules the checker and fuzzer hold
// the code to. `true`/`false` are literals.
const KW_GROUPS = {
  'kw': 'type distinct fn test let mut trait impl derive derivable derived comptime extern capability pub use module',

  'spec': 'where requires ensures assert law mock it',
  'lit': 'true false',

const KW = new Map(Object.entries(KW_GROUPS).flatMap(([c, ws]) => ws.split(' ').map(w => [w, 't-' + c])));

const BASE = new Set('Int Float Bool String Unit List Set Dict Self Option Some None Result Ok Err Natural Positive Negative NonZero Probability Percentage NonEmpty NonEmptyString'.split(' '));

// Resolve a name as the definition's module sees it: its own module first,

let refIdx = null, refIdxData = null;
function resolver(mod) {
  if (!S.data) return () => null;
  if (refIdxData !== S.data) {
    refIdx = new Map(); refIdxData = S.data;
    for (const d of S.data.decls) {
      if (d.kind === 'impl' || d.kind === 'use' || d.kind === 'test') continue;
      const short = d.module ? d.name.slice(d.module.length + 1) : d.name;
      if (!refIdx.has(short)) refIdx.set(short, []);
      refIdx.get(short).push(d);
    }
  }
  // modules this one imports with `use`
  const imports = new Set(S.data.decls.filter(d => d.kind === 'use' && d.module === mod).map(d => d.label.replace(/^use /, '')));
  return id => {
    const ds = refIdx.get(id);
    if (!ds) return null;
    const d = ds.find(d => d.module === mod) || ds.find(d => d.public && imports.has(d.module));
    return d ? d.name : null;

}

// the names of capabilities and capability traits, coloured apart wherever they appear
let capNames = null, capData = null;
function capabilityNames() {
  if (capData !== S.data) {
    capData = S.data;

  }

function highlight(src, resolve) {
  const re = /(\/\/\/[^\n]*)|(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\?[A-Za-z_]\w*)|(\b\d+\b)|([A-Za-z_]\w*)/g;

  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const [t, doc, com, str, hole, num, id] = m;
    if (doc) out += `<span class="t-doc">${esc(t)}</span>`;
    else if (com) out += `<span class="t-com">${esc(t)}</span>`;
    else if (str) out += `<span class="t-str">${esc(t)}</span>`;
    else if (hole) out += `<span class="t-hole">${esc(t)}</span>`;
    else if (num) out += `<span class="t-num">${t}</span>`;
    else if (KW.has(id)) {
      // `impl Trait for Type`, `derive Trait for Type`: here `for` declares, it does not loop
      const decl = id === 'for' && /\b(impl|derive)\b[^\n{]*$/.test(src.slice(0, m.index));
      out += `<span class="${decl ? 't-kw' : KW.get(id)}">${id}</span>`;
    }
    else {
      const cls = /^[A-Z]/.test(id) ? (BASE.has(id) ? 't-ty' : 't-uty') : '';

      // may be a parameter or local that shadows one (`policy`)
      const called = /^\s*[([]/.test(src.slice(re.lastIndex, re.lastIndex + 3));
      const target = cls || called ? resolve(id) : null;
      const shown = target && capabilityNames().has(target) ? 't-cap' : cls;
      out += target ? `<a class="ref ${shown}" data-go="${esc(target)}">${id}</a>` : (cls ? `<span class="${cls}">${id}</span>` : id);

}

// ---------- selection & scope ----------
// Everything a definition is related to: what it depends on, what refers to it,

const related = d => d ? [...d.deps, ...d.refs, ...d.impls, ...(d.impl_of ? [d.impl_of.trait, d.impl_of.type].filter(Boolean) : [])] : [];

  const all = S.data.decls;

  let set = all;

    const d = byName()[S.sel];
    const keep = new Set([S.sel, ...related(d)]);
    set = all.filter(x => keep.has(x.name));
  }
  if (q) set = set.filter(x => x.label.toLowerCase().includes(q) || x.text['2'].toLowerCase().includes(q));
  return set.filter(shownAlone);
}

// Navigation history: every definition you go to, so ← → step back and forth.
const NAV = { stack: [], pos: -1 };
function navPush(name) {
  if (NAV.stack[NAV.pos] === name) return;
  NAV.stack = NAV.stack.slice(0, NAV.pos + 1);
  NAV.stack.push(name);
  NAV.pos = NAV.stack.length - 1;
}
function navGo(d) {
  const p = NAV.pos + d;

  NAV.pos = p;
  const name = NAV.stack[p];

  if (!name) S.scope = 'all';
  select(name, true, false);
  $('#main').scrollTop = 0;
}
function navButtons() {
  const lbl = n => n ? (byName()[n]?.label || n) : 'everything';
  const back = NAV.stack[NAV.pos - 1], fwd = NAV.stack[NAV.pos + 1];
  return `<div class="seg navb"><button data-nav="-1" ${NAV.pos > 0 ? '' : 'disabled'} title="${NAV.pos > 0 ? 'back to ' + esc(lbl(back)) + ' (←)' : 'back (←)'}">${icon('left')}</button><button data-nav="1" ${NAV.pos < NAV.stack.length - 1 ? '' : 'disabled'} title="${NAV.pos < NAV.stack.length - 1 ? 'forward to ' + esc(lbl(fwd)) + ' (→)' : 'forward (→)'}">${icon('right')}</button></div>`;
}

function select(name, scroll = true, record = true) {

  if (record) navPush(name);
  render();

    // its slice starts with it: back to the top, so the view is read from
    // there whatever was scrolled to before; in everything, to its card
    if (S.mode === 'both') { const c = $('#right .cp-code'); if (c) c.scrollTop = 0; }
    else if (S.scope !== 'all' && typeof S.level === 'number') $('#main').scrollTop = 0;
    else document.getElementById('card-' + CSS.escape(name))?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ---------- rendering ----------
function renderHeader() {

function renderLeft() { setHtml($('#left'), symbolsHtml()); }
// every definition, by module and kind: the Code mode's left column, and the agents' code panel
function symbolsHtml() {

  const vis = new Set(visible().map(d => d.name));

  const section = (decls) => groups.map(([k, title]) => {

// ---------- type map: types and traits as a general graph ----------
const TM = { pos: null, view: null, drag: null, moved: false };
// what a type contains or refines, and what a trait's methods mention, are always
// shown; which types implement which traits is an extra layer
const tmOpt = { aliases: false, impls: false };

function typeGraph() {
  const st = S.data.structure.filter(t => tmOpt.aliases || t.kind !== 'alias');
  const names = new Set(st.map(t => t.name));
  const edges = new Map();
  const add = (from, to, kind, label) => {
    if (from === to || !names.has(to)) return;
    const key = from + '>' + to + ':' + kind;
    const e = edges.get(key) || { from, to, kind, labels: [] };
    if (label && !e.labels.includes(label)) e.labels.push(label);
    edges.set(key, e);
  };
  for (const t of st) {
    for (const f of t.fields || []) f.refs.forEach(r => add(t.name, r, 'has', f.name));
    for (const v of t.variants || []) for (const f of v.fields) f.refs.forEach(r => add(t.name, r, 'has', v.name));
    if (t.base) t.base.refs.forEach(r => add(t.name, r, t.refinement ? 'refines' : 'alias', ''));
    if (tmOpt.impls) for (const tr of t.impls || []) add(t.name, tr, 'implements', '');
    for (const sp of t.supers || []) add(t.name, sp, 'extends', '');
    if (t.kind === 'trait') for (const r of t.refs) add(t.name, r, 'op', '');
  }
  return { nodes: st, edges: [...edges.values()] };
}

const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
function cardLines(t) {
  const L = [];
  if (t.kind === 'alias') {
    L.push(['= ' + t.base.ty, '']);
    if (t.refinement) L.push(['where ' + t.refinement, 'muted']);
  }
  for (const f of t.fields || []) L.push([`${f.name}: ${f.ty}`, '']);
  for (const v of t.variants || []) {
    const fs = v.fields.length ? (v.fields[0].name ? ' { ' + v.fields.map(f => f.name).join(', ') + ' }' : '(' + v.fields.map(f => f.ty).join(', ') + ')') : '';

  }
  if (t.kind === 'trait') {
    for (const m of t.methods) L.push(['fn ' + m.sig + (m.default ? '  (default)' : ''), '']);
    for (const l of t.laws) L.push(['law ' + l.name + ': ' + l.text, 'muted']);
    if (tmOpt.impls && t.implementors.length) L.push(['implemented by ' + t.implementors.join(', '), 'meth']);
  }
  if (t.kind !== 'alias' && t.refinement) L.push(['where ' + t.refinement, 'muted']);
  // inside a module's own region its prefix is noise; other modules keep theirs
  const own = modOf(t.name);
  const strip = x => own ? x.split(own + '.').join('') : x;
  return L.map(([s, c]) => [trunc(strip(s), 46), c]);
}
const LH = 16, HEAD = 24, CW = 7.1;
const title = t => t.name.slice(t.name.lastIndexOf('.') + 1) + (t.params.length ? '[' + t.params.join(', ') + ']' : '');
function cardSize(t) {
  const L = cardLines(t);
  return { w: Math.max(120, Math.min(340, 26 + CW * Math.max(title(t).length + 8, ...L.map(l => l[0].length)))), h: HEAD + 10 + L.length * LH };
}

function layoutTypes(g) {
  const key = 'strata-tpos:' + S.data.label;
  if (!TM.pos) { try { TM.pos = JSON.parse(localStorage.getItem(key)) || {}; } catch { TM.pos = {}; } }
  const P = TM.pos, size = {};
  g.nodes.forEach(n => size[n.name] = cardSize(n));
  const fresh = g.nodes.filter(n => !P[n.name]);
  if (!fresh.length) return size;
  if (fresh.length === g.nodes.length) layoutByModule(g, size, P);
  else placeNew(g, size, P, fresh);
  localStorage.setItem(key, JSON.stringify(P));
  return size;
}

// Stress layout per connected component: graph distance ≈ drawing distance,
// so the most connected types end up in the middle of their group.
function fullLayout(g, size, P) {
  const names = g.nodes.map(n => n.name), idx = new Map(names.map((n, i) => [n, i]));
  const adj = names.map(() => new Set());
  for (const e of g.edges) { const a = idx.get(e.from), b = idx.get(e.to); adj[a].add(b); adj[b].add(a); }
  const bfs = s => { const d = new Map([[s, 0]]), q = [s]; while (q.length) { const u = q.shift(); for (const v of adj[u]) if (!d.has(v)) { d.set(v, d.get(u) + 1); q.push(v); } } return d; };
  const seen = new Set(), comps = [];
  for (let i = 0; i < names.length; i++) if (!seen.has(i)) { const c = [...bfs(i).keys()]; c.forEach(x => seen.add(x)); comps.push(c); }
  comps.sort((a, b) => b.length - a.length);
  const diam = i => Math.hypot(size[names[i]].w, size[names[i]].h);
  const blocks = [];  // { nodes, x, y relative, w, h }
  const singles = [];
  for (const c of comps) {
    if (c.length === 1) { singles.push(c[0]); continue; }
    const D = new Map(c.map(i => [i, bfs(i)]));
    const L = c.reduce((a, i) => a + diam(i), 0) / c.length * 0.75 + 50;
    const hub = c.reduce((a, b) => adj[b].size > adj[a].size ? b : a);
    const X = new Map(), rings = [];
    for (const [v, d] of D.get(hub)) (rings[d] ||= []).push(v);
    rings.forEach((ring, r) => {
      if (r === 0) { X.set(ring[0], { x: 0, y: 0 }); return; }
      // order each ring by the angle of its already placed neighbours
      const ang = v => { const ps = [...adj[v]].filter(u => X.has(u)).map(u => Math.atan2(X.get(u).y, X.get(u).x)); return ps.length ? ps.reduce((a, b) => a + b) / ps.length : 0; };
      ring.sort((a, b) => ang(a) - ang(b));
      ring.forEach((v, k) => { const a = (k / ring.length) * 2 * Math.PI + r * 0.4; X.set(v, { x: r * L * Math.cos(a), y: r * L * Math.sin(a) }); });
    });
    for (let it = 0; it < 250; it++) {
      for (const i of c) {
        let nx = 0, ny = 0, den = 0; const pi = X.get(i);
        for (const j of c) {
          if (i === j) continue;
          const d = D.get(i).get(j), w = 1 / (d * d), pj = X.get(j);
          const dx = pi.x - pj.x, dy = pi.y - pj.y, dist = Math.hypot(dx, dy) || 0.01, t = L * d;
          nx += w * (pj.x + t * dx / dist); ny += w * (pj.y + t * dy / dist); den += w;
        }
        X.set(i, { x: nx / den, y: ny / den });
      }
    }
    for (const i of c) P[names[i]] = X.get(i);
    removeOverlaps(c.map(i => names[i]), size, P, new Set(c.map(i => names[i])));
    const bb = bbox(c.map(i => names[i]), size, P);
    blocks.push({ nodes: c.map(i => names[i]), bb });
  }
  // largest group in the middle, the others on shelves below, lone types last
  let y = 0, maxW = Math.max(1200, ...blocks.map(b => b.bb.w));
  let x = 0, rowH = 0;
  blocks.forEach((b, k) => {
    if (k > 0 && x + b.bb.w > maxW) { y += rowH + 70; x = 0; rowH = 0; }
    if (k === 1 && x === 0) { y = blocks[0].bb.h + 90; }
    const ox = (k === 0 ? (maxW - b.bb.w) / 2 : x) - b.bb.x, oy = y - b.bb.y;
    for (const n of b.nodes) { P[n].x += ox; P[n].y += oy; }
    if (k === 0) { y = 0; x = maxW; } else { x += b.bb.w + 70; }
    rowH = Math.max(rowH, b.bb.h);
  });
  let sy = (blocks.length ? Math.max(...blocks.flatMap(b => b.nodes.map(n => P[n].y + size[n].h / 2))) : 0) + 90, sx = 0, srow = 0;
  for (const i of singles) {
    const n = names[i], s = size[n];
    if (sx + s.w > maxW) { sy += srow + 30; sx = 0; srow = 0; }
    P[n] = { x: sx + s.w / 2, y: sy + s.h / 2 };
    sx += s.w + 30; srow = Math.max(srow, s.h);
  }
}

const modOf = n => n.includes('.') ? n.slice(0, n.lastIndexOf('.')) : '';

// One region per module: each module is laid out on its own, then modules
// are packed with the most depended-on first (core contracts before users).
function layoutByModule(g, size, P) {
  const mods = [...new Set(g.nodes.map(n => modOf(n.name)))];
  if (mods.length < 2) return fullLayout(g, size, P);
  const incoming = m => g.edges.filter(e => modOf(e.to) === m && modOf(e.from) !== m).length;
  mods.sort((a, b) => incoming(b) - incoming(a) || a.localeCompare(b));
  let x = 0, y = 0, rowH = 0;
  const maxW = 2200, PAD = 40, HEAD = 30;
  for (const m of mods) {
    const nodes = g.nodes.filter(n => modOf(n.name) === m), names = new Set(nodes.map(n => n.name));
    const sub = { nodes, edges: g.edges.filter(e => names.has(e.from) && names.has(e.to)) };
    fullLayout(sub, size, P);
    const bb = bbox([...names], size, P);
    const w = bb.w + 2 * PAD, h = bb.h + 2 * PAD + HEAD;
    if (x > 0 && x + w > maxW) { x = 0; y += rowH + 60; rowH = 0; }
    for (const n of names) { P[n].x += x + PAD - bb.x; P[n].y += y + PAD + HEAD - bb.y; }
    x += w + 60; rowH = Math.max(rowH, h);
  }
}

function bbox(ns, size, P) {
  const x0 = Math.min(...ns.map(n => P[n].x - size[n].w / 2)), x1 = Math.max(...ns.map(n => P[n].x + size[n].w / 2));
  const y0 = Math.min(...ns.map(n => P[n].y - size[n].h / 2)), y1 = Math.max(...ns.map(n => P[n].y + size[n].h / 2));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function removeOverlaps(all, size, P, movable) {
  for (let pass = 0; pass < 120; pass++) {
    let moved = false;
    for (let a = 0; a < all.length; a++) for (let b = a + 1; b < all.length; b++) {
      const A = all[a], B = all[b], pa = P[A], pb = P[B], ma = movable.has(A), mb = movable.has(B);
      if (!ma && !mb) continue;
      const ox = (size[A].w + size[B].w) / 2 + 24 - Math.abs(pb.x - pa.x), oy = (size[A].h + size[B].h) / 2 + 24 - Math.abs(pb.y - pa.y);
      if (ox > 0 && oy > 0) {
        moved = true;
        const wa = ma && mb ? .5 : ma ? 1 : 0, wb = 1 - wa;
        if (ox < oy) { const s = Math.sign(pb.x - pa.x) || 1; pa.x -= s * ox * wa; pb.x += s * ox * wb; }
        else { const s = Math.sign(pb.y - pa.y) || 1; pa.y -= s * oy * wa; pb.y += s * oy * wb; }
      }
    }
    if (!moved) break;
  }
}

// New definitions appear next to what they relate to; nothing else moves.
function placeNew(g, size, P, fresh) {
  fresh.forEach((n, i) => {
    const nb = g.edges.filter(e => e.from === n.name || e.to === n.name).map(e => e.from === n.name ? e.to : e.from).filter(x => P[x]);
    if (nb.length) {
      const c = nb.reduce((a, x) => ({ x: a.x + P[x].x / nb.length, y: a.y + P[x].y / nb.length }), { x: 0, y: 0 });
      P[n.name] = { x: c.x + 60 * Math.cos(i * 2.4), y: c.y + 60 * Math.sin(i * 2.4) };
    } else {
      const ys = Object.keys(P).filter(k => size[k]).map(k => P[k].y + size[k].h / 2);
      P[n.name] = { x: i * 220, y: (ys.length ? Math.max(...ys) : 0) + 120 };
    }
  });
  removeOverlaps(g.nodes.map(n => n.name), size, P, new Set(fresh.map(n => n.name)));
}

function clip(c, s, tx, ty) {
  const dx = tx - c.x, dy = ty - c.y;
  const k = Math.min((s.w / 2 + 3) / Math.abs(dx || 1e-9), (s.h / 2 + 3) / Math.abs(dy || 1e-9));
  return { x: c.x + dx * k, y: c.y + dy * k };
}

// a card's line of code, highlighted as in the code view (SVG text takes tspans, not spans)
const svgCode = l => highlight(l, () => null).replace(/<span /g, '<tspan ').replace(/<\/span>/g, '</tspan>');
function renderTypes() {
  const g = typeGraph(), size = layoutTypes(g), P = TM.pos;
  const main = $('#main'), W = main.clientWidth || 900, H = main.clientHeight || 700;
  if (!TM.view && g.nodes.length) {
    const xs = g.nodes.flatMap(n => [P[n.name].x - size[n.name].w / 2, P[n.name].x + size[n.name].w / 2]);
    const ys = g.nodes.flatMap(n => [P[n.name].y - size[n.name].h / 2, P[n.name].y + size[n.name].h / 2]);
    const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
    const top = 90, k = Math.min(1, (W - 60) / bw, (H - top - 30) / bh);
    TM.view = { k, x: W / 2 - k * (Math.min(...xs) + bw / 2), y: top + (H - top - 30) / 2 - k * (Math.min(...ys) + bh / 2) };
  }
  const sel = S.sel && P[S.sel] && g.nodes.some(n => n.name === S.sel) ? S.sel : null;
  const near = sel ? new Set([sel, ...g.edges.filter(e => e.from === sel || e.to === sel).flatMap(e => [e.from, e.to])]) : null;
  let edges = '', labels = '';
  for (const e of g.edges) {
    const a = P[e.from], b = P[e.to];
    const p1 = clip(a, size[e.from], b.x, b.y), p2 = clip(b, size[e.to], a.x, a.y);
    const hot = sel && (e.from === sel || e.to === sel), fade = sel && !hot;
    edges += `<line class="tedge ${e.kind} ${hot ? 'hot' : ''} ${fade ? 'fade' : ''}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" marker-end="url(#ar-${e.kind})"/>`;
    if (e.labels.length && hot) labels += `<text class="tlabel" x="${(p1.x + p2.x) / 2}" y="${(p1.y + p2.y) / 2 - 3}">${esc(trunc(e.labels.join(', '), 28))}</text>`;
  }
  let nodes = '';
  for (const t of g.nodes) {
    const p = P[t.name], s = size[t.name], d = byName()[t.name], [cls] = d ? status(d) : [''];
    const lines = cardLines(t).map(([l, c], i) => `<text class="tl ${c}" x="10" y="${HEAD + 14 + i * LH}">${c === 'meth' ? esc(l) : svgCode(l)}</text>`).join('');
    nodes += `<g class="tnode k-${t.kind} ${t.name === sel ? 'sel' : ''} ${near && !near.has(t.name) ? 'fade' : ''}" data-node="${esc(t.name)}" transform="translate(${p.x - s.w / 2},${p.y - s.h / 2})">
      <rect class="body" width="${s.w}" height="${s.h}"/><rect class="head" width="${s.w}" height="${HEAD}"/>
      <text class="tn" x="10" y="16">${esc(title(t))}</text><text class="tk" x="${s.w - 8}" y="16" text-anchor="end">${t.kind === 'sum' ? 'variants' : t.kind}${cls === 'bad' ? ' ⚠' : ''}</text>
      ${lines}</g>`;
  }
  const v = TM.view || { x: 0, y: 0, k: 1 };
  const mk = (id, col) => `<marker id="ar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
  const cs = getComputedStyle(document.documentElement), cv = n => cs.getPropertyValue(n).trim();
  // module regions, drawn behind everything
  let regions = '';
  const mods = [...new Set(g.nodes.map(n => modOf(n.name)))];
  if (mods.length > 1) for (const m of mods) {
    const ns = g.nodes.filter(n => modOf(n.name) === m).map(n => n.name);
    const bb = bbox(ns, size, P);
    regions += `<rect class="region" x="${bb.x - 24}" y="${bb.y - 44}" width="${bb.w + 48}" height="${bb.h + 68}" rx="16"/>
      <text class="region-l" x="${bb.x - 12}" y="${bb.y - 22}">${esc(m || '(root)')}</text>`;
  }
  main._html = null; // drawn here, not through setHtml
  main.innerHTML = `<svg id="tmap" width="100%" height="100%">
      <defs>${mk('has', cv('--muted'))}${mk('refines', cv('--type'))}${mk('alias', cv('--type'))}${mk('op', cv('--effect'))}${mk('implements', cv('--accent'))}${mk('extends', cv('--accent'))}</defs>
      <g id="tview" transform="translate(${v.x},${v.y}) scale(${v.k})">${regions}${edges}${nodes}${labels}</g></svg>
    <div class="maptools">
      <label title="Show which types implement which traits"><input type="checkbox" data-opt="impls" ${tmOpt.impls ? 'checked' : ''}> implementations</label>
      <label title="Types that narrow another with a where clause, such as type TaskId = Int where it > 0"><input type="checkbox" data-opt="aliases" ${tmOpt.aliases ? 'checked' : ''}> refinement types</label>
      <button id="relayout">re-layout</button><button id="fit">fit</button>
      <span class="sep"></span>
      <span><i class="lg has"></i>contains</span><span><i class="lg refines"></i>refines</span><span><i class="lg op"></i>in a trait method</span>${tmOpt.impls ? '<span><i class="lg impl"></i>implements</span>' : ''}
      <span class="muted">click a card to see its relations · drag cards · scroll to zoom · double-click to open</span>
    </div>`;
}

function tmEvents() {
  const main = $('#main');
  main.addEventListener('mousedown', e => {
    if (S.level !== 'types' || !e.target.closest('#tmap')) return;
    const node = e.target.closest('[data-node]');
    TM.drag = { node: node?.dataset.node, sx: e.clientX, sy: e.clientY, v: { ...TM.view }, p: node ? { ...TM.pos[node.dataset.node] } : null };
    TM.moved = false;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    const d = TM.drag; if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) TM.moved = true;
    if (d.node) { TM.pos[d.node] = { x: d.p.x + dx / TM.view.k, y: d.p.y + dy / TM.view.k }; }
    else { TM.view = { ...d.v, x: d.v.x + dx, y: d.v.y + dy }; }
    renderTypes();
  });
  window.addEventListener('mouseup', () => {
    const d = TM.drag; TM.drag = null; if (!d) return;
    if (d.node) localStorage.setItem('strata-tpos:' + S.data.label, JSON.stringify(TM.pos));
    if (!TM.moved) { S.sel = d.node || null; render(); }
  });
  main.addEventListener('wheel', e => {
    if (S.level !== 'types' || !e.target.closest('#tmap')) return;
    e.preventDefault();
    const r = $('#tmap').getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const v = TM.view, k = Math.min(2.5, Math.max(0.2, v.k * Math.exp(-e.deltaY * 0.0015)));
    TM.view = { k, x: mx - (mx - v.x) * k / v.k, y: my - (my - v.y) * k / v.k };
    renderTypes();
  }, { passive: false });
  main.addEventListener('dblclick', e => {
    const n = e.target.closest('[data-node]');
    if (n && S.level === 'types') { S.level = 1; S.scope = 'slice'; select(n.dataset.node); }
  });
  main.addEventListener('change', e => {
    if (e.target.dataset.opt) { tmOpt[e.target.dataset.opt] = e.target.checked; TM.view = TM.view; renderTypes(); }
  });
  main.addEventListener('click', e => {
    if (e.target.id === 'relayout') { TM.pos = {}; TM.view = null; localStorage.removeItem('strata-tpos:' + S.data.label); renderTypes(); }
    if (e.target.id === 'fit') { TM.view = null; renderTypes(); }
  });
}

// The code view: the selection and what surrounds it, organised by relationship.
function sectionsFor(sel) {
  const by = byName(), d = by[sel];
  if (!d) return [];
  const isTest = n => by[n]?.kind === 'test';
  // (a type shown inside its union, in the inline view, is in that union's card)
  const known = ns => ns.filter(n => by[n] && shownAlone(by[n]));
  return [
    ['', [sel]],
    ['Trait', known(d.impl_of ? [d.impl_of.trait] : [])],
    ['For', known(d.impl_of ? [d.impl_of.type] : [])],
    [d.kind === 'trait' ? 'Implementations' : 'Implements', d.impls],
    ['Dependencies', known(d.deps)],
    ['References', d.refs.filter(n => !isTest(n))],
    ['Tests', d.refs.filter(isTest)],
  ].filter(([, ns]) => ns.length);
}

// A definition shows its interface; where the full text differs (a body), an
// inline control shows or hides it. The selected definition starts open.
const isOpen = d => d.has_body && (S.open[d.name] ?? (S.allOpen || d.name === S.sel));
// a union's members inline (by default) or each on its own: the card's code in that view
const textOf = (d, lvl) => (S.members === 'inline' ? d.view_inline : d.view_separate) || d.text[lvl];
// in the inline view, a type shown inside its union has no card of its own
const shownAlone = d => S.members !== 'inline' || !d.folded_into;
function card(d) {
  const names = resolver(d.module);
  const [cls, txt] = status(d);
  const n = esc(d.name), open = isOpen(d);
  const meta = `<span class="meta">${d.module ? `<span>${esc(d.module)}</span>` : ''}${txt ? `<span class="${cls === 'none' ? '' : cls}">${esc(txt)}</span>` : ''}${open ? `<a class="tog" data-toggle="${n}" title="Show the interface only">hide body ▾</a>` : ''}</span>`;
  let code;
  if (open) code = highlight(textOf(d, '2'), names);
  else if (!d.has_body) code = highlight(textOf(d, '1'), names);
  else {
    const iface = textOf(d, '1').replace(/\s*\{ … \}$/, '');
    const fnLike = d.kind === 'fn' || d.kind === 'test';
    code = highlight(iface, names) + (fnLike
      ? ` <a class="tog" data-toggle="${n}"><span class="br">{ … }</span> show body ▸</a>`
      : `  <a class="tog" data-toggle="${n}">show bodies ▸</a>`);
  }
  return `<div class="card ${d.name === S.sel ? 'sel' : ''} ${S.flash.has(d.name) ? 'flash' : ''}" id="card-${n}">
    <div class="gut" data-pick="${n}" title="${esc(d.kind)}${txt ? ' · ' + esc(txt) : ''}"><span class="kind k-${d.kind}">${KIND[d.kind] || ''}</span><span class="dot ${cls}"></span>${liveDot(d.name)}</div>
    <pre>${meta}${code}</pre></div>`;
}

function renderCode() { setHtml($('#main'), codeHtml()); }
// the code: the selection's slice, or everything (`narrow`: the agents' panel)
function codeHtml(narrow) {
  const by = byName();
  let body;
  if (S.sel && by[S.sel] && S.scope !== 'all') {
    body = sectionsFor(S.sel).map(([title, ns]) =>
      (title ? `<h2 class="sect">${title} <span class="muted">${ns.length}</span></h2>` : '') + `<div class="cgroup">${ns.map(n => card(by[n])).join('')}</div>`).join('');
  } else {
    const vs = visible();
    body = vs.length ? `<div class="cgroup">${vs.map(d => card(d)).join('')}</div>` : '<div class="empty">Nothing matches.</div>';
  }
  const all = `<button class="plain" data-all="${S.allOpen ? 0 : 1}" title="Keys: 1 collapse all, 2 expand all">${S.allOpen ? 'collapse all' : 'expand all'}</button>`;
  const scope = S.sel ? `<div class="seg"><button data-s="slice" class="${S.scope !== 'all' ? 'on' : ''}">Around ${esc(by[S.sel]?.label || '')}</button><button data-s="all" class="${S.scope === 'all' ? 'on' : ''}">Everything</button></div>` : '<span>Select a definition to see it with its dependencies and references.</span>';
  return `<div id="code"><div class="toolbar">${scope}${all}${narrow ? '' : '<span>hover a name to see where it is · click to go there</span>'}</div>${body}</div>`;
}

// ---------- inspector: description, neighbours, status, history ----------
// doc lines were wrapped for the source; reflow them (a blank line keeps a paragraph break)
const docHtml = t => esc(t).replace(/([^\n])\n(?=[^\n])/g, '$1 ').replace(/`([^`]+)`/g, '<code>$1</code>');
function miniGraph(d) {
  const by = byName(), MAX = 8, RH = 22, W = 300;
  const deps = d.deps.filter(n => by[n]), left = deps.slice(0, MAX), right = d.refs.slice(0, MAX);
  const rows = Math.max(left.length, right.length, 1);
  const H = rows * RH + 16, cy = H / 2;
  const lbl = n => trunc(by[n]?.label || n, 15);
  const node = (n, x, y, anchor) => `<g class="mg-n" data-go="${esc(n)}"><text x="${x}" y="${y + 4}" text-anchor="${anchor}" class="k-${by[n]?.kind}">${esc(lbl(n))}</text></g>`;
  let out = '';
  left.forEach((n, i) => { const y = 8 + RH / 2 + i * RH + (rows - left.length) * RH / 2; out += `<path class="mg-e" d="M104,${y} C130,${y} 125,${cy} 150,${cy}"/>` + node(n, 100, y, 'end'); });
  right.forEach((n, i) => { const y = 8 + RH / 2 + i * RH + (rows - right.length) * RH / 2; out += `<path class="mg-e" d="M150,${cy} C175,${cy} 170,${y} 196,${y}"/>` + node(n, 200, y, 'start'); });
  out += `<circle cx="150" cy="${cy}" r="5" class="mg-c"/>`;
  const more = (deps.length > MAX ? `+${deps.length - MAX} dependencies ` : '') + (d.refs.length > MAX ? `+${d.refs.length - MAX} references` : '');
  return `<div class="mg-h"><span>dependencies</span><span>references</span></div><svg class="mg" width="${W}" height="${H}">${out}</svg>${more ? `<div class="empty">${more}</div>` : ''}`;
}

// a type lists the traits it implements, a trait the types implementing it,
// and an impl block its trait and type; each links to the impl block
function implSec(d) {
  const by = byName(), go = (n, t) => `<a class="ref" data-go="${esc(n)}">${esc(t)}</a>`;
  const short = n => by[n]?.label || n;
  let title, items;
  if (d.impl_of && !d.impl_of.trait) { title = 'Methods of'; items = [go(d.impl_of.type, short(d.impl_of.type))]; }
  else if (d.impl_of) { title = 'Implements'; items = [go(d.impl_of.trait, short(d.impl_of.trait)) + ' for ' + go(d.impl_of.type, short(d.impl_of.type))]; }
  else if (!d.impls.length) return '';
  else {
    title = d.kind === 'trait' ? 'Implemented by' : 'Implements';
    // a type's own methods (`impl Item`) have no trait
    const other = i => { const o = by[i]?.impl_of; return o ? (d.kind === 'trait' ? short(o.type) : o.trait ? short(o.trait) : 'its own methods') : i; };
    items = d.impls.map(i => go(i, other(i)));
  }
  return `<div class="sec"><h3>${title}</h3><div class="impls">${items.join(', ')}</div></div>`;
}

function terminationBox(t) {
  if (!t) return '';
  if (t.status === 'proven') return `<div class="box ok">✓ Terminates: ${esc(t.how)}.</div>`;
  if (t.status === 'assumed') return `<div class="box warn">○ Terminates if ${t.by.map(b => `<code>${esc(b)}</code>`).join(', ')} does: marked <code>terminates</code>, not proven.</div>`;
  return `<div class="box warn">⚠ May not terminate: ${esc(t.reason)}.</div>`;
}

function verdictBox(v) {
  if (!v) return '';
  return verdictOnly(v) + terminationBox(v.terminates);
}

function verdictOnly(v) {
  if (v.status === 'proven') return `<div class="box ok">✓ Proven by the SMT solver${v.checks.length ? `: <b>${v.checks.length}</b> check${v.checks.length > 1 ? 's' : ''}` : ' (nothing to check)'}.
      ${v.checks.map(c => `<div class="row mono">${esc(c)}</div>`).join('')}</div>`;
  if (v.status === 'fuzzed') return `<div class="box ok">~ Every contract held on <b>${v.cases}</b> generated inputs${v.discarded ? ` (${v.discarded} discarded by requires)` : ''}${v.proven + (v.unproven?.length || 0) ? `; <b>${v.proven}</b> of ${v.proven + v.unproven.length} checks proven` : ''}.
      ${(v.unproven || []).map(u => `<div class="row mono">not proven: ${esc(u)}</div>`).join('')}</div>`;
  if (v.status === 'counterexample') return `<div class="box bad"><b>✗ ${esc(v.kind)} violation</b>${v.found_by ? ` (found by the ${esc(v.found_by)})` : ''}
      <div class="row"><b>input</b> <code>${esc(JSON.stringify(v.args))}</code></div>
      <div class="row mono">${esc(v.message)}</div></div>`;
  if (v.status === 'incomplete') return `<div class="box warn">○ ${esc(v.message)}</div>`;
  if (v.status === 'assumed') return `<div class="box">≈ Assumed, not checked: ${esc(v.why)}. Its contract is trusted, and callers are checked against it.</div>`;
  return `<div class="box">– ${esc(v.reason)}</div>`;
}

function renderDetails() {
  const d = S.sel && byName()[S.sel];
  if (!d) return '<div class="sec"><div class="empty">Select a definition to see it here. Keys: ⌘P or Ctrl+P go to a definition, c code, t type map, a agents, p PRs, 1 collapse all, 2 expand all, / filter, Esc clears.</div></div>';
  return `<div class="sec"><h3><span>${d.kind}${d.module ? ' · ' + esc(d.module) : ''}</span><span>#${d.hash.slice(0, 8)}</span></h3>
      <div class="insp-name">${esc(d.label)}</div>
      ${d.doc ? `<div class="doc">${docHtml(d.doc)}</div>` : '<div class="empty">No description. Add a <code>///</code> comment above the definition.</div>'}</div>
    ${implSec(d)}
    ${d.deps.length || d.refs.length ? `<div class="sec"><h3>Neighbours</h3>${miniGraph(d)}</div>` : ''}
    ${d.errors.length || d.holes.length || d.verdict ? `<div class="sec"><h3>Status</h3>
      ${d.errors.map(e => `<div class="box bad">${esc(e)}</div>`).join('')}
      ${d.holes.map(h => `<div class="box warn"><b class="mono">?${esc(h.name)}</b>
        <div class="row"><b>goal</b> <code>${esc(h.goal)}</code></div>
        ${h.context.length ? `<div class="row"><b>context</b> <code>${esc(h.context.map(([n, t]) => n + ': ' + t).join(', '))}</code></div>` : ''}
        ${h.obligations.map(o => `<div class="row"><b>must</b> <code>${esc(o)}</code></div>`).join('')}</div>`).join('')}
      ${verdictBox(d.verdict)}</div>` : ''}`;
}
// the Code mode's right panel: the activity, or the selected definition's details
function renderRight() {
  const tab = S.rtab || 'activity';
  const tabs = `<div class="rtabs"><button data-rtab="activity" class="${tab === 'activity' ? 'on' : ''}">Activity</button><button data-rtab="details" class="${tab === 'details' ? 'on' : ''}">Details${S.sel ? ' · ' + esc(byName()[S.sel]?.label || '') : ''}</button></div>`;
  setHtml($('#right'), tabs + (tab === 'activity' ? activityHtml() : renderDetails()));
}

// ---------- changes: structural diffs over patches or git history ----------
// the structural diff being shown (an activity selection, a PR's diff): which parts are open
const CH = { data: null, step: null, sel: null, open: new Set() };
const chItems = () => (CH.data?.sections || []).flatMap(s => s.items);
const MK = { add: '+', del: '−', chg: '~', ren: '↪' };
const UP = new Set(['stronger guarantee', 'stricter precondition']), DOWN = new Set(['weaker guarantee', 'looser precondition']);
const TIPS = {
  'stronger guarantee': 'It now promises more: every implementation must guarantee this, and callers may rely on it.',
  'weaker guarantee': 'It promises less: callers can no longer rely on this.',
  'stricter precondition': 'Callers must now satisfy this before calling.',
  'looser precondition': 'Callers no longer need to satisfy this.',
  'contract changed': 'This contract was changed in place.',
  'new method': 'Every implementation must provide it.',
  'from the rename': 'This only follows a rename made in the same change.',
};
const words = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');
function segHtml(segs, resolve) {
  // a comment line stays a comment, whichever part of it changed
  const isCom = segs.filter(([k]) => k !== '-').map(([, t]) => t).join('').trim().startsWith('//');
  const h = t => isCom ? `<span class="${segs.map(([, x]) => x).join('').trim().startsWith('///') ? 't-doc' : 't-com'}">${esc(t)}</span>` : highlight(t, resolve);
  return segs.map(([k, t]) => k === '-' ? `<del>${h(t)}</del>` : k === '+' ? `<ins>${h(t)}</ins>` : h(t)).join('');
}
function chLine(l, resolve, key) {
  if (l.s === 'fold') {
    if (CH.open.has(key)) return l.hidden.map((h, i) => chLine(h, resolve, key + '.' + i)).join('');
    return `<span class="ln fold" data-fold="${esc(key)}" title="show">… ${esc(l.t)} ▸</span>`;
  }
  const note = l.note;
  let cls = { '+': 'add', '-': 'del', '~': 'chg', ' ': '' }[l.s];
  if (UP.has(note) && l.s === '+') cls = 'add strong';
  if (DOWN.has(note) && l.s === '-') cls = 'del weak';
  const sg = { '+': '+', '-': '−', '~': '~', ' ': '' }[l.s];
  const pc = UP.has(note) || DOWN.has(note) || note === 'contract changed' ? 'pill contract' : note === 'from the rename' ? 'pill ren' : 'pill';
  const label = UP.has(note) ? '▲ ' + note : DOWN.has(note) ? '▼ ' + note : note;
  const pill = note ? ` <span class="${pc}" title="${esc(TIPS[note] || '')}">${esc(label)}</span>` : '';
  const code = l.s === '~' && l.segs ? segHtml(l.segs, resolve) : highlight(l.t, resolve);
  return `<span class="ln ${cls}"><span class="sg">${sg}</span><span class="code">${code}</span>${pill}</span>`;

// ---------- a little markdown: what agents and PR descriptions write ----------
function mdInline(t) {
  const codes = [];

  t = esc(t)

    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noreferrer">$2</a>')

    .replace(/(^|[\s(])#(\d+)\b/g, '$1<a class="lnk" data-pr="$2">#$2</a>');

}
function md(src) {

  let i = 0;

  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^\s*```\s*([\w+-]*)/);
    if (fence) {
      const body = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i++]);
      i++;
      const text = body.join('\n');
      out.push(`<pre><code>${strataLang(fence[1]) ? highlight(text, resolver('')) : esc(text)}</code></pre>`);
      continue;
    }
    if (/^\s*$/.test(l)) { i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(l)) { const q = []; while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, '')); out.push(`<blockquote>${md(q.join('\n'))}</blockquote>`); continue; }

      const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().slice(1, -1).split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table>${body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${mdInline(c)}</th>` : `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</table>`);
      continue;
    }
    const li = /^\s*([-*+]|\d+[.)])\s+/;
    if (li.test(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && (li.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (li.test(lines[i])) items.push(lines[i].replace(li, '').replace(/^\[( |x)\]\s*/i, m => m.includes('x') || m.includes('X') ? '☑ ' : '☐ '));
        else items[items.length - 1] += ' ' + lines[i].trim();
        i++;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map(t => `<li>${mdInline(t)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i]) && !li.test(lines[i]) && !/^\s*>/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${mdInline(para.join('\n')).replace(/\n/g, '<br>')}</p>`);
  }

}

// a line diff (old → new), for files an agent's tool changed and PR files that aren't Strata

  if (skipped) html += `<span class="l h">… ${skipped} unchanged line${skipped > 1 ? 's' : ''}</span>`;

function slashUpdate() {

  const items = cmds.map(c => ({ c, m: q ? palMatch(q, c.name) : { score: 0, hits: [] } })).filter(x => x.m).sort((a, b) => b.m.score - a.m.score).slice(0, 12);

function slashDraw() {

function slashKey(e) {

  else if (!L.prs.length) body = '<div class="empty" style="padding:8px 14px">No pull requests.</div>';
  else {
    // stacks: PRs whose base is another listed PR's branch, grouped with it, the top first
    const byHead = new Map(L.prs.map(p => [p.headRefName, p]));
    const rootOf = p => { const seen = new Set(); while (byHead.has(p.baseRefName) && !seen.has(p.number)) { seen.add(p.number); p = byHead.get(p.baseRefName); } return p; };
    const groups = new Map();
    for (const p of L.prs) { const r = rootOf(p).number; if (!groups.has(r)) groups.set(r, []); groups.get(r).push(p); }
    const depth = p => { let d = 0, q = p; while (byHead.has(q.baseRefName) && d < 50) { q = byHead.get(q.baseRefName); d++; } return d; };
    const done = new Set();
    body = L.prs.map(p => {

      done.add(r);

    }).join('');
  }

}
