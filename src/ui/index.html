  for (const [k, w] of [['renamed', 'renamed'], ['added', 'added'], ['removed', 'removed'], ['changed', 'changed']]) if (sm[k]) parts.push(`<b>${sm[k]}</b> ${w}`);
  const cur = CH.step != null ? d.steps.find(s => s.id === CH.step) : null;
  const summary = parts.length ? `<div class="ch-sum">${cur ? `Step ${cur.n}: <b>${esc(cur.title)}</b> · ` : ''}${parts.join(' · ')}${sm.interface_changes ? ` · <b>${sm.interface_changes}</b> interface change${sm.interface_changes > 1 ? 's' : ''}` : ''}${sm.follow_renames ? ` · ${sm.follow_renames} only follow a rename` : ''}</div>` : `<div class="ch-sum">No changes${cur ? ' in this step' : ''}.</div>`;
  computeFollowers(chItems());
  const shown = s => s.items.filter(it => !CH.followers.has(it.id));
  const body = d.sections.filter(s => shown(s).length).map(s => `<h2 class="sect">${esc(s.name)} <span class="muted">${shown(s).length}</span><span class="why">${esc(s.why)}</span></h2><div class="cgroup">${shown(s).map(chCard).join('')}</div>`).join('');
  const ver = d.verification.length || d.rechecked_same ? `<h2 class="sect">Verification<span class="why">before → after, for what this change touches</span></h2><div class="cgroup"><table class="vtable">${d.verification.map(x => `<tr><td>${esc(x.name)}</td><td>${vword(x.before)} → ${vword(x.after)}</td><td class="why">${esc(x.why)}</td></tr>`).join('')}${d.rechecked_same ? `<tr><td colspan="3" class="why">and ${d.rechecked_same} definition${d.rechecked_same > 1 ? 's' : ''} that depend on these, re-verified with the same result</td></tr>` : ''}</table></div>` : '';
  let nav = '';
  if (cur) {
    const i = d.steps.indexOf(cur), p = d.steps[i - 1], n = d.steps[i + 1];
    nav = `<div class="stepnav">${p ? `<a data-chstep="${p.id}">← step ${p.n}: ${esc(p.title)}</a>` : '<span></span>'}${n ? `<a data-chstep="${n.id}">step ${n.n}: ${esc(n.title)} →</a>` : '<a data-chstep="all">back to the whole change</a>'}</div>`;
  }
  $('#main').innerHTML = `<div id="changes"><div class="ch-range">${range}</div>${steps}${summary}${body}${ver}${nav}</div>`;
}
function renderChangesLeft() {
  const d = CH.data;
  if (!d || d.error) { $('#left').innerHTML = ''; return; }
  if (!CH.follow) computeFollowers(chItems());
  $('#left').innerHTML = d.sections.filter(s => s.items.some(it => !CH.followers.has(it.id))).map(s => `<div class="group"><h4>${esc(s.name)}</h4>${s.items.filter(it => !CH.followers.has(it.id)).map(it =>
    `<div class="item ${it.id === CH.sel ? 'sel' : ''}" data-chpick="${esc(it.id)}" title="${esc(it.id)}"><span class="mk ${it.mk}">${MK[it.mk]}</span><span class="lbl">${esc(it.label)}</span><span class="spacer"></span><span class="muted" style="font:11px var(--sans)">${esc(it.module)}</span></div>`).join('')}</div>`).join('')
    || '<div class="group"><h4>No changes</h4></div>';
}
function renderChangesRight() {
  const it = chItems().find(x => x.id === CH.sel);
  if (!it) { $('#right').innerHTML = '<div class="sec"><div class="empty">Select a change to see what it affects, the steps that made it and its verification. Keys: ← → steps, c code, t type map.</div></div>'; return; }
  const steps = (CH.data.steps || []).filter(s => it.steps.includes(s.id));
  const v = it.verdict || {};
  $('#right').innerHTML = `<div class="sec"><h3><span>${esc(it.kind)}${it.module ? ' · ' + esc(it.module) : ''}</span><span>${it.interface_changed ? 'interface changed' : 'implementation only'}</span></h3>
      <div class="insp-name">${esc(it.label)}</div>
      ${it.doc ? `<div class="doc">${docHtml(it.doc)}</div>` : ''}
      <div style="margin-top:8px"><a class="lnk" data-gocode="${esc(it.id)}">open in the code view</a></div></div>
    <div class="sec"><h3>What changed</h3>${it.what.map(w => `<div>${words(w)}</div>`).join('')}${it.detail.map(w => `<div class="muted">${words(w)}</div>`).join('')}</div>
    ${it.affected.length ? `<div class="sec"><h3><span>Used by</span><span>${it.affected.length}${it.affected_total > it.affected.length ? ` · ${it.affected_total} depend on it in all` : ''}</span></h3>${it.affected.slice(0, 14).map(a => `<div class="aff" data-gocode="${esc(a.name)}">${esc(a.name)}${a.updated ? '<span class="ok">updated here ✓</span>' : '<span class="why">re-checked ✓</span>'}</div>`).join('')}${it.affected.length > 14 ? `<div class="empty">+ ${it.affected.length - 14} more</div>` : ''}</div>` : ''}
    ${steps.length ? `<div class="sec"><h3>Steps</h3>${steps.map(s => `<div class="stepl" data-chstep="${s.id}"><i>${s.n}</i>${esc(s.title)}</div>`).join('')}</div>` : ''}
    ${(v.before && v.before !== 'unverified') || (v.after && v.after !== 'unverified') ? `<div class="sec"><h3>Verification</h3>${vword(v.before)} → ${vword(v.after)}</div>` : ''}`;
}

// ---------- hover: an arrow from a name to where it is in the code view ----------
function clearArrow() {
  $('#arrow').innerHTML = '';
  document.querySelectorAll('.card.hover, .item.hover').forEach(c => c.classList.remove('hover'));
}
function showArrow(fromEl, name) {
  clearArrow();
  // the definition's code item if it is in the view, else its sidebar entry
  const target = document.getElementById('card-' + name) || document.querySelector(`#left .item[data-go="${CSS.escape(name)}"]`);
  if (!target || target.contains(fromEl)) return;
  target.classList.add('hover');
  const side = !target.classList.contains('card');
  const a = fromEl.getBoundingClientRect(), main = (side ? $('#left') : $('#main')).getBoundingClientRect();
  const r = target.getBoundingClientRect(), h = { left: side ? r.right - 8 : r.left, top: r.top, height: side ? r.height : 30 };
  // aim at the item's first line, clamped to the visible part of its panel
  const tx = h.left + 6, ty = Math.min(Math.max(h.top + h.height / 2, main.top + 8), main.bottom - 8);
  const offscreen = h.top < main.top || h.top > main.bottom;
  const sx = a.left < tx ? a.right : a.left, sy = a.top + a.height / 2;
  const bend = Math.max(60, Math.abs(tx - sx) / 2), dir = sx > tx ? -1 : 1;
  $('#arrow').innerHTML = `<path d="M${sx},${sy} C${sx + dir * bend},${sy} ${tx - dir * bend},${ty} ${tx},${ty}"/>
    <circle cx="${tx}" cy="${ty}" r="3.5"/>${offscreen ? `<text x="${tx + 8}" y="${ty + (h.top < main.top ? 14 : -6)}">${h.top < main.top ? '↑' : '↓'} ${esc(byName()[name]?.label || name)}</text>` : ''}`;
}
document.addEventListener('mouseover', e => {
  const r = e.target.closest('a.ref[data-go], .mg-n[data-go], .refs a[data-go]');
  if (r) showArrow(r, r.dataset.go);
});
document.addEventListener('mouseout', e => { if (e.target.closest('a.ref, .mg-n, .refs a')) clearArrow(); });
document.addEventListener('scroll', clearArrow, true);

const tagTxt = c => c.old == null ? '+ added' : c.new == null ? '− removed' : c.interface_changed ? '~ interface' : '~ impl';
const tagCls = c => c.old == null ? 'add' : c.new == null ? 'del' : c.interface_changed ? 'iface' : '';
function ago(t) {
  if (!t) return '';
  const s = Date.now() / 1000 - t;
  return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}

function syncHash() {
  const h = new URLSearchParams({ level: S.level, ...(S.allOpen ? { all: 1 } : {}),
    ...(S.level === 'changes' ? { ...(CH.step != null ? { step: CH.step } : {}), ...(CH.from != null ? { from: CH.from } : {}), ...(CH.base ? { base: CH.base } : {}), ...(CH.sel ? { change: CH.sel } : {}) } : {}), ...(S.sel ? { sel: S.sel } : {}), ...(S.scope !== 'all' ? { scope: S.scope } : {}) });
  history.replaceState(null, '', '#' + h);
}
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('level')) S.level = lv(h.get('level'));
  S.allOpen = h.get('all') === '1';
  if (!['types', 'changes', 1].includes(S.level)) S.level = 1;
  if (h.has('step')) CH.step = +h.get('step');
  if (h.has('from')) CH.from = +h.get('from');
  if (h.has('base')) CH.base = h.get('base');
  if (h.has('change')) CH.sel = h.get('change');
  if (h.has('sel')) S.sel = h.get('sel');
  navPush(S.sel || null);
  if (h.has('scope')) S.scope = h.get('scope');
})();

var render = function () {
  if (!S.data) return;
  syncHash();
  const scroll = $('#main').scrollTop;
  renderHeader(); if (S.level !== 'changes') renderLeft();
  if (S.level === 'changes') { renderChanges(); renderChangesLeft(); renderChangesRight(); }
  else { S.level === 'types' ? renderTypes() : renderCode(); renderRight(); }
  $('#main').scrollTop = scroll;
}

// ---------- live polling ----------
async function poll() {
  try {
    // the server answers 304 while nothing changed: no download, no parse, no render
    const r = await fetch('/api/state', { cache: 'no-store', headers: S.etag ? { 'If-None-Match': S.etag } : {} });
    $('#live').classList.remove('off'); $('#live span').textContent = 'live';
    if (r.status === 304) return;
    const txt = await r.text();
    S.etag = r.headers.get('ETag');
    if (txt !== S.raw) {
      S.raw = txt;
      const data = JSON.parse(txt);
      if (data.fatal) { $('#banner').innerHTML = `<div class="err">${esc(data.fatal)}</div>`; return; }
      if (S.data) {
        for (const d of data.decls) if (S.prevHash[d.name] && S.prevHash[d.name] !== d.hash || !S.prevHash[d.name]) S.flash.add(d.name);
        S.newLog = S.prevLog;
        setTimeout(() => { S.flash.clear(); }, 2500);
      } else S.newLog = data.log.length;
      S.prevHash = Object.fromEntries(data.decls.map(d => [d.name, d.hash]));
      S.prevLog = data.log.length;
      S.data = data;
      if (S.sel && !byName()[S.sel]) S.sel = null;
      render();
      if (S.level === 'changes') loadChanges();
    }
  } catch (e) {
    $('#live').classList.add('off'); $('#live span').textContent = 'disconnected';
  }
}
// poll again 1.5s after the last answer (not every 1.5s: a slow snapshot would pile requests up)
async function pollLoop() { await poll(); setTimeout(pollLoop, 1500); }

// ---------- events ----------
document.addEventListener('click', e => {
  const f = e.target.closest('[data-chfull],[data-chfollow]');
  if (f) {
    e.preventDefault();
    const key = f.dataset.chfull ? f.dataset.chfull + ':full' : f.dataset.chfollow + ':follow';
    CH.open.has(key) ? CH.open.delete(key) : CH.open.add(key);
    render(); return;
  }
  const c = e.target.closest('[data-chstep],[data-chpick],[data-fold],[data-gocode],[data-base],[data-chreset]');
  if (c) {
    e.preventDefault();
    if (c.dataset.chreset) { CH.base = null; CH.from = null; CH.step = null; syncHash(); loadChanges(true); return; }
    if (c.dataset.chstep) { CH.step = c.dataset.chstep === 'all' || (c.classList.contains('patch') && CH.step === +c.dataset.chstep) ? null : +c.dataset.chstep; CH.open.clear(); syncHash(); loadChanges(true); $('#main').scrollTop = 0; return; }
    if (c.dataset.fold) { CH.open.add(c.dataset.fold); render(); return; }
    if (c.dataset.base) { CH.base = c.dataset.base === 'HEAD' ? null : c.dataset.base; CH.step = null; syncHash(); loadChanges(true); return; }
    if (c.dataset.gocode) { S.level = 1; S.scope = 'slice'; select(c.dataset.gocode); return; }
    if (c.dataset.chpick) { CH.sel = c.dataset.chpick; render(); document.getElementById('ch-' + CSS.escape(CH.sel))?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  }
  const nb = e.target.closest('[data-nav]');
  if (nb) { if (!nb.disabled) navGo(+nb.dataset.nav); return; }
  const t = e.target.closest('[data-toggle],[data-all],[data-go],[data-pick],[data-l],[data-s],[data-mod],[data-mocks],[data-members]');
  if (!t) return;
  if (t.dataset.toggle) { const d = byName()[t.dataset.toggle]; if (d) { S.open[d.name] = !isOpen(d); render(); } return; }
  if (t.dataset.all) { S.allOpen = t.dataset.all === '1'; S.open = {}; render(); return; }
  if (t.dataset.l) { S.level = lv(t.dataset.l); render(); if (S.level === 'changes') loadChanges(); return; }
  if (t.dataset.mocks !== undefined) { S.showMocks = !S.showMocks; render(); return; }
  if (t.dataset.members !== undefined) { S.members = S.members === 'inline' ? 'separate' : 'inline'; localStorage.setItem('strata-members', S.members); render(); return; }
  if (t.dataset.mod !== undefined) { S.closedMods ||= new Set(); S.closedMods.has(t.dataset.mod) ? S.closedMods.delete(t.dataset.mod) : S.closedMods.add(t.dataset.mod); render(); return; }
  if (t.dataset.s) { if (!t.disabled) { S.scope = t.dataset.s; render(); } return; }
  if (t.dataset.go) { clearArrow(); if (S.scope === 'all') S.scope = 'slice'; select(t.dataset.go, typeof S.level === 'number'); return; }
  if (t.dataset.pick) select(t.dataset.pick, false);
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
document.addEventListener('change', e => {
  if (e.target.id === 'ch-from') { CH.from = +e.target.value; CH.step = null; syncHash(); loadChanges(true); }
  if (e.target.id === 'ch-commit' && e.target.value) { CH.base = e.target.value; CH.step = null; syncHash(); loadChanges(true); }
});
document.addEventListener('keydown', e => { if (e.target.id === 'ch-base' && e.key === 'Enter') { CH.base = e.target.value.trim() || null; CH.step = null; syncHash(); loadChanges(true); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.value = ''; S.q = ''; e.target.blur(); render(); } return; }
  if (e.key === '1' || e.key === '2') { S.level = 1; S.allOpen = e.key === '2'; S.open = {}; render(); }
  else if (e.key === 'c') { S.level = 1; render(); }
  else if (e.key === 't') { S.level = 'types'; render(); }
  else if (e.key === 'd') { S.level = 'changes'; render(); loadChanges(); }
  else if (S.level === 'changes' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && CH.data?.steps?.length) {
    const ids = CH.data.steps.map(s => s.id), i = CH.step == null ? -1 : ids.indexOf(CH.step);
    const j = e.key === 'ArrowRight' ? i + 1 : (i === -1 ? ids.length - 1 : i - 1);
    CH.step = j >= 0 && j < ids.length ? ids[j] : null; CH.open.clear(); syncHash(); loadChanges(true);
  }
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') { S.sel = null; S.scope = 'all'; navPush(null); render(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.level !== 'changes' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); navGo(e.key === 'ArrowLeft' ? -1 : 1);
  }
});
// ---------- ⌘P / Ctrl+P: go to any definition by name ----------
const PAL = { items: [], i: 0 };
// fuzzy match: the query's characters in order; prefer a prefix, then a word start, then contiguous runs
function palMatch(q, text) {
  const t = text.toLowerCase(), hits = [];
  let score = 0, j = 0, prev = -2;
  for (const ch of q) {
    j = t.indexOf(ch, j);
    if (j < 0) return null;
    score += j === prev + 1 ? 3 : 0;
    if (j === 0 || /[^a-z0-9]/.test(t[j - 1])) score += 2;
    hits.push(j); prev = j; j++;
  }
  if (t.startsWith(q)) score += 10;
  return { score: score - t.length * 0.05, hits };
}
function palRender() {
  const q = $('#pal-q').value.trim().toLowerCase();
  const by = byName();
  const ds = S.data.decls.filter(d => d.kind !== 'use');
  let items;
  if (!q) items = [...new Set([...NAV.stack].reverse())].filter(n => by[n]).concat(ds.map(d => d.name)).filter((n, i, a) => a.indexOf(n) === i).slice(0, 50).map(n => ({ d: by[n], hits: [] }));
  else items = ds.map(d => ({ d, m: palMatch(q, d.label) || (palMatch(q, d.name) && { score: palMatch(q, d.name).score - 5, hits: [] }) }))
    .filter(x => x.m).sort((a, b) => b.m.score - a.m.score).slice(0, 50).map(x => ({ d: x.d, hits: x.m.hits }));
  PAL.items = items; PAL.i = Math.min(PAL.i, Math.max(0, items.length - 1));
  const mark = (s, hits) => [...s].map((c, k) => hits.includes(k) ? `<b>${esc(c)}</b>` : esc(c)).join('');
  $('#pal-res').innerHTML = items.length ? items.map(({ d, hits }, k) =>
    `<div class="r ${k === PAL.i ? 'on' : ''}" data-pal="${k}"><span class="kind k-${d.kind}">${KIND[d.kind] || ''}</span><span class="lab">${mark(d.label, hits)}</span><span class="mod">${esc(d.module || '')}</span></div>`).join('')
    : '<div class="empty" style="padding:8px 14px">No definition matches.</div>';
  $('#pal-res .r.on')?.scrollIntoView({ block: 'nearest' });
}
function palOpen() { if (!S.data) return; $('#pal').classList.add('on'); $('#pal-q').value = ''; PAL.i = 0; palRender(); $('#pal-q').focus(); }
function palClose() { $('#pal').classList.remove('on'); $('#pal-q').blur(); }
function palGo(k) {
  const it = PAL.items[k]; if (!it) return;
  palClose();
  S.level = 1; S.scope = 'slice'; select(it.d.name);
}
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'p') {
    e.preventDefault(); e.stopPropagation();
    $('#pal').classList.contains('on') ? palClose() : palOpen();
  }
}, true);
$('#pal-q').addEventListener('input', () => { PAL.i = 0; palRender(); });
$('#pal-q').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Escape') palClose();
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = PAL.items.length; if (n) { PAL.i = (PAL.i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; palRender(); } }
  else if (e.key === 'Enter') { e.preventDefault(); palGo(PAL.i); }
});
$('#pal').addEventListener('mousedown', e => { const r = e.target.closest('[data-pal]'); if (r) { e.preventDefault(); palGo(+r.dataset.pal); } else if (!e.target.closest('.box-p')) palClose(); });

// never fail silently: show viewer errors in the banner
window.addEventListener('error', e => { $('#banner').innerHTML = `<div class="err">viewer error: ${esc(e.message)} (line ${e.lineno})</div>`; });
const _render = render;
render = function () { try { _render(); } catch (err) { $('#banner').innerHTML = `<div class="err">viewer error: ${esc(err.message)} ${esc((err.stack || '').split('\n')[1] || '')}</div>`; } };
tmEvents();
pollLoop();
</script>
