<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e3e3df; --text: #1d1d1b; --muted: #74746f; --faint: #a5a5a0;
  --accent: #3b5bdb; --accent-soft: #e8edfd;
  --type: #7048e8; --effect: #c2255c; --fn: #1c7ed6; --test: #5c940d;
  --ok: #2f9e44; --warn: #e67700; --bad: #e03131;
  --code-bg: #fbfbfa; --kw: #9c36b5; --str: #2b8a3e; --num: #c92a2a; --com: #8d8d88; --hole-bg: #fff3bf;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1e1e1c; --line: #2f2f2c; --text: #e9e9e6; --muted: #9a9a94; --faint: #5f5f5a;
    --accent: #748ffc; --accent-soft: #232a45;
    --type: #b197fc; --effect: #f783ac; --fn: #74c0fc; --test: #a9e34b;
    --ok: #51cf66; --warn: #ffa94d; --bad: #ff6b6b;
    --code-bg: #1a1a18; --kw: #da77f2; --str: #8ce99a; --num: #ffa8a8; --com: #6f6f69; --hole-bg: #4a3d0a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--sans); background: var(--bg); color: var(--text); display: grid;
  grid-template-rows: auto auto 1fr; grid-template-columns: 240px 1fr 340px; grid-template-areas: "top top top" "banner banner banner" "left main right"; }
header { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font-weight: 650; letter-spacing: .2px; }
header .path { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.chips { display: flex; gap: 6px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
.chip.warn b { color: var(--warn); } .chip.bad b { color: var(--bad); } .chip.ok b { color: var(--ok); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 4px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:hover:not(.on) { color: var(--text); }
input[type=search] { font: inherit; padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); width: 180px; }
.live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.live.off i { background: var(--bad); }

#banner { grid-area: banner; }
#banner .err { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); border-bottom: 1px solid var(--line); padding: 6px 14px; font-family: var(--mono); font-size: 12px; }
#banner .err a { color: var(--bad); cursor: pointer; font-weight: 600; }

aside, main { overflow: auto; min-height: 0; }
#left { grid-area: left; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0 20px; }
#right { grid-area: right; border-left: 1px solid var(--line); background: var(--panel); }
main { grid-area: main; position: relative; }

.group h4 { margin: 12px 14px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); font-weight: 600; }
.item { display: flex; align-items: center; gap: 8px; padding: 3px 14px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
.item:hover { background: var(--bg); }
.item.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.item.dim { opacity: .35; }
.item .lbl { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.none { background: transparent; border: 1px solid var(--faint); }
.kind { font-size: 10px; font-weight: 700; width: 14px; text-align: center; flex: none; font-family: var(--sans); }
.k-type { color: var(--type); } .k-effect { color: var(--effect); } .k-fn { color: var(--fn); } .k-test { color: var(--test); }

/* code view */
#code { padding: 16px 22px 60px; max-width: 980px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 12px; overflow: hidden; scroll-margin-top: 12px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--warn) 60%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.card-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.card-h .name { font-family: var(--mono); font-weight: 600; }
.card-h .hash { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.badge { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.muted { color: var(--faint); }
.card-h .seg button { padding: 1px 7px; font-size: 11px; }
pre { margin: 0; padding: 10px 14px; background: var(--code-bg); font: 12.5px/1.55 var(--mono); overflow-x: auto; white-space: pre; }
.t-kw { color: var(--kw); } .t-str { color: var(--str); } .t-num { color: var(--num); } .t-com { color: var(--com); font-style: italic; }
.t-ty { color: var(--type); } .t-doc { color: var(--com); }
.t-hole { background: var(--hole-bg); border-radius: 3px; padding: 0 2px; font-weight: 600; }
a.ref { color: inherit; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: pointer; }
a.ref:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* map */
#tmap { display: block; cursor: grab; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
#tmap:active { cursor: grabbing; }
.tnode { cursor: pointer; }
.tnode rect.body { fill: var(--panel); stroke: var(--line); rx: 8; }
.tnode rect.head { fill: color-mix(in srgb, var(--type) 10%, var(--panel)); stroke: none; rx: 8; }
.tnode.k-effect rect.head { fill: color-mix(in srgb, var(--effect) 12%, var(--panel)); }
.tnode.k-alias rect.head { fill: var(--bg); }
.tnode.sel rect.body { stroke: var(--accent); stroke-width: 2; }
.tnode.fade { opacity: .28; }
.tnode .tn { font: 600 12.5px var(--mono); fill: var(--text); }
.tnode .tk { font: 10.5px var(--sans); fill: var(--faint); }
.tnode.k-effect .tn { fill: var(--effect); }
.tnode .tl { font: 11.5px var(--mono); fill: var(--text); }
.tnode .tl.muted { fill: var(--muted); font-style: italic; }
.tnode .tl.meth { fill: var(--fn); }
.tedge { stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.tedge.refines, .tedge.alias { stroke: var(--type); stroke-dasharray: 5 4; }
.tedge.op { stroke: var(--effect); stroke-dasharray: 2 3; }
.tedge.hot { opacity: 1; stroke-width: 2; }
.tedge.fade { opacity: .12; }
.tlabel { font: 10.5px var(--mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
.maptools { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--muted); font-size: 11.5px; }
.maptools button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
.maptools .sep { width: 1px; height: 14px; background: var(--line); }
.maptools span { display: inline-flex; align-items: center; gap: 5px; }
.lg { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--muted); }
.lg.refines { border-top: 2px dashed var(--type); } .lg.op { border-top: 2px dotted var(--effect); }
.muted { color: var(--muted); }
/* flow */
#flow { padding: 14px 22px 60px; font-size: 12.5px; }
.entries { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 6px; }
.elab { width: 84px; color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; font-weight: 600; }
.echip { font: 12px var(--mono); padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.echip:hover { border-color: var(--accent); }
.echip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ehint { color: var(--faint); font-size: 11.5px; margin: 4px 0 14px 90px; }
.froot { font: 600 13px var(--mono); padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.ftree { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 8px 8px; padding: 8px 10px 12px; font: 12.5px/1.5 var(--mono); }
.ftree details > summary { cursor: pointer; padding: 1px 0; list-style: none; }
.ftree details > summary::before { content: '▸'; color: var(--faint); display: inline-block; width: 14px; }
.ftree details[open] > summary::before { content: '▾'; }
.ftree .fleaf { padding: 1px 0 1px 14px; }
.fkids { margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.fic { display: inline-block; width: 18px; text-align: center; color: var(--faint); }
.fic.k-fn { color: var(--fn); } .fic.k-effect { color: var(--effect); }
.fname { cursor: pointer; } .fname:hover { color: var(--accent); text-decoration: underline; }
.fargs { color: var(--muted); }
.eff { color: var(--effect); font-weight: 600; }
.arm { color: var(--type); }
.fnote { color: var(--faint); font-family: var(--sans); font-size: 11.5px; margin: 4px 0 2px 14px; }
.retarget { color: var(--faint); margin-left: 6px; cursor: pointer; text-decoration: none; }
.retarget:hover { color: var(--accent); }
.badge.handled { color: var(--ok); }
/* inspector */
.sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); font-weight: 600; display: flex; justify-content: space-between; }
.insp-name { font: 600 15px var(--mono); margin: 2px 0 6px; word-break: break-all; }
.doc { color: var(--muted); white-space: pre-wrap; margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 8px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.refs { display: flex; flex-wrap: wrap; gap: 4px; }
.refs a { font: 12px var(--mono); padding: 1px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); cursor: pointer; }
.refs a:hover { border-color: var(--accent); color: var(--accent); }
.box { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin-top: 6px; font-size: 12px; }
.box.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.box.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.box.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.box code, .box .mono { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.box .row { margin-top: 3px; } .box .row b { color: var(--muted); font-weight: 500; display: inline-block; min-width: 58px; }
.empty { color: var(--faint); font-size: 12px; }
.log-e { padding: 7px 0; border-bottom: 1px dashed var(--line); }
.log-e:last-child { border-bottom: 0; }
.log-e .msg { font-weight: 600; }
.log-e .when { color: var(--faint); font-size: 11px; float: right; }
.log-e .ch { font: 11.5px var(--mono); margin-top: 2px; display: flex; gap: 6px; cursor: pointer; }
.log-e .ch:hover .n { color: var(--accent); }
.tag { width: 86px; flex: none; color: var(--muted); white-space: nowrap; }
.tag.add { color: var(--ok); } .tag.del { color: var(--bad); } .tag.iface { color: var(--warn); }
.log-e.new { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 14%, transparent), transparent); }
</style>
</head>
<body>
<header>
  <span class="brand">Strata</span>
  <span class="path" id="path"></span>
  <div class="chips" id="chips"></div>
  <span class="spacer"></span>
  <div class="seg" id="levels">
    <button data-l="types" title="Types, effects and how they relate (key t)">Types</button>
    <button data-l="flow" title="Execution paths from an entry point (key f)">Flow</button>
    <button data-l="1" title="Types, signatures and contracts (key 1)">Interfaces</button>
    <button data-l="2" title="Signatures plus body summaries (key 2)">Outline</button>
    <button data-l="3" title="Full source (key 3)">Source</button>
  </div>
  <input type="search" id="q" placeholder="Filter  ( / )">
  <span class="live" id="live"><i></i><span>live</span></span>
</header>
<div id="banner"></div>
<aside id="left"></aside>
<main id="main"></main>
<aside id="right"></aside>

<script>
const lv = x => isNaN(+x) ? x : +x;
const S = { data: null, raw: '', level: 1, sel: null, scope: 'all', q: '', over: {}, prevHash: {}, flash: new Set(), prevLog: 0, newLog: 0, showTests: false };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KIND = { type: 'T', effect: 'E', fn: 'ƒ', test: '✓' };
const byName = () => Object.fromEntries(S.data.decls.map(d => [d.name, d]));

function status(d) {
  if (d.errors.length) return ['bad', 'error'];
  const v = d.verdict;
  if (v && v.status === 'counterexample') return ['bad', 'counterexample'];
  if (d.holes.length) return ['warn', d.holes.length + ' hole' + (d.holes.length > 1 ? 's' : '')];
  if (v && v.status === 'incomplete') return ['warn', 'incomplete'];
  if (v && v.status === 'fuzzed') return ['ok', 'fuzzed ' + v.cases];
  if (d.kind === 'fn') return ['none', 'unverified'];
  return ['', ''];
}

// ---------- syntax highlighting with clickable references ----------
const KW = new Set('type effect fn test let if else match handle with mock where requires ensures true false is assert'.split(' '));
function highlight(src, names) {
  const re = /(\/\/\/[^\n]*)|(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\?[A-Za-z_]\w*)|(\b\d+\b)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    const [t, doc, com, str, hole, num, id] = m;
    if (doc) out += `<span class="t-doc">${esc(t)}</span>`;
    else if (com) out += `<span class="t-com">${esc(t)}</span>`;
    else if (str) out += `<span class="t-str">${esc(t)}</span>`;
    else if (hole) out += `<span class="t-hole">${esc(t)}</span>`;
    else if (num) out += `<span class="t-num">${t}</span>`;
    else if (KW.has(id)) out += `<span class="t-kw">${id}</span>`;
    else {
      const cls = /^[A-Z]/.test(id) ? 't-ty' : '';
      out += names.has(id) ? `<a class="ref ${cls}" data-go="${esc(id)}">${id}</a>` : (cls ? `<span class="${cls}">${id}</span>` : id);
    }
  }
  return out + esc(src.slice(last));
}

// ---------- selection & scope ----------
function visible() {
  const all = S.data.decls;
  const q = S.q.toLowerCase();
  let set = all;
  if (S.scope === 'slice' && S.sel) {
    const d = byName()[S.sel];
    const keep = new Set([S.sel, ...(d?.deps || []), ...(d?.used_by || [])]);
    set = all.filter(x => keep.has(x.name));
  }
  if (q) set = set.filter(x => x.label.toLowerCase().includes(q) || (S.level === 3 && x.text['3'].toLowerCase().includes(q)));
  return set;
}

function select(name, scroll = true) {
  S.sel = name;
  render();
  if (scroll) {
    const el = document.getElementById('card-' + CSS.escape(name));
    el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ---------- rendering ----------
function renderHeader() {
  const D = S.data.decls;
  $('#path').textContent = S.data.label; $('#path').title = S.data.label;
  const holes = D.reduce((n, d) => n + d.holes.length, 0);
  const cex = D.filter(d => d.verdict?.status === 'counterexample').length;
  const fz = D.filter(d => d.verdict?.status === 'fuzzed').length;
  const fns = D.filter(d => d.kind === 'fn').length;
  $('#chips').innerHTML = [
    `<span class="chip"><b>${D.length}</b> definitions</span>`,
    `<span class="chip ${S.data.errors.length ? 'bad' : 'ok'}"><b>${S.data.errors.length ? S.data.errors.length + ' errors' : 'checks'}</b></span>`,
    `<span class="chip ${holes ? 'warn' : ''}"><b>${holes}</b> holes</span>`,
    `<span class="chip ${cex ? 'bad' : fz ? 'ok' : ''}"><b>${fz}/${fns}</b> fuzzed${cex ? ` · <b>${cex}</b> failing` : ''}</span>`,
  ].join('');
  for (const b of $('#levels').children) b.classList.toggle('on', lv(b.dataset.l) === S.level);
  $('#banner').innerHTML = S.data.errors.length
    ? S.data.errors.map(e => `<div class="err"><a data-go="${esc(e.decl)}">${esc(e.decl)}</a>: ${esc(e.msg)}</div>`).join('') : '';
}

function renderLeft() {
  const groups = [['type', 'Types'], ['effect', 'Effects'], ['fn', 'Functions'], ['test', 'Tests']];
  const vis = new Set(visible().map(d => d.name));
  $('#left').innerHTML = groups.map(([k, title]) => {
    const items = S.data.decls.filter(d => d.kind === k);
    if (!items.length) return '';
    return `<div class="group"><h4>${title}</h4>${items.map(d => {
      const [cls] = status(d);
      return `<div class="item ${d.name === S.sel ? 'sel' : ''} ${vis.has(d.name) ? '' : 'dim'}" data-go="${esc(d.name)}" title="${esc(d.label)}">
        <span class="kind k-${d.kind}">${KIND[d.kind]}</span><span class="lbl">${esc(d.label)}</span><span class="spacer"></span><span class="dot ${cls}"></span></div>`;
    }).join('')}</div>`;
  }).join('');
}

function renderCode() {
  const names = new Set(S.data.decls.map(d => d.name));
  const list = visible();
  const scopeSeg = `<div class="seg" id="scope">
      <button data-s="all" class="${S.scope === 'all' ? 'on' : ''}">Everything</button>
      <button data-s="slice" class="${S.scope === 'slice' ? 'on' : ''}" ${S.sel ? '' : 'disabled title="Select a definition first"'}>Slice around ${S.sel ? esc(byName()[S.sel]?.label) : 'selection'}</button></div>`;
  const cards = list.map(d => {
    const lvl = S.over[d.name] ?? S.level;
    const [cls, txt] = status(d);
    const lv = [1, 2, 3].map(l => `<button data-card-level="${l}" data-name="${esc(d.name)}" class="${l === lvl ? 'on' : ''}">L${l}</button>`).join('');
    return `<div class="card ${d.name === S.sel ? 'sel' : ''} ${S.flash.has(d.name) ? 'flash' : ''}" id="card-${esc(d.name)}">
      <div class="card-h" data-pick="${esc(d.name)}">
        <span class="kind k-${d.kind}">${KIND[d.kind]}</span><span class="name">${esc(d.label)}</span>
        ${d.effects.length ? `<span class="badge muted">/ {${esc(d.effects.join(', '))}}</span>` : ''}
        ${txt ? `<span class="badge ${cls === 'none' ? 'muted' : cls}">${esc(txt)}</span>` : ''}
        <span class="spacer"></span><span class="hash">#${d.hash.slice(0, 8)}</span>
        <div class="seg">${lv}</div>
      </div>
      <pre>${highlight(d.text[String(lvl)], names)}</pre></div>`;
  }).join('');
  $('#main').innerHTML = `<div id="code"><div class="toolbar">${scopeSeg}<span>${list.length} of ${S.data.decls.length} shown · click L1/L2/L3 on a card to zoom just that definition</span></div>${cards || '<div class="empty">Nothing matches.</div>'}</div>`;
}

// ---------- type map: types, effects (and later traits) as a general graph ----------
const TM = { pos: null, view: null, drag: null, moved: false };
const tmOpt = { effects: true, aliases: false, methods: true };

function typeGraph() {
  const st = S.data.structure.filter(t => (tmOpt.effects || t.kind !== 'effect') && (tmOpt.aliases || t.kind !== 'alias'));
  const names = new Set(st.map(t => t.name));
  const edges = new Map();
  const add = (from, to, kind, label) => {
    if (from === to || !names.has(to)) return;
    const key = from + '>' + to + ':' + kind;
    const e = edges.get(key) || { from, to, kind, labels: [] };
    if (label && !e.labels.includes(label)) e.labels.push(label);
    edges.set(key, e);
  };
  for (const t of st) {
    for (const f of t.fields || []) f.refs.forEach(r => add(t.name, r, 'has', f.name));
    for (const v of t.variants || []) for (const f of v.fields) f.refs.forEach(r => add(t.name, r, 'has', v.name));
    if (t.base) t.base.refs.forEach(r => add(t.name, r, t.refinement ? 'refines' : 'alias', ''));
    for (const o of t.ops || []) o.refs.forEach(r => add(t.name, r, 'op', o.name));
  }
  return { nodes: st, edges: [...edges.values()] };
}

const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
function cardLines(t) {
  const L = [];
  if (t.kind === 'alias') {
    L.push(['= ' + t.base.ty, '']);
    if (t.refinement) L.push(['where ' + t.refinement, 'muted']);
  }
  for (const f of t.fields || []) L.push([`${f.name}: ${f.ty}`, '']);
  for (const v of t.variants || []) {
    const fs = v.fields.length ? (v.fields[0].name ? ' { ' + v.fields.map(f => f.name).join(', ') + ' }' : '(' + v.fields.map(f => f.ty).join(', ') + ')') : '';
    L.push([`| ${v.name}${fs}`, '']);
  }
  for (const o of t.ops || []) L.push([o.sig, '']);
  if (t.kind !== 'alias' && t.refinement) L.push(['where ' + t.refinement, 'muted']);
  if (tmOpt.methods && t.methods.length) L.push(['fns: ' + t.methods.map(m => m.name).join(', '), 'meth']);
  return L.map(([s, c]) => [trunc(s, 46), c]);
}
const LH = 16, HEAD = 24, CW = 7.1;
const title = t => t.name + (t.params.length ? '[' + t.params.join(', ') + ']' : '');
function cardSize(t) {
  const L = cardLines(t);
  return { w: Math.max(120, Math.min(340, 26 + CW * Math.max(title(t).length + 8, ...L.map(l => l[0].length)))), h: HEAD + 10 + L.length * LH };
}

function layoutTypes(g) {
  const key = 'strata-tpos:' + S.data.label;
  if (!TM.pos) { try { TM.pos = JSON.parse(localStorage.getItem(key)) || {}; } catch { TM.pos = {}; } }
  const P = TM.pos, size = {};
  g.nodes.forEach(n => size[n.name] = cardSize(n));
  const fresh = g.nodes.filter(n => !P[n.name]);
  if (!fresh.length) return size;
  // seed new nodes near placed neighbours, otherwise on a spiral
  fresh.forEach((n, i) => {
    const nb = g.edges.filter(e => e.from === n.name || e.to === n.name).map(e => e.from === n.name ? e.to : e.from).filter(x => P[x]);
    if (nb.length) {
      const c = nb.reduce((a, x) => ({ x: a.x + P[x].x / nb.length, y: a.y + P[x].y / nb.length }), { x: 0, y: 0 });
      P[n.name] = { x: c.x + 120 * Math.cos(i * 2.4), y: c.y + 120 * Math.sin(i * 2.4) };
    } else {
      const a = i * 2.4, r = 90 * Math.sqrt(i + 1);
      P[n.name] = { x: r * Math.cos(a), y: r * Math.sin(a) };
    }
  });
  const movable = new Set(fresh.map(n => n.name)), all = g.nodes.map(n => n.name);
  const rad = n => (size[n].w + size[n].h) / 4;
  for (let it = 0, N = 900; it < N; it++) {
    const F = {}; all.forEach(n => F[n] = { x: 0, y: 0 });
    for (let a = 0; a < all.length; a++) for (let b = a + 1; b < all.length; b++) {
      const A = all[a], B = all[b], dx = P[B].x - P[A].x, dy = P[B].y - P[A].y, d = Math.hypot(dx, dy) || 0.01;
      const gap = Math.max(10, d - rad(A) - rad(B)), f = 20000 / (gap * gap);
      F[A].x -= dx / d * f; F[A].y -= dy / d * f; F[B].x += dx / d * f; F[B].y += dy / d * f;
    }
    for (const e of g.edges) {
      const A = e.from, B = e.to, dx = P[B].x - P[A].x, dy = P[B].y - P[A].y, d = Math.hypot(dx, dy) || 0.01;
      const f = (d - (90 + rad(A) + rad(B))) * 0.08;
      F[A].x += dx / d * f; F[A].y += dy / d * f; F[B].x -= dx / d * f; F[B].y -= dy / d * f;
    }
    for (const n of all) { F[n].x -= P[n].x * 0.006; F[n].y -= P[n].y * 0.006; }
    const step = 30 * (1 - it / N) + 0.5;
    for (const n of movable) {
      const m = Math.hypot(F[n].x, F[n].y) || 1, s = Math.min(m, step);
      P[n].x += F[n].x / m * s; P[n].y += F[n].y / m * s;
    }
  }
  // remove any remaining overlap
  for (let pass = 0; pass < 80; pass++) {
    let moved = false;
    for (let a = 0; a < all.length; a++) for (let b = a + 1; b < all.length; b++) {
      const A = all[a], B = all[b], pa = P[A], pb = P[B];
      const ma = movable.has(A), mb = movable.has(B);
      if (!ma && !mb) continue;
      const ox = (size[A].w + size[B].w) / 2 + 18 - Math.abs(pb.x - pa.x), oy = (size[A].h + size[B].h) / 2 + 18 - Math.abs(pb.y - pa.y);
      if (ox > 0 && oy > 0) {
        moved = true;
        const wa = ma && mb ? .5 : ma ? 1 : 0, wb = 1 - wa;
        if (ox < oy) { const s = Math.sign(pb.x - pa.x) || 1; pa.x -= s * ox * wa; pb.x += s * ox * wb; }
        else { const s = Math.sign(pb.y - pa.y) || 1; pa.y -= s * oy * wa; pb.y += s * oy * wb; }
      }
    }
    if (!moved) break;
  }
  localStorage.setItem(key, JSON.stringify(P));
  return size;
}

function clip(c, s, tx, ty) {
  const dx = tx - c.x, dy = ty - c.y;
  const k = Math.min((s.w / 2 + 3) / Math.abs(dx || 1e-9), (s.h / 2 + 3) / Math.abs(dy || 1e-9));
  return { x: c.x + dx * k, y: c.y + dy * k };
}

function renderTypes() {
  const g = typeGraph(), size = layoutTypes(g), P = TM.pos;
  const main = $('#main'), W = main.clientWidth || 900, H = main.clientHeight || 700;
  if (!TM.view && g.nodes.length) {
    const xs = g.nodes.flatMap(n => [P[n.name].x - size[n.name].w / 2, P[n.name].x + size[n.name].w / 2]);
    const ys = g.nodes.flatMap(n => [P[n.name].y - size[n.name].h / 2, P[n.name].y + size[n.name].h / 2]);
    const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
    const top = 90, k = Math.min(1, (W - 60) / bw, (H - top - 30) / bh);
    TM.view = { k, x: W / 2 - k * (Math.min(...xs) + bw / 2), y: top + (H - top - 30) / 2 - k * (Math.min(...ys) + bh / 2) };
  }
  const sel = S.sel && P[S.sel] && g.nodes.some(n => n.name === S.sel) ? S.sel : null;
  const near = sel ? new Set([sel, ...g.edges.filter(e => e.from === sel || e.to === sel).flatMap(e => [e.from, e.to])]) : null;
  let edges = '', labels = '';
  for (const e of g.edges) {
    const a = P[e.from], b = P[e.to];
    const p1 = clip(a, size[e.from], b.x, b.y), p2 = clip(b, size[e.to], a.x, a.y);
    const hot = sel && (e.from === sel || e.to === sel), fade = sel && !hot;
    edges += `<line class="tedge ${e.kind} ${hot ? 'hot' : ''} ${fade ? 'fade' : ''}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" marker-end="url(#ar-${e.kind})"/>`;
    if (e.labels.length && hot) labels += `<text class="tlabel" x="${(p1.x + p2.x) / 2}" y="${(p1.y + p2.y) / 2 - 3}">${esc(trunc(e.labels.join(', '), 28))}</text>`;
  }
  let nodes = '';
  for (const t of g.nodes) {
    const p = P[t.name], s = size[t.name], d = byName()[t.name], [cls] = d ? status(d) : [''];
    const lines = cardLines(t).map(([l, c], i) => `<text class="tl ${c}" x="10" y="${HEAD + 14 + i * LH}">${esc(l)}</text>`).join('');
    nodes += `<g class="tnode k-${t.kind} ${t.name === sel ? 'sel' : ''} ${near && !near.has(t.name) ? 'fade' : ''}" data-node="${esc(t.name)}" transform="translate(${p.x - s.w / 2},${p.y - s.h / 2})">
      <rect class="body" width="${s.w}" height="${s.h}"/><rect class="head" width="${s.w}" height="${HEAD}"/>
      <text class="tn" x="10" y="16">${esc(title(t))}</text><text class="tk" x="${s.w - 8}" y="16" text-anchor="end">${t.kind === 'sum' ? 'variants' : t.kind}${cls === 'bad' ? ' ⚠' : ''}</text>
      ${lines}</g>`;
  }
  const v = TM.view || { x: 0, y: 0, k: 1 };
  const mk = (id, col) => `<marker id="ar-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
  const cs = getComputedStyle(document.documentElement), cv = n => cs.getPropertyValue(n).trim();
  main.innerHTML = `<svg id="tmap" width="100%" height="100%">
      <defs>${mk('has', cv('--muted'))}${mk('refines', cv('--type'))}${mk('alias', cv('--type'))}${mk('op', cv('--effect'))}</defs>
      <g id="tview" transform="translate(${v.x},${v.y}) scale(${v.k})">${edges}${nodes}${labels}</g></svg>
    <div class="maptools">
      <label><input type="checkbox" data-opt="effects" ${tmOpt.effects ? 'checked' : ''}> effects</label>
      <label><input type="checkbox" data-opt="aliases" ${tmOpt.aliases ? 'checked' : ''}> refined aliases</label>
      <label><input type="checkbox" data-opt="methods" ${tmOpt.methods ? 'checked' : ''}> functions</label>
      <button id="relayout">re-layout</button><button id="fit">fit</button>
      <span class="sep"></span>
      <span><i class="lg has"></i>contains</span><span><i class="lg refines"></i>refines</span><span><i class="lg op"></i>used by operation</span>
      <span class="muted">click a card to see its relations · drag cards · scroll to zoom · double-click to open</span>
    </div>`;
}

function tmEvents() {
  const main = $('#main');
  main.addEventListener('mousedown', e => {
    if (S.level !== 'types' || !e.target.closest('#tmap')) return;
    const node = e.target.closest('[data-node]');
    TM.drag = { node: node?.dataset.node, sx: e.clientX, sy: e.clientY, v: { ...TM.view }, p: node ? { ...TM.pos[node.dataset.node] } : null };
    TM.moved = false;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    const d = TM.drag; if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) TM.moved = true;
    if (d.node) { TM.pos[d.node] = { x: d.p.x + dx / TM.view.k, y: d.p.y + dy / TM.view.k }; }
    else { TM.view = { ...d.v, x: d.v.x + dx, y: d.v.y + dy }; }
    renderTypes();
  });
  window.addEventListener('mouseup', () => {
    const d = TM.drag; TM.drag = null; if (!d) return;
    if (d.node) localStorage.setItem('strata-tpos:' + S.data.label, JSON.stringify(TM.pos));
    if (!TM.moved) { S.sel = d.node || null; render(); }
  });
  main.addEventListener('wheel', e => {
    if (S.level !== 'types' || !e.target.closest('#tmap')) return;
    e.preventDefault();
    const r = $('#tmap').getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const v = TM.view, k = Math.min(2.5, Math.max(0.2, v.k * Math.exp(-e.deltaY * 0.0015)));
    TM.view = { k, x: mx - (mx - v.x) * k / v.k, y: my - (my - v.y) * k / v.k };
    renderTypes();
  }, { passive: false });
  main.addEventListener('dblclick', e => {
    const n = e.target.closest('[data-node]');
    if (n && S.level === 'types') { S.level = 1; S.scope = 'slice'; select(n.dataset.node); }
  });
  main.addEventListener('change', e => {
    if (e.target.dataset.opt) { tmOpt[e.target.dataset.opt] = e.target.checked; TM.view = TM.view; renderTypes(); }
  });
  main.addEventListener('click', e => {
    if (e.target.id === 'relayout') { TM.pos = {}; TM.view = null; localStorage.removeItem('strata-tpos:' + S.data.label); renderTypes(); }
    if (e.target.id === 'fit') { TM.view = null; renderTypes(); }
  });
}

// ---------- flow map: execution paths from an entry point ----------
S.flowOpen = new Map();
function renderFlow() {
  const F = S.data.flows;
  const tests = S.data.decls.filter(d => d.kind === 'test').map(d => d.name);
  if (!S.flowEntry || !F[S.flowEntry]) S.flowEntry = (S.sel && F[S.sel]) ? S.sel : (S.data.entries[0] || tests[0]);
  const entry = S.flowEntry;
  const lbl = n => byName()[n]?.label ?? n;
  const chips = list => list.map(n => `<a class="echip ${n === entry ? 'on' : ''}" data-entry="${esc(n)}">${esc(lbl(n))}</a>`).join('');
  const f = F[entry];
  const tree = f ? stepsHTML(f.steps, [], [entry], 'r', 0) : '<div class="empty">Select a function or test.</div>';
  $('#main').innerHTML = `<div id="flow">
    <div class="entries"><span class="elab">Entry points</span>${chips(S.data.entries)}</div>
    <div class="entries"><span class="elab">Tests</span>${chips(tests)}</div>
    <div class="ehint">Entry points are functions nothing else uses. Pick any function in the sidebar to trace from it. Effect operations show which handler answers them.</div>
    <div class="froot"><span class="kind k-${byName()[entry]?.kind}">${KIND[byName()[entry]?.kind] || ''}</span> <a data-go="${esc(entry)}" class="fname">${esc(f?.info.sig || entry)}</a></div>
    <div class="ftree">${tree}</div></div>`;
}

function det(path, depth, summary, inner) {
  const open = S.flowOpen.has(path) ? S.flowOpen.get(path) : depth < 3;
  return `<details data-path="${path}" ${open ? 'open' : ''}><summary>${summary}</summary><div class="fkids">${inner}</div></details>`;
}
const leaf = s => `<div class="fleaf">${s}</div>`;

function stepsHTML(steps, ctx, stack, path, depth) {
  if (!steps.length) return leaf('<span class="muted">no calls or effects</span>');
  return steps.map((s, i) => stepHTML(s, ctx, stack, path + '.' + i, depth)).join('');
}

function stepHTML(s, ctx, stack, path, depth) {
  const F = S.data.flows;
  const fnLink = n => `<a data-go="${esc(n)}" class="fname">${esc(n)}</a>`;
  if (s.k === 'call') {
    const f = F[s.f];
    const row = `<span class="fic k-fn">ƒ</span>${fnLink(s.f)}<span class="fargs">(${esc(s.args)})</span>`;
    const trace = `<a class="retarget" data-entry="${esc(s.f)}" title="trace from here">⤷</a>`;
    if (stack.includes(s.f)) return leaf(row + ' <span class="badge muted">recursive</span>');
    if (!f) return leaf(row);
    if (f.info.hole) return leaf(row + ' <span class="badge warn">hole: not implemented yet</span>');
    if (!f.steps.length) return leaf(row + ' <span class="muted">· pure, no further calls</span>');
    return det(path, depth + 1, row + trace, stepsHTML(f.steps, ctx, [...stack, s.f], path, depth + 1));
  }
  if (s.k === 'perform') {
    let j = ctx.length - 1;
    while (j >= 0 && ctx[j].effect !== s.effect) j--;
    const row = `<span class="fic k-effect">⚡</span><span class="eff">${esc(s.effect)}.${esc(s.op)}</span><span class="fargs">(${esc(s.args)})</span>`;
    if (j < 0) {
      const declared = (F[stack[0]]?.info.effects || []).some(e => e.split('[')[0] === s.effect);
      return leaf(row + (declared ? ` <span class="badge muted">provided by whoever calls ${esc(stack[0])}</span>` : ' <span class="badge bad">no handler</span>'));
    }
    const h = ctx[j];
    if (h.mock) return leaf(row + ` <span class="badge muted">mock in ${esc(h.owner)}</span>`);
    const c = h.clauses.find(c => c.op === s.op);
    const tag = ` <span class="badge handled">→ handler in ${esc(h.owner)}${h.stateful ? ' (stateful)' : ''}</span>`;
    if (!c || !c.steps.length) return leaf(row + tag);
    return det(path, depth + 1, row + tag, stepsHTML(c.steps, ctx.slice(0, j), stack, path, depth + 1));
  }
  if (s.k === 'handle') {
    const owner = stack[stack.length - 1];
    const inner = ctx.concat(s.handlers.map(h => ({ ...h, owner })));
    const names = s.handlers.map(h => `<span class="eff">${esc(h.effect)}</span>${h.mock ? ' (mock)' : h.stateful ? ' (stateful)' : ''}`).join(', ');
    let body = stepsHTML(s.body, inner, stack, path + 'b', depth);
    if (s.returns.length) body += `<div class="fnote">then, as the handlers return:</div>` + stepsHTML(s.returns, ctx, stack, path + 'r', depth);
    return det(path, depth, `<span class="fic">⛨</span>handle with ${names}`, body);
  }
  if (s.k === 'branch') {
    const arms = s.arms.map((a, k) => a.steps.length
      ? det(path + 'a' + k, depth, `<span class="arm">${esc(a.label)} ⇒</span>`, stepsHTML(a.steps, ctx, stack, path + 'a' + k, depth))
      : leaf(`<span class="arm">${esc(a.label)} ⇒</span> <span class="muted">—</span>`)).join('');
    return det(path, depth, `<span class="fic">◇</span><span class="muted">${esc(s.on)}</span> <span class="badge muted">${s.arms.length} paths</span>`, arms);
  }
  if (s.k === 'each') {
    return det(path, depth, `<span class="fic">↻</span><span class="muted">for each element of ${esc(s.over)} (${esc(s.via)})</span>`, stepsHTML(s.steps, ctx, stack, path, depth));
  }
  return '';
}
document.addEventListener('toggle', e => { if (e.target.dataset?.path) S.flowOpen.set(e.target.dataset.path, e.target.open); }, true);

function verdictBox(v) {
  if (!v) return '';
  if (v.status === 'fuzzed') return `<div class="box ok">✓ Every contract held on <b>${v.cases}</b> generated inputs${v.discarded ? ` (${v.discarded} discarded by requires)` : ''}.</div>`;
  if (v.status === 'counterexample') return `<div class="box bad"><b>✗ ${esc(v.kind)} violation</b>
      <div class="row"><b>input</b> <code>${esc(JSON.stringify(v.args))}</code></div>
      ${v.effects?.length ? `<div class="row"><b>effects</b> <code>${esc(JSON.stringify(v.effects))}</code></div>` : ''}
      <div class="row mono">${esc(v.message)}</div></div>`;
  if (v.status === 'incomplete') return `<div class="box warn">○ ${esc(v.message)}</div>`;
  return `<div class="box">– ${esc(v.reason)}</div>`;
}

function renderRight() {
  const d = S.sel && byName()[S.sel];

    insp = `<div class="sec"><h3><span>${d.kind}</span><span>#${d.hash.slice(0, 8)}</span></h3>

          ${h.obligations.map(o => `<div class="row"><b>must</b> <code>${esc(o)}</code></div>`).join('')}</div>`).join('')}

      <div class="sec"><h3>Uses</h3>${refs(d.deps)}</div>

      ${history.length ? `<div class="sec"><h3>History</h3>${history.map(({ e, c }) =>
        `<div class="log-e"><span class="when">${ago(e.time)}</span><div class="msg">${esc(e.message)}</div>
         <div class="ch"><span class="tag ${tagCls(c)}">${tagTxt(c)}</span>${c.new ? '#' + c.new.slice(0, 8) : ''}</div></div>`).join('')}</div>` : ''}`;
  }
  const log = S.data.log.map((e, i) => ({ e, i })).reverse().slice(0, 30);
  const act = log.length ? log.map(({ e, i }) => `<div class="log-e ${i >= S.newLog ? 'new' : ''}"><span class="when">${ago(e.time)}</span><div class="msg">${esc(e.message)}</div>
      ${(e.changes || []).slice(0, 8).map(c => `<div class="ch" data-go="${esc(c.name)}"><span class="tag ${tagCls(c)}">${tagTxt(c)}</span><span class="n">${esc(c.name)}</span></div>`).join('')}
      ${(e.changes || []).length > 8 ? `<div class="empty">+ ${(e.changes.length - 8)} more</div>` : ''}</div>`).join('')
    : '<div class="empty">No history (viewing a file, or nothing committed yet).</div>';
  $('#right').innerHTML = insp + `<div class="sec"><h3><span>Activity</span><span>${S.data.log.length} patches</span></h3>${act}</div>`;
}
const tagTxt = c => c.old == null ? '+ added' : c.new == null ? '− removed' : c.interface_changed ? '~ interface' : '~ impl';
const tagCls = c => c.old == null ? 'add' : c.new == null ? 'del' : c.interface_changed ? 'iface' : '';
function ago(t) {
  if (!t) return '';
  const s = Date.now() / 1000 - t;
  return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago';
}

function syncHash() {
  const h = new URLSearchParams({ level: S.level, ...(S.sel ? { sel: S.sel } : {}), ...(S.scope !== 'all' ? { scope: S.scope } : {}) });
  history.replaceState(null, '', '#' + h);
}
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('level')) S.level = lv(h.get('level'));
  if (h.has('sel')) S.sel = h.get('sel');
  if (h.has('scope')) S.scope = h.get('scope');
})();

function render() {
  if (!S.data) return;
  syncHash();
  const scroll = $('#main').scrollTop;
  renderHeader(); renderLeft();
  S.level === 'types' ? renderTypes() : S.level === 'flow' ? renderFlow() : renderCode();
  renderRight();
  $('#main').scrollTop = scroll;
}

// ---------- live polling ----------
async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const txt = await r.text();
    $('#live').classList.remove('off'); $('#live span').textContent = 'live';
    if (txt !== S.raw) {
      S.raw = txt;
      const data = JSON.parse(txt);
      if (data.fatal) { $('#banner').innerHTML = `<div class="err">${esc(data.fatal)}</div>`; return; }
      if (S.data) {
        for (const d of data.decls) if (S.prevHash[d.name] && S.prevHash[d.name] !== d.hash || !S.prevHash[d.name]) S.flash.add(d.name);
        S.newLog = S.prevLog;
        setTimeout(() => { S.flash.clear(); }, 2500);
      } else S.newLog = data.log.length;
      S.prevHash = Object.fromEntries(data.decls.map(d => [d.name, d.hash]));
      S.prevLog = data.log.length;
      S.data = data;
      if (S.sel && !byName()[S.sel]) S.sel = null;
      render();
    }
  } catch (e) {
    $('#live').classList.add('off'); $('#live span').textContent = 'disconnected';
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-card-level],[data-go],[data-pick],[data-l],[data-s],[data-entry]');
  if (!t) return;
  if (t.dataset.cardLevel) { S.over[t.dataset.name] = +t.dataset.cardLevel; render(); return; }
  if (t.dataset.l) { S.level = lv(t.dataset.l); S.over = {}; render(); return; }
  if (t.dataset.entry) { S.flowEntry = t.dataset.entry; S.sel = t.dataset.entry; render(); return; }
  if (t.dataset.s) { if (!t.disabled) { S.scope = t.dataset.s; render(); } return; }
  if (t.dataset.go) { if (S.level === 'flow' && e.target.closest('#left') && S.data.flows[t.dataset.go]) S.flowEntry = t.dataset.go; select(t.dataset.go, typeof S.level === 'number'); return; }
  if (t.dataset.pick) select(t.dataset.pick, false);
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.value = ''; S.q = ''; e.target.blur(); render(); } return; }
  if ('123'.includes(e.key)) { S.level = +e.key; S.over = {}; render(); }
  else if (e.key === 't' || e.key === '0') { S.level = 'types'; render(); }
  else if (e.key === 'f') { S.level = 'flow'; render(); }
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') { S.sel = null; S.scope = 'all'; render(); }
});
tmEvents();
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
