  setHtml($('#main'), `<div id="pr">${head}${bar}<div class="pr-desc md">${v.body ? md(v.body) : '<span class="muted">No description.</span>'}</div>
    ${events.map(e => e.html).join('')}
    ${commits ? `<h2 class="sect">Commits <span class="muted">${v.commits.length}</span></h2>${commits}` : ''}</div>`);
}
function renderPrRight() {
  const v = PR.view;
  if (!v || v.error) { setHtml($('#right'), ''); return; }
  const open = v.state === 'OPEN';
  const { n, total } = checksSummary(v);
  const ms = { CLEAN: ['okc', 'ready to merge'], BEHIND: ['warnc', 'behind its base (updated first)'], BLOCKED: ['warnc', 'blocked: reviews or checks'], DIRTY: ['badc', 'has conflicts'], UNSTABLE: ['warnc', 'checks failing'], HAS_HOOKS: ['okc', 'ready'], DRAFT: ['muted', 'draft'], UNKNOWN: ['muted', 'GitHub is working it out'] }[v.mergeStateStatus] || ['muted', (v.mergeStateStatus || '').toLowerCase()];
  const checks = (v.statusCheckRollup || []).map(c => { const [cl, ic] = checkIcon(c); const url = c.detailsUrl || c.targetUrl; return `<div class="ck"><span class="ic ${cl}">${ic}</span><span class="nm3" title="${esc((c.workflowName ? c.workflowName + ' / ' : '') + (c.name || c.context))}">${esc(c.name || c.context)}</span>${url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer" title="details">${icon('external')}</a>` : ''}</div>`; }).join('');
  const runs = (v.runs || []).slice(0, 4).map(r => { const [cl, ic] = checkIcon(r); return `<div class="ck"><span class="ic ${cl}">${ic}</span><span class="nm3">${esc(r.name)} · ${esc((r.headSha || '').slice(0, 7))} · ${when(r.createdAt)}</span><a href="${esc(r.url)}" target="_blank" rel="noreferrer" title="details">${icon('external')}</a></div>`; }).join('');
  const res = PR.result ? `<div class="mlog">${PR.result.error ? `<div class="bad">${esc(PR.result.error)}</div>` : ''}${(PR.result.log || []).map(l => `<div class="${l.ok ? 'ok' : 'bad'}">${l.ok ? '✓' : '✗'} #${esc(l.pr)} ${esc(l.step)}</div>${l.out ? `<div class="o">${esc(String(l.out).slice(0, 400))}</div>` : ''}`).join('')}${PR.result.ok && PR.result.out !== undefined ? `<div class="ok">✓ done</div>` : ''}${PR.result.merged ? `<div class="${PR.result.ok ? 'ok' : 'bad'}">${PR.result.ok ? 'merged ' : 'merged so far: '}${PR.result.merged.map(m => '#' + m).join(', ') || 'none'}</div>` : ''}</div>` : '';
  const stackN = v.below.length + 1;
  setHtml($('#right'), `<div class="pr-act"><h3>Checks <span>${total ? `${n.ok}/${total}${n.bad ? ` · <span class="badc">${n.bad} failing</span>` : ''}${n.run ? ` · ${n.run} running` : ''}` : 'none'}</span></h3>${checks}${runs ? `<div class="lbl3">CI runs</div>${runs}` : ''}</div>
    ${open ? `<div class="pr-act"><h3>Merge</h3><div class="${ms[0]}" style="font-size:12px">${esc(ms[1])}${v.reviewDecision ? ` · ${esc(v.reviewDecision.replace(/_/g, ' ').toLowerCase())}` : ''}</div>
      <div class="row2"><button class="btn primary small" data-prmerge="one" ${PR.busy ? 'disabled' : ''}>${icon('merge')}Merge into ${esc(v.baseRefName)}</button>${v.below.length ? `<button class="btn small" data-prmerge="stack" ${PR.busy ? 'disabled' : ''} title="top-down: #${v.number} into ${esc(v.baseRefName)}, then ${v.below.map(p => '#' + p.number).join(', then ')}">${icon('layers')}Merge the stack (${stackN}, top-down)</button>` : ''}</div></div>
    <div class="pr-act"><h3>Review</h3><textarea id="pr-text" rows="4" placeholder="Leave a comment (markdown)"></textarea>
      <div class="row2"><button class="btn small" data-pract="comment" ${PR.busy ? 'disabled' : ''}>${icon('message')}Comment</button><button class="btn small primary" data-pract="approve" ${PR.busy ? 'disabled' : ''}>${icon('check')}Approve</button><button class="btn small danger" data-pract="request_changes" ${PR.busy ? 'disabled' : ''}>${icon('alert')}Request changes</button></div></div>` : ''}
    ${PR.busy || res ? `<div class="pr-act">${PR.busy ? `<div class="muted">${esc(PR.busy)}…</div>` : ''}${res}</div>` : ''}`);
  const ta = $('#pr-text');
  if (ta && ta.value !== PR.draft && document.activeElement !== ta) ta.value = PR.draft;
  if (ta && !ta._wired) { ta._wired = true; ta.addEventListener('input', e => PR.draft = e.target.value); }
}
function renderPrs() {
  $('#path').textContent = CFG.repo ? CFG.repo.replace(/^\/Users\/[^/]+/, '~') : '';
  if (PR.list === null && !PR.loading) { PR.loading = true; loadPrs().finally(() => PR.loading = false); }
  renderPrList(); renderPrMain(); renderPrRight();
}
async function prAction(kind, arg) {
  const v = PR.view, n = v.number, body = PR.draft;
  let path, payload, ask;
  if (kind === 'merge') {
    const stack = arg === 'stack';
    ask = stack ? `Merge the stack top-down: #${n} into ${v.baseRefName}, then ${v.below.map(p => `#${p.number} into ${p.baseRefName}`).join(', then ')}?` : `Merge #${n} into ${v.baseRefName}?`;
    path = `/api/prs/${n}/merge`; payload = { stack };
  } else if (kind === 'comment') {
    if (!body.trim()) { PR.result = { error: 'Write the comment first.' }; render(); return; }
    path = `/api/prs/${n}/comment`; payload = { body };
  } else {
    if (kind === 'request_changes' && !body.trim()) { PR.result = { error: 'Say what should change.' }; render(); return; }
    ask = kind === 'approve' ? `Approve #${n}?` : null;
    path = `/api/prs/${n}/review`; payload = { event: kind, body };
  }
  if (ask && !confirm(ask)) return;
  PR.busy = kind === 'merge' ? 'Merging' : 'Sending'; PR.result = null; render();
  const r = await api(path, payload).catch(e => ({ error: String(e) }));
  PR.busy = ''; PR.result = r;
  if (!r.error && kind !== 'merge') PR.draft = '';
  render();
  if (!r.error) loadPr(n, true);
}

// ---------- clicks in the workspace ----------
function workspaceClick(e) {
  const t = e.target.closest('[data-mode],[data-rtab],[data-actb],[data-actc],[data-actu],[data-actdef],[data-actopen],[data-actclear],[data-sess],[data-newsess],[data-nsgo],[data-dlgclose],[data-send],[data-cancel],[data-stop],[data-perm],[data-agdef],[data-symtoggle],[data-past],[data-pastall],[data-resume],[data-tool],[data-toolall],[data-pr],[data-prstate],[data-prreload],[data-prview],[data-pract],[data-prmerge]');
  if (!t) return false;
  const d = t.dataset;
  e.preventDefault();
  if (d.mode) { toggleMode(d.mode); render(); if (S.mode === 'both') { const s = AG.list.find(x => x.id === AG.sel); if (s) loadSnap(s); } return true; }
  if (d.rtab) { S.rtab = d.rtab; render(); return true; }
  if (d.actopen !== undefined) { e.stopPropagation(); ACT.open.has(d.actopen) ? ACT.open.delete(d.actopen) : ACT.open.add(d.actopen); render(); return true; }
  if (d.actb !== undefined) { const br = ACT.data.branches.find(b => b.name === d.actb); actSelect(br && actBranchSel(br)); return true; }
  if (d.actc !== undefined) { for (const br of ACT.data.branches) for (const c of br.commits) if (c.sha === d.actc) { actSelect(actCommitSel(c)); return true; } return true; }
  if (d.actu !== undefined) { const br = ACT.data.branches.find(b => b.name === d.actu); actSelect(br?.uncommitted && actUncSel(br)); return true; }
  if (d.actdef !== undefined) {
    const [sha, name] = [d.actdef.slice(0, d.actdef.indexOf('|')), d.actdef.slice(d.actdef.indexOf('|') + 1)];
    let sel = null;
    if (sha.startsWith('u:')) { const br = ACT.data.branches.find(b => b.name === sha.slice(2)); sel = br && { ...actUncSel(br), def: name }; }
    else for (const br of ACT.data.branches) for (const c of br.commits) if (c.sha === sha) sel = actCommitSel(c, name);
    if (sel && ACT.sel?.key === sel.key) { CH.sel = name; render(); document.getElementById('ch-' + CSS.escape(name))?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    else actSelect(sel);
    return true;
  }
  if (d.actclear !== undefined) { ACT.sel = null; ACT.diff = null; render(); return true; }
  if (d.sess) { AG.sel = +d.sess; render(); loadSnap(AG.list.find(x => x.id === AG.sel)); return true; }
  if (d.newsess !== undefined) { newSessionDialog(); return true; }
  if (d.nsgo !== undefined) { startSession(); return true; }
  if (d.dlgclose !== undefined) { closeDialog(); return true; }
  if (d.send !== undefined) { sendPrompt(); return true; }
  if (d.cancel !== undefined) { api(`/api/agents/${AG.sel}/cancel`, {}); return true; }
  if (d.stop !== undefined) { if (confirm('End this session? The agent process is stopped.')) api(`/api/agents/${AG.sel}/stop`, {}); return true; }
  if (d.perm) { const opt = d.opt || null; api(`/api/agents/${d.perm}/answer`, { rpc: JSON.parse(d.rpc), option: opt }).then(r => r.error && banner(r.error)); t.closest('.perm').style.opacity = .5; return true; }
  if (d.agdef !== undefined) { ACT.sel = null; S.scope = 'slice'; select(d.agdef || null); return true; }
  if (d.tool) { const el = t.closest('.tool'); AG.toolOpen.set(d.tool, !el.classList.contains('open')); render(); return true; }
  if (d.toolall) { AG.toolAll.add(d.toolall); render(); return true; }
  if (d.past) { openPast(d.past); return true; }
  if (d.pastall !== undefined) { AG.pastOpen = true; render(); return true; }
  if (d.resume) { resumePast(d.resume); return true; }
  if (d.symtoggle !== undefined) { AG.symbols = !AG.symbols; localStorage.setItem('strata-symbols', AG.symbols ? '1' : '0'); render(); return true; }
  if (d.pr) { S.mode = 'prs'; loadPr(+d.pr); return true; }
  if (d.prstate) { PR.state = d.prstate; PR.list = null; loadPrs(); return true; }
  if (d.prview) { PR.showDiff = d.prview === 'diff'; render(); if (PR.showDiff) loadPrDiff(); $('#main').scrollTop = 0; return true; }
  if (d.prreload !== undefined) { loadPrs(); if (PR.sel) loadPr(PR.sel, true); return true; }
  if (d.pract) { prAction(d.pract); return true; }
  if (d.prmerge) { prAction('merge', d.prmerge); return true; }
  return false;
}
document.addEventListener('change', e => { if (e.target.id === 'auto' && AG.sel) api(`/api/agents/${AG.sel}/auto`, { on: e.target.checked }); });


// never fail silently: show viewer errors in the banner
window.addEventListener('error', e => { $('#banner').innerHTML = `<div class="err">viewer error: ${esc(e.message)} (line ${e.lineno})</div>`; });
const _render = render;
render = function () { try { _render(); } catch (err) { $('#banner').innerHTML = `<div class="err">viewer error: ${esc(err.message)} ${esc((err.stack || '').split('\n')[1] || '')}</div>`; } };
readHash();
tmEvents();
render();
pollLoop();
actLoop();
agentsLoop();
</script>
