# GitHub doesn't run custom merge drivers, so a pull request is checked on
# GitHub's merge ref (refs/pull/N/merge, what actions/checkout uses for
# pull_request events): the branch merged with its base, as it would land.
# Make the `strata ci` job a required check and require branches to be up to
# date before merging; `strata sync main` brings a branch up to date locally,
# with the merge driver.
#
# `cargo test` is not run here: the tests are run locally, each change running
# the ones for what it touches (CLAUDE.md). CI runs `strata ci` (every package
# and script type-checks, every .strata file is canonical) when a change can
# break it: Rust (src/, tests/, Cargo files, build.rs, std/, which is compiled
# into strata, or this workflow), .strata files or packages (examples/,
# tests/data/). Anything else (docs, IDEAS.md, site/) checks nothing; a job
# skipped by its `if` counts as passed for a required check. A push to main
# checks everything.
name: strata

on:
  pull_request:
  push:
    branches: [main]

# a new push to a pull request cancels its run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# strata links LLVM 23's libraries in (the JIT), so every build installs them.
env:
  LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      strata: ${{ github.event_name == 'push' || steps.filter.outputs.strata == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'std/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/**'
            strata:
              - '**/*.strata'
              - '**/strata.toml'
              - 'examples/**'

  strata-ci:
    name: strata ci
    needs: changes
    if: needs.changes.outputs.strata == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev libzstd-dev zlib1g-dev
      - run: cargo build --release
      - run: ./target/release/strata ci
