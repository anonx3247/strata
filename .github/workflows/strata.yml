# GitHub doesn't run custom merge drivers, so a pull request is checked on
# GitHub's merge ref (refs/pull/N/merge, what actions/checkout uses for
# pull_request events): the branch merged with its base, as it would land.
# Make the `strata ci` job a required check and require branches to be up to
# date before merging; `strata sync main` brings a branch up to date locally,
# with the merge driver.
#
# strata links LLVM 23's libraries in (the JIT), so every job installs them.
name: strata

on:
  pull_request:
  push:
    branches: [main]

env:
  LLVM_SYS_231_PREFIX: /usr/lib/llvm-23

jobs:
  strata-ci:
    name: strata ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev libzstd-dev zlib1g-dev
      - run: cargo build --release
      # every package and script type-checks, every .strata file is canonical
      - run: ./target/release/strata ci

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # LLVM 23's libraries; the SMT tests need z3 (without it they are skipped)
      - run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev libzstd-dev zlib1g-dev z3
      - run: cargo test --release
