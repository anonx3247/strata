<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { position: static !important; height: auto !important; } }
  aside { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--bg2); padding: 26px 22px; }
  aside .home { font: 600 22px var(--display); color: var(--text); display: block; margin-bottom: 4px; letter-spacing: -.02em; }
  aside .home:hover { text-decoration: none; color: var(--accent); }
  aside .sub { font-size: 13px; color: var(--muted); margin-bottom: 26px; }
  aside .doc { display: block; padding: 8px 12px; border-radius: 9px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
  aside .doc.on { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line2); }
  aside .doc:hover { text-decoration: none; color: var(--text); }
  aside .toc { margin: 6px 0 14px 12px; border-left: 1px solid var(--line2); padding-left: 10px; }
  aside .toc a { display: block; font-size: 13px; color: var(--muted); padding: 3px 0; line-height: 1.35; }
  aside .toc a.h3 { padding-left: 12px; font-size: 12.5px; }
  aside .toc a.on { color: var(--accent); }
  article { max-width: 980px; padding: 60px 6vw 120px; }
  article > h1 { font-size: clamp(38px, 4vw, 56px); margin-bottom: 24px; }
  article h2 { font-size: 32px; margin: 64px 0 16px; max-width: none; scroll-margin-top: 20px; }
  article h3 { font-size: 21px; margin: 40px 0 12px; scroll-margin-top: 20px; }
  article h4 { font: 600 16px var(--sans); margin: 28px 0 8px; }
  article p, article li { color: #cfcec8; }
  article li { margin: 6px 0; }
  article strong { color: var(--text); }
  article blockquote { margin: 20px 0; padding: 12px 18px; border-left: 3px solid var(--accent2); background: #f0b45c0d; border-radius: 0 10px 10px 0; color: var(--muted); }
  article img { max-width: 100%; border-radius: 12px; border: 1px solid var(--line2); margin: 10px 0; }
  article a.shot img { width: min(1300px, calc(100vw - 290px - 12vw)); max-width: none; cursor: zoom-in; }
  article table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 15px; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
  article th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  pre.code { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; font: 13.5px/1.6 var(--mono); overflow: auto; margin: 20px 0; }
  pre.code[data-lang]::before { content: attr(data-label); position: absolute; top: 8px; right: 12px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  pre.code .term-line { min-height: 1.6em; }
  .pager { display: flex; justify-content: space-between; margin-top: 70px; gap: 14px; }
  .pager a { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--text); }
  .pager a:hover { border-color: var(--accent); text-decoration: none; }
  .pager a span { display: block; color: var(--muted); font-size: 13px; }
  .pager a.next { text-align: right; }
</style>
</head>
<body>
<aside>
  <a class="home" href="index.html">← Strata</a>
  <div class="sub">the docs, from <code>docs/</code></div>
  <div id="docnav"></div>
</aside>
<article id="doc"></article>
<script>window.STRATA = {};</script>
<script src="data/docs.js"></script>
<script src="common.js"></script>
<script>
const ORDER = ['learn-strata', 'verification', 'tools'];
const id = new URLSearchParams(location.search).get('d') || 'learn-strata';
const doc = STRATA.docs[id] || STRATA.docs['learn-strata'];
document.title = `${doc.title} · Strata`;
$('#docnav').innerHTML = ORDER.map(k => `<a class="doc ${k === id ? 'on' : ''}" href="docs.html?d=${k}">${esc(STRATA.docs[k].title)}</a>` +
  (k === id && doc.toc.length ? `<div class="toc">${doc.toc.map(t => `<a class="h${t.n}" href="#${t.id}">${esc(t.text)}</a>`).join('')}</div>` : '')).join('');
const i = ORDER.indexOf(id), prev = ORDER[i - 1], next = ORDER[i + 1];
$('#doc').innerHTML = `<h1>${esc(doc.title)}</h1>${doc.html}<div class="pager">${prev ? `<a href="docs.html?d=${prev}"><span>← previous</span>${esc(STRATA.docs[prev].title)}</a>` : '<span></span>'}${next ? `<a class="next" href="docs.html?d=${next}"><span>next →</span>${esc(STRATA.docs[next].title)}</a>` : ''}</div>`;
// highlight: Strata code (fenced as rust), terminal output, shell, toml
const LABEL = { rust: 'strata', text: 'output', sh: 'shell', toml: 'toml' };
for (const pre of $$('pre.code')) {
  const lang = pre.dataset.lang, src = pre.textContent;
  pre.dataset.label = LABEL[lang] || lang;
  if (lang === 'rust' || lang === 'strata') pre.innerHTML = hl(src);
  else if (lang === 'text') { if (/^\$ |^[✓✗~○] /m.test(src)) pre.innerHTML = term(src); }
  else if (lang === 'sh' || lang === 'toml') pre.innerHTML = shHtml(src);
}
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
// the table of contents follows the reading position
const heads = $$('article h2, article h3');
addEventListener('scroll', () => {
  let cur = heads[0];
  for (const h of heads) if (h.getBoundingClientRect().top < 120) cur = h;
  $$('.toc a').forEach(a => a.classList.toggle('on', cur && a.hash === '#' + cur.id));
}, { passive: true });
</script>
</body>
</html>
